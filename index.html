    S.name=el.querySelector("#pName").value.trim(); S.examDate=el.querySelector("#pExam").value; S.intDate=el.querySelector("#pInt").value;
    const nl=el.querySelector("#pLang").value; const changed=nl!==S.lang; S.lang=nl; save();
    if(changed){renderShell();go("acc");} else el.querySelector("#profFlash").textContent=T("saved"); };
  el.querySelector("#copyC").onclick=async()=>{const ta=el.querySelector("#codeOut"); try{await navigator.clipboard.writeText(ta.value);el.querySelector("#copyC").textContent=T("copied");}catch(e){ta.focus();ta.select();}};
  el.querySelector("#impC").onclick=()=>{const f=el.querySelector("#impFlash");
    try{const d=JSON.parse(decodeURIComponent(escape(atob(el.querySelector("#codeIn").value.trim())))); if(!d||!Array.isArray(d.done)) throw 0;
      S.done=[...new Set([...S.done,...d.done.filter(x=>typeof x==="number")])]; S.fc=Object.assign({},S.fc,d.fc||{}); if(typeof d.best==="number") S.best=Math.max(S.best??0,d.best);
      save(); progress(); f.className="flash"; f.textContent=T("importOk");}catch(e){f.className="flash err";f.textContent=T("importErr");}};
  el.querySelector("#reset").onclick=()=>{const b=el.querySelector("#resetBox"); b.innerHTML=`<button class="btn sm red" id="resetY">${T("resetConfirm")}</button> <button class="btn sm" id="resetN">${T("cancel")}</button>`;
    b.querySelector("#resetN").onclick=()=>b.innerHTML="";
    b.querySelector("#resetY").onclick=()=>{S.done=[];S.fc={};S.best=null;S.last=1;save();progress();b.innerHTML=`<span class="flash">${T("resetDone")}</span>`;};};
  const lf=el.querySelector("#loginF");
  if(lf) lf.onsubmit=async e=>{e.preventDefault(); const em=el.querySelector("#email").value.trim(); const f=el.querySelector("#loginFlash");
    const {error}=await Cloud.signIn(em); f.className="flash"+(error?" err":""); f.textContent=error?error.message:T("linkSent",{e:em});};
  const so=el.querySelector("#signOut"); if(so) so.onclick=async()=>{await Cloud.signOut();renderTabs();go("acc");};
  const da=el.querySelector("#delAcc"); if(da) da.onclick=()=>{const b=el.querySelector("#delBox"); b.innerHTML=`<div class="row" style="margin-top:10px"><button class="btn sm red" id="delY">${T("confirmDel")}</button><button class="btn sm" id="delN">${T("cancel")}</button></div><div class="flash" id="delFlash"></div>`;
    b.querySelector("#delN").onclick=()=>b.innerHTML="";
    b.querySelector("#delY").onclick=async()=>{const err=await Cloud.del(); const f=b.querySelector("#delFlash"); if(err){f.className="flash err";f.textContent=err.message;} else {renderTabs();go("acc");}};};
}

/* ============================ DONATE ============================ */
function vDon(el){
  const p=CONFIG.paypal, cur=p.currency||"EUR", sym={EUR:"€",USD:"$",GBP:"£",BRL:"R$"}[cur]||cur;
  let body;
  if(p.paypalMe){
    const base="https://paypal.me/"+encodeURIComponent(p.paypalMe);
    body=`<div class="amts">${(p.amounts||[]).map(a=>`<a href="${base}/${a}${cur}" target="_blank" rel="noopener">${a} ${sym}</a>`).join("")}<a class="free" href="${base}" target="_blank" rel="noopener">${T("donFree")}</a></div>`;
    if(QR_SVG) body+=`<figure class="qrcard"><div class="qrhead"><span class="tri"><i></i><i></i><i></i></span><b>${esc(CONFIG.siteName)}</b></div><div class="qr">${QR_SVG}</div><figcaption><b>${T("qrTitle")}</b><span>${T("qrText")}</span><span class="lbl">paypal.me/${esc(p.paypalMe)}</span></figcaption></figure>`;
  } else if(p.hostedButtonId){
    body=`<div class="row" style="margin:18px 0"><a class="btn pri" style="text-decoration:none" href="https://www.paypal.com/donate/?hosted_button_id=${encodeURIComponent(p.hostedButtonId)}" target="_blank" rel="noopener">♥ PayPal</a></div>`;
  } else body=`<div class="call info"><b>PayPal</b>${T("donOff")}</div>`;
  el.innerHTML=`<div class="don"><span class="lbl">${T("tabs.don")}</span><h2 style="margin-top:6px">${T("donTitle")}</h2>
  <p class="muted">${T("donText")}</p>${body}
  <p class="note">${T("donVia")}</p>${CONFIG.maintainer?`<p class="note">— ${esc(CONFIG.maintainer)}</p>`:""}
  <p style="font-family:var(--serif);font-size:1.2rem;margin-top:24px">${T("donThanks")}</p></div>`;
}

/* ============================ ADMIN ============================ */
async function vAdm(el){
  el.innerHTML=`<span class="lbl">${T("tabs.adm")}</span><h2 style="margin-top:6px">${T("admTitle")}</h2><div id="admBody"><p class="muted">…</p></div>`;
  const box=el.querySelector("#admBody");
  try{
    const rows=await Cloud.adminList(); const now=Date.now();
    const active=rows.filter(r=>now-new Date(r.updated_at)<7*864e5).length;
    const avg=rows.length?Math.round(rows.reduce((s,r)=>s+((r.progress&&r.progress.done||[]).length),0)/rows.length/TOTAL*100):0;
    const byL={}; rows.forEach(r=>byL[r.lang||"?"]=(byL[r.lang||"?"]||0)+1);
    box.innerHTML=`<div class="stats"><div><b>${rows.length}</b><span>${T("admUsers")}</span></div><div><b>${active}</b><span>${T("admActive")}</span></div><div><b>${avg} %</b><span>${T("admAvg")}</span></div><div><b>${Object.entries(byL).map(([k,v])=>k.toUpperCase()+" "+v).join(" · ")||"—"}</b><span>${T("admByLang")}</span></div></div>
    <div class="row" style="margin-bottom:10px"><button class="btn sm" id="admR">${T("admRefresh")}</button></div>
    ${rows.length?`<div class="tscroll"><table class="t"><thead><tr><th>${T("admName")}</th><th>${T("lang")}</th><th>${T("admDays")}</th><th>${T("admBest")}</th><th>${T("admUpd")}</th></tr></thead><tbody>
    ${rows.map(r=>{const p=r.progress||{};return `<tr><td>${esc(r.display_name||T("anon"))}</td><td>${esc((r.lang||"").toUpperCase())}</td><td>${(p.done||[]).length}/${TOTAL}</td><td>${p.best!=null?p.best+"/40":"—"}</td><td>${new Date(r.updated_at).toLocaleDateString(S.lang)}</td></tr>`;}).join("")}</tbody></table></div>`:`<p class="muted">${T("admNone")}</p>`}`;
    const rb=box.querySelector("#admR"); if(rb) rb.onclick=()=>vAdm(el);
  }catch(e){ box.innerHTML=`<p class="flash err">${esc(e.message||e)}</p>`; }
}

/* ============================ INIT ============================ */
renderShell();
const h=(location.hash||"").replace("#","");
go(VIEWS.includes(h)&&h!=="adm"?h:"home");
Cloud.init().finally(()=>{ if(authHash){ authHash=false; try{history.replaceState(null,"","#"+view);}catch(e){} } });

</script>
