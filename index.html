<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parcours Citoyen</title>
<meta name="description" content="Free course for the French civic exam and naturalisation interview — Portuguese, English, French.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface2:#EEF1F6; --ink:#16213A; --muted:#5A6479; --line:#DCE1EA;
  --accent:#23408E; --accent-soft:#E3E9F7; --on-accent:#FFFFFF; --rouge:#B3323B; --rouge-soft:#F7E4E5;
  --good:#2F7D5B; --good-soft:#E1F1E9; --warn:#9A6A12; --warn-soft:#F7EED9;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0E1422; --surface:#161F32; --surface2:#1C2740; --ink:#E6EAF2; --muted:#9BA5B9; --line:#2A3654;
  --accent:#93AAF0; --accent-soft:#233257; --on-accent:#0E1422; --rouge:#E57A83; --rouge-soft:#3A2129; --good:#6CC49B; --good-soft:#193628; --warn:#E0B458; --warn-soft:#3A301A;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0E1422; --surface:#161F32; --surface2:#1C2740; --ink:#E6EAF2; --muted:#9BA5B9; --line:#2A3654;
  --accent:#93AAF0; --accent-soft:#233257; --on-accent:#0E1422; --rouge:#E57A83; --rouge-soft:#3A2129; --good:#6CC49B; --good-soft:#193628; --warn:#E0B458; --warn-soft:#3A301A;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 40px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3.2vw,2rem)} h3{font-size:1.25rem}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font:500 .72rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[lang=fr] em,blockquote{font-style:italic}
blockquote{margin:12px 0;padding:12px 18px;border-left:3px solid var(--accent);background:var(--surface);font-family:var(--serif);font-size:1.05rem;border-radius:0 8px 8px 0}
.muted{color:var(--muted)}

header.top{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;color:var(--ink);padding:0}
.tri{display:flex;width:22px;height:16px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.tri i{flex:1}.tri i:nth-child(1){background:#23408E}.tri i:nth-child(2){background:#fff}.tri i:nth-child(3){background:#B3323B}
.brand b{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.prog{display:flex;align-items:center;gap:8px;font:500 .78rem var(--mono);color:var(--muted)}
.bar{width:100px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.langsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langsw button{border:0;background:var(--surface);color:var(--muted);font:600 .78rem var(--mono);padding:5px 8px}
.langsw button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.donbtn{border:1px solid var(--rouge);color:var(--rouge);background:var(--surface);border-radius:8px;padding:5px 11px;font-weight:600;font-size:.85rem}
.donbtn:hover{background:var(--rouge-soft)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;color:var(--muted);padding:9px 11px;font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--rouge)}

.view{padding-top:26px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:600;font-size:.92rem}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.red{border-color:var(--rouge);color:var(--rouge)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start;margin-bottom:30px}
.hero h1{font-size:clamp(1.9rem,4.4vw,2.9rem);margin:6px 0 12px}
.hero p{color:var(--muted);max-width:62ch;margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.nums div{background:var(--surface2);border-radius:8px;padding:10px;text-align:center}
.nums b{display:block;font:600 1.6rem var(--serif);font-variant-numeric:tabular-nums}
.nums span{font-size:.75rem;color:var(--muted)}
.panel ol{margin:0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.count{margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;font-weight:600}
.week{margin-bottom:24px}
.week h3{margin-bottom:10px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.day{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:92px}
.day:hover{border-color:var(--accent)}
.day .n{display:flex;justify-content:space-between;align-items:center;gap:6px}
.day b{font-weight:600;line-height:1.3}
.day.done{background:var(--good-soft);border-color:transparent}
.chk{font:500 .72rem var(--mono);color:var(--good)}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 30px}
.method div{border-top:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 0 8px 8px}
.method div:nth-child(2){border-color:var(--ink)}.method div:nth-child(3){border-color:var(--rouge)}
.method b{display:block}.method span{font-size:.88rem;color:var(--muted)}

.mod{display:grid;grid-template-columns:230px 1fr;gap:30px;align-items:start}
.side{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;border-right:1px solid var(--line);padding-right:10px}
.side button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--muted);font-size:.86rem;line-height:1.35}
.side button .d{font:500 .72rem var(--mono);min-width:28px;padding-top:2px}
.side button.on{background:var(--accent-soft);color:var(--ink)}
.side button.ok .d{color:var(--good)}
article{max-width:720px;min-width:0}
.mhead h2{font-size:clamp(1.6rem,3.5vw,2.2rem);margin:6px 0 8px}
.obj{color:var(--muted);margin:0}
.timer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:14px 0 24px;flex-wrap:wrap}
.timer .clock{font:500 1.4rem var(--mono);font-variant-numeric:tabular-nums;min-width:74px}
.timer .phase{font-size:.85rem;color:var(--muted);margin-right:auto}
.lesson h3{margin:26px 0 8px}
.lesson p,.lesson li{max-width:68ch}
.lesson ul,.lesson ol{padding-left:20px}
.lesson li{margin-bottom:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.facts dt{font:500 .85rem var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.facts dd{margin:0}
.call{border-left:3px solid var(--rouge);background:var(--rouge-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:16px 0}
.call.tip{border-color:var(--good);background:var(--good-soft)}
.call.info{border-color:var(--accent);background:var(--accent-soft)}
.call>b:first-child{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tscroll{overflow-x:auto;margin:14px 0}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--surface)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
table.t td:first-child{font-variant-numeric:tabular-nums}
.rep{display:grid;gap:8px;margin:14px 0}
.rep div{display:grid;grid-template-columns:60px 130px 1fr;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.rep .rn{font:600 1.5rem var(--serif);color:var(--accent)}
.rep .ry{font:500 .85rem var(--mono)}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:14px 0 22px}
.regs div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
.regs b{display:block}.regs span{color:var(--muted);font-size:.82rem}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:10px 0}
.vocab div{background:var(--surface);padding:8px 12px;font-size:.92rem}
.vocab div:nth-child(odd){font-weight:600}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.q p.qt{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:.93rem}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.sel{border-color:var(--accent);background:var(--accent-soft)}
.opts button.right{background:var(--good-soft);border-color:var(--good)}
.opts button.wrong{background:var(--rouge-soft);border-color:var(--rouge)}
.opts button:disabled{cursor:default}
.expl{margin-top:10px;font-size:.9rem;color:var(--muted)}
.traps{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.traps li{background:var(--warn-soft);border-radius:8px;padding:8px 12px 8px 34px;position:relative;font-size:.93rem}
.traps li::before{content:"!";position:absolute;left:12px;top:8px;font:700 .9rem var(--mono);color:var(--warn)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px}

details.iq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.iq summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px}
details.iq summary::-webkit-details-marker{display:none}
details.iq summary::before{content:"+";font-family:var(--mono);color:var(--accent)}
details.iq[open] summary::before{content:"–"}
details.iq .ans{padding:0 16px 14px 36px}
details.iq .ans p{margin:6px 0}
.ans .fr{font-family:var(--serif);font-size:1.05rem}
.ans .pt{font-size:.88rem;color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0 26px}
.tips div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tips b{display:block;margin-bottom:4px}
.tips span{font-size:.9rem;color:var(--muted)}
.cat{margin:26px 0 10px}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phr div{background:var(--surface);padding:8px 12px;font-size:.92rem}
.phr div:nth-child(odd){font-family:var(--serif);font-size:1rem}

.fc-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 20px}
select,input[type=text],input[type=email],input[type=date],input[type=search],textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:80px;font:.8rem var(--mono)}
.card{perspective:1400px;max-width:620px;margin:0 auto;cursor:pointer}
.card-in{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .big{font:600 1.35rem/1.3 var(--serif)}
.face .hint{font-size:.9rem;color:var(--muted)}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--good);color:var(--good)} .btn.rev{border-color:var(--warn);color:var(--warn)}
.counter{text-align:center;font:500 .8rem var(--mono);color:var(--muted);margin-top:12px}

.sim-start{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.sim-start>div{display:flex;flex-direction:column;gap:8px}
.sim-start p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.simbar{position:sticky;top:98px;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.simbar .clock{font:500 1.2rem var(--mono);font-variant-numeric:tabular-nums}
.simbar .clock.low{color:var(--rouge)}
.score .big{font:600 3rem var(--serif);font-variant-numeric:tabular-nums}
.pass{color:var(--good)} .fail{color:var(--rouge)}

.dtools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input[type=search]{flex:1 1 220px;min-width:0}

.form{display:grid;gap:14px;max-width:520px}
.form label{display:grid;gap:4px;font-size:.9rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.note{font-size:.88rem;color:var(--muted)}
.flash{font-size:.88rem;font-weight:600;color:var(--good);min-height:1.4em}
.flash.err{color:var(--rouge)}

.don{max-width:640px}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.amts a{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:16px 8px;font:600 1.4rem var(--serif)}
.amts a:hover{border-color:var(--rouge);background:var(--rouge-soft)}
.amts a.free{font:600 .95rem var(--sans);display:flex;align-items:center;justify-content:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stats b{display:block;font:600 1.8rem var(--serif);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}

footer.site{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:.82rem;color:var(--muted)}
footer.site p{max-width:90ch;margin:0 0 8px}

@media (max-width:860px){
  .hero,.grid2{grid-template-columns:1fr}
  .mod{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;display:flex;overflow-x:auto;gap:4px}
  .side button{width:auto;white-space:nowrap}
  .side button .t{display:none}
  .method{grid-template-columns:1fr}
  .rep div{grid-template-columns:44px 1fr}
  .rep div span:last-child{grid-column:1/-1}
  .prog .bar{display:none}
}
@media (max-width:480px){.donbtn .t{display:none}.brand b{font-size:1.05rem}.wrap{padding-inline:16px}.top-in{padding-inline:16px}.vocab,.phr{grid-template-columns:1fr}.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

details.deep{margin:26px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.deep>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:600;display:flex;gap:10px;align-items:baseline}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"+";font-family:var(--mono);color:var(--accent)}
details.deep[open]>summary::before{content:"–"}
details.deep>.lesson{padding:0 18px 16px;border-top:1px solid var(--line)}
.lesson h4{font-family:var(--serif);font-size:1.08rem;font-weight:600;margin:20px 0 6px}

.qrcard{margin:8px 0 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.qrhead{display:flex;align-items:center;gap:8px;width:100%;font-family:var(--serif);font-size:1.1rem}
.qr{width:168px;max-width:100%;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrcard figcaption{flex:1 1 200px;display:grid;gap:6px}
.qrcard figcaption span:not(.lbl){color:var(--muted);font-size:.92rem}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" aria-label="Home"><span class="tri"><i></i><i></i><i></i></span><b id="brandName">Parcours Citoyen</b></button>
    <div class="prog"><span id="progTxt">0/23</span><span class="bar"><i id="progBar" style="width:0"></i></span></div>
    <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
    <button class="donbtn" id="donBtn">♥</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main class="wrap"><div id="app"></div><footer class="site" id="foot"></footer></main>
<script>
/* =====================================================================
   CONFIGURATION — the only file you need to edit to run your own copy.
   ===================================================================== */
const CONFIG = {
  siteName: "Parcours Citoyen",

  // Optional: your name, shown on the Support page ("Maintained by …"). Leave "" to hide.
  maintainer: "",

  // PayPal donations. Fill ONE of the two:
  //  - paypalMe: your PayPal.Me username (https://paypal.me/USERNAME)  e.g. "mashuca"
  //  - hostedButtonId: the ID of a PayPal "Donate" button created at paypal.com/donate/buttons
  paypal: {
    paypalMe: "mashuca",
    hostedButtonId: "",
    currency: "EUR",
    amounts: [3, 5, 10, 20]
  },

  // Optional cloud accounts (Supabase, free tier). Leave empty to run in local-only mode.
  // See README.md → "Enable accounts".
  supabase: {
    url: "",       // e.g. "https://abcdefgh.supabase.co"
    anonKey: ""    // the public "anon" key (safe to publish; security comes from the SQL policies)
  },

  defaultLang: "auto" // "auto" | "pt" | "en" | "fr"
};

;
const UI = {
pt:{
 tabs:{home:"Início",mods:"Módulos",fc:"Flashcards",sim:"Simulado",int:"Entrevista",dep:"Départements",acc:"Minha conta",don:"Apoiar",adm:"Admin"},
 cat:{proc:"Processo",val:"Valores",hist:"História",inst:"Instituições",terr:"Território",eur:"Europa",droits:"Direitos",soc:"Sociedade",cult:"Cultura",ent:"Entrevista",sim:"Simulado"},
 weeks:["Semana 1 · Processo, valores e laicidade","Semana 2 · História: da Gália à V República","Semana 3 · Instituições, justiça, território e Europa","Semana 4 · Direitos, vida cotidiana, cultura e reta final"],
 eyebrow:"Exame cívico e entrevista de naturalização · programa 2026",
 heroTitle:"23 dias, 15 minutos por dia, rumo à nacionalidade francesa.",

1:{t:"Como funciona a naturalização em 2026",obj:"Entender as etapas, o formato do exame cívico e da entrevista, e como usar esta plataforma em 15 minutos por dia.",
html:`<h3>As etapas, em ordem</h3>
<ol>
<li><b>Condições</b>: em geral, 5 anos de residência regular na França (reduzidos em alguns casos, como 2 anos após um diploma de ensino superior francês), recursos estáveis, estar em dia com impostos, não ter condenações graves.</li>
<li><b>Dossiê online</b> na plataforma ANEF do Ministério do Interior: estado civil, residência, renda, impostos, diploma de francês e atestado do exame cívico.</li>
<li><b>Nível de francês B2</b> (desde 1º/01/2026; antes era B1), comprovado por diploma ou teste reconhecido (TCF, TEF…).</li>
<li><b lang="fr">Examen civique</b>: QCM em francês, em tela, num centro aprovado (CCI Paris Île-de-France ou France Éducation International). <b>40 questões, 45 minutos, mínimo 32 acertos (80 %)</b>: 28 questões de conhecimento + 12 situações práticas (<span lang="fr">mises en situation</span>).</li>
<li><b lang="fr">Entretien d’assimilation</b> na prefeitura: conversa em francês sobre seu percurso, motivação, conhecimento da França e adesão aos valores republicanos.</li>
<li><b>Decisão</b> por decreto publicado no <span lang="fr">Journal officiel</span> (ou recusa/adiamento motivado).</li>
<li><b lang="fr">Cérémonie d’accueil</b>: entrega do decreto e do <span lang="fr">Livret du citoyen</span>; assinatura da <span lang="fr">Charte des droits et devoirs du citoyen français</span>.</li>
</ol>
<h3>Os 5 temas oficiais</h3>
<dl class="facts">
<dt>Tema 1</dt><dd>Princípios e valores da República: lema, símbolos, laicidade, igualdade → <b>dias 2 a 5</b></dd>
<dt>Tema 2</dt><dd>Sistema institucional e político → <b>dias 11 a 15</b></dd>
<dt>Tema 3</dt><dd>Direitos e deveres → <b>dias 14, 18</b></dd>
<dt>Tema 4</dt><dd>História, geografia e cultura → <b>dias 6 a 11, 16, 17, 21</b></dd>
<dt>Tema 5</dt><dd>Viver na sociedade francesa → <b>dias 19 e 20</b></dd>
</dl>
<h3>Como usar a plataforma</h3>
<p>Cada dia: <b>3 min</b> de revisão (flashcards), <b>8 min</b> de leitura, <b>4 min</b> de mini-quiz. Cada módulo termina com as <b>perguntas frequentes da entrevista</b> sobre o tema e as <b>armadilhas</b> que mais derrubam candidatos. Aos fins de semana, faça um simulado rápido; na última semana, um simulado completo a cada dois dias. Meta segura: <b>36/40</b> nos simulados antes de marcar a prova.</p>
<div class="call info"><b>Dupla nacionalidade</b>A França aceita que você mantenha sua nacionalidade de origem. Verifique a regra do seu país (o Brasil, desde a EC 131/2023, não retira mais a nacionalidade de quem adquire outra; Portugal também a permite).</div>
<div class="call tip"><b>Dica</b>Leia em voz alta as partes em francês. A entrevista é oral: treine sua boca, não só seus olhos.</div>`,
traps:["Confundir o exame cívico (QCM escrito) com a entrevista (oral): são duas etapas distintas.","Estudar com materiais antigos (Livret 2022): o programa de 2026 é mais amplo.","Achar que a entrevista é uma prova de memória: é sobretudo de coerência e adesão aos valores."]},

2:{t:"Os símbolos da República",obj:"Reconhecer e explicar os símbolos oficiais: bandeira, hino, lema, Marianne, festa nacional.",
html:`<p>O artigo 2 da Constituição de 1958: <span lang="fr">« La langue de la République est le français. L’emblème national est le drapeau tricolore, bleu, blanc, rouge. L’hymne national est La Marseillaise. La devise de la République est Liberté, Égalité, Fraternité. Son principe est : gouvernement du peuple, par le peuple et pour le peuple. »</span></p>
<dl class="facts">
<dt>Bandeira</dt><dd><b>Azul, branco, vermelho</b> (a partir do mastro). Nascida na Revolução: azul e vermelho, cores de Paris; branco, cor do rei.</dd>
<dt>Hino</dt><dd><b lang="fr">La Marseillaise</b>, escrita em abril de 1792 em <b>Estrasburgo</b> por <b>Rouget de Lisle</b> (“Canto de guerra para o exército do Reno”). Leva o nome dos voluntários de Marselha que a cantaram ao chegar a Paris. Hino em 1795 e, definitivamente, em 1879.</dd>
<dt>Lema</dt><dd><b lang="fr">Liberté, Égalité, Fraternité</b>, herança da Revolução, inscrito nas fachadas de prefeituras e escolas.</dd>
<dt>Marianne</dt><dd>Figura feminina com barrete frígio (liberdade). Busto nas <span lang="fr">mairies</span>, nos selos, no logotipo do Estado.</dd>
<dt>14 de julho</dt><dd><b>Festa nacional</b> desde 1880: tomada da Bastilha (1789) e Festa da Federação (1790). Desfile nos Champs-Élysées.</dd>
<dt>Outros</dt><dd>O <b>galo gaulês</b> (não oficial), o <b>selo</b> da República, a <b>língua francesa</b>.</dd>
</dl>
<h3>A Marseillaise: 1º couplet e refrão</h3>
<blockquote lang="fr">Allons enfants de la Patrie,<br>Le jour de gloire est arrivé !<br>Contre nous de la tyrannie<br>L’étendard sanglant est levé…<br><br><b>Aux armes, citoyens,<br>Formez vos bataillons,<br>Marchons, marchons !<br>Qu’un sang impur abreuve nos sillons !</b></blockquote>
<p>Não é obrigatório saber de cor, mas saber o primeiro verso causa ótima impressão.</p>`,
traps:["“Travail, Famille, Patrie” era o lema do regime de Vichy, não da República.","A Marseillaise foi escrita em Estrasburgo, não em Marselha.","A ordem da bandeira é azul-branco-vermelho a partir do mastro.","O 14 de julho não é o 11 de novembro (armistício) nem o 8 de maio (1945)."]},

3:{t:"Liberdade, igualdade, fraternidade",obj:"Explicar cada valor com exemplos, incluindo a igualdade mulher-homem e a luta contra as discriminações.",
html:`<p>Artigo 1º da Constituição: <span lang="fr">« La France est une République <b>indivisible, laïque, démocratique et sociale</b>. Elle assure l’égalité devant la loi de tous les citoyens sans distinction d’origine, de race ou de religion. Elle respecte toutes les croyances. »</span></p>
<h3>Liberdade</h3>
<p>De expressão, opinião, consciência, religião, ir e vir, associação, imprensa, reunião. Limite: <span lang="fr">« La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui »</span> (DDHC, art. 4). Difamação, injúria e incitação ao ódio são <b>delitos</b>.</p>
<h3>Igualdade</h3>
<ul>
<li><b>Perante a lei</b>: mesmos direitos e deveres, sem distinção de origem, sexo, religião, orientação sexual, deficiência.</li>
<li><b>Mulher-homem</b>: voto em 1944; desde 1965 a mulher casada trabalha e abre conta sem autorização do marido; 1970, autoridade parental conjunta; 1972, igualdade salarial na lei; 2000, lei da paridade nas eleições.</li>
<li><b>Proibidos</b>: poligamia, casamento forçado, mutilação genital (crime, mesmo praticada no exterior), “crimes de honra”, discriminação no emprego, na moradia, no acesso a serviços.</li>
</ul>
<h3>Fraternidade</h3>
<p>Solidariedade concreta: Sécurité sociale (1945), seguro-desemprego, aposentadorias, RSA, voluntariado em associações. Omitir socorro a uma pessoa em perigo é crime.</p>
<h3>Os adjetivos do artigo 1º</h3>
<dl class="facts">
<dt>Indivisível</dt><dd>Um só povo, um só território, uma só lei; nenhuma comunidade tem direitos à parte.</dd>
<dt>Laica</dt><dd>O Estado é neutro em matéria religiosa (dia 4).</dd>
<dt>Democrática</dt><dd>A soberania pertence ao povo: voto e referendo (art. 3).</dd>
<dt>Social</dt><dd>O Estado protege os mais vulneráveis: saúde, educação, trabalho.</dd>
</dl>`,
traps:["Igualdade não significa mesmo salário para todos: significa mesmos direitos perante a lei.","A liberdade de expressão tem limites legais (ódio, difamação).","Mulheres votam desde 1944 (primeira vez em 1945), não desde 1789 nem 1848."]},

4:{t:"A laicidade",obj:"Dominar o tema mais cobrado: o que é, de onde vem, quem deve ser neutro e quem é livre.",
html:`<p>A laicidade garante:</p>
<ol><li><b>Liberdade de consciência</b>: crer, não crer, mudar de religião.</li><li><b>Separação Igrejas–Estado</b>: o Estado não reconhece, não paga e não subvenciona nenhum culto.</li><li><b>Igualdade</b> de todos, qualquer que seja a crença.</li></ol>
<h3>Datas-chave</h3>
<dl class="facts">
<dt>1789</dt><dd>DDHC art. 10: ninguém pode ser incomodado por suas opiniões, mesmo religiosas.</dd>
<dt>1881-82</dt><dd>Escola pública gratuita, obrigatória e <b>laica</b> (Jules Ferry).</dd>
<dt>9 dez. 1905</dt><dd><b>Lei de separação das Igrejas e do Estado</b>. Art. 2: <span lang="fr">« La République ne reconnaît, ne salarie ni ne subventionne aucun culte. »</span> 9 de dezembro = Dia da Laicidade.</dd>
<dt>1946 / 1958</dt><dd>Laicidade na Constituição.</dd>
<dt>2004</dt><dd>Proibição de sinais religiosos <b>ostensivos</b> para <b>alunos</b> de escolas, collèges e lycées públicos.</dd>
<dt>2010</dt><dd>Proibição de <b>ocultar o rosto</b> no espaço público.</dd>
<dt>2013</dt><dd>Carta da laicidade na escola.</dd>
<dt>2021</dt><dd>Lei que reforça os princípios da República (neutralidade estendida aos concessionários de serviço público).</dd>
</dl>
<h3>Quem é neutro, quem é livre</h3>
<div class="tscroll"><table class="t"><thead><tr><th>Situação</th><th>Regra</th></tr></thead><tbody>
<tr><td>Agente público (professor, funcionário, policial, enfermeira de hospital público)</td><td><b>Neutralidade total</b>: nenhum sinal religioso, nenhum proselitismo.</td></tr>
<tr><td>Usuário de serviço público</td><td>Livre, com rosto visível; não pode recusar um agente por seu sexo ou religião.</td></tr>
<tr><td>Aluno até o lycée</td><td>Sinais ostensivos proibidos; discretos permitidos.</td></tr>
<tr><td>Universitário</td><td>Livre.</td></tr>
<tr><td>Rua</td><td>Livre, exceto ocultar o rosto.</td></tr>
<tr><td>Empresa privada</td><td>Em princípio livre; o regulamento interno pode restringir se justificado.</td></tr>
</tbody></table></div>
<div class="call info"><b>Exceção</b>Na <b>Alsácia-Mosela</b> (alemã em 1905) vigora o regime concordatário: alguns cultos são financiados pelo Estado.</div>
<p><b>Frase-modelo:</b> <span lang="fr">« Pour moi, la laïcité, c’est la liberté de croire ou de ne pas croire, et la neutralité de l’État. La loi de la République passe avant les règles religieuses. »</span></p>`,
traps:["Laicidade não é hostilidade às religiões: protege todas elas e também quem não tem religião.","A lei de 2004 vale para alunos, não para pais nem universitários.","O agente público é neutro; o usuário é livre (com o rosto visível).","A lei de 1905 tem exceção na Alsácia-Mosela."]},

5:{t:"A Declaração de 1789 e a Constituição",obj:"Conhecer os textos fundadores: DDHC, Preâmbulo de 1946, Constituição de 1958 e suas revisões.",
html:`<h3>DDHC — 26 de agosto de 1789</h3>
<dl class="facts">
<dt>Art. 1</dt><dd lang="fr">« Les hommes naissent et demeurent libres et égaux en droits. »</dd>
<dt>Art. 2</dt><dd>Direitos naturais: liberdade, propriedade, segurança, resistência à opressão.</dd>
<dt>Art. 3</dt><dd>A soberania reside na Nação.</dd>
<dt>Art. 4</dt><dd>A liberdade = fazer tudo o que não prejudica o outro.</dd>
<dt>Art. 6</dt><dd>A lei é a expressão da vontade geral.</dd>
<dt>Art. 9</dt><dd>Presunção de inocência.</dd>
<dt>Art. 10-11</dt><dd>Liberdade de opinião e de expressão.</dd>
<dt>Art. 13</dt><dd>Contribuição comum (impostos) segundo as capacidades.</dd>
<dt>Art. 16</dt><dd>Sem garantia dos direitos e separação dos poderes, não há Constituição.</dd>
</dl>
<h3>Preâmbulo de 1946</h3>
<p>Direitos sociais: igualdade mulher-homem em todos os domínios, greve, sindicato, saúde, educação gratuita e laica, direito de asilo.</p>
<h3>Constituição de 4 de outubro de 1958</h3>
<p>Aprovada por referendo em 28/09/1958, cria a V República (De Gaulle, redigida com Michel Debré). Grandes revisões: <b>1962</b> eleição direta do Presidente; <b>2000</b> quinquenato; <b>2005</b> Carta do Meio Ambiente; <b>2007</b> proibição da pena de morte; <b>2008</b> máximo 2 mandatos consecutivos e QPC; <b>2024</b> liberdade garantida de recorrer à IVG.</p>
<div class="call info"><b>Bloco de constitucionalidade</b>Constituição 1958 + DDHC 1789 + Preâmbulo 1946 + Carta do Meio Ambiente 2004. O Conselho Constitucional (9 membros, 9 anos) controla as leis.</div>`,
traps:["DDHC = 26 de agosto de 1789, não 14 de julho.","A Constituição atual é de 1958, não de 1946.","Quem controla a constitucionalidade é o Conselho Constitucional, não o Conselho de Estado."]},

6:{t:"Das origens à monarquia absoluta",obj:"Situar os grandes marcos antes de 1789.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Data</th><th>Evento</th><th>Por que importa</th></tr></thead><tbody>
<tr><td>52 a.C.</td><td><b>Vercingétorix</b> derrotado por César em Alésia</td><td>A Gália vira romana: latim, direito romano.</td></tr>
<tr><td>c. 496</td><td>Batismo de <b>Clóvis</b>, rei dos francos</td><td>Os francos dão nome à França.</td></tr>
<tr><td>800</td><td><b>Carlos Magno</b> imperador</td><td>Grande império; difusão da escola.</td></tr>
<tr><td>987</td><td>Hugo Capeto rei</td><td>Dinastia capetíngia.</td></tr>
<tr><td>1337-1453</td><td><b>Guerra dos Cem Anos</b></td><td><b>Joana d’Arc</b> liberta Orléans (1429), queimada em Rouen (1431).</td></tr>
<tr><td>1539</td><td><b>Ordenação de Villers-Cotterêts</b></td><td>Francês nos atos oficiais.</td></tr>
<tr><td>1572</td><td>Noite de São Bartolomeu</td><td>Guerras de religião.</td></tr>
<tr><td>1598</td><td><b>Édito de Nantes</b> (Henrique IV)</td><td>Tolerância aos protestantes; revogado em 1685.</td></tr>
<tr><td>1635</td><td>Académie française (Richelieu)</td><td>Guardiã da língua.</td></tr>
<tr><td>1643-1715</td><td><b>Luís XIV</b>, Rei Sol</td><td>Monarquia absoluta, Versalhes.</td></tr>
<tr><td>séc. XVIII</td><td><b>Iluminismo</b></td><td>Voltaire, Rousseau, Montesquieu, Diderot.</td></tr>
</tbody></table></div>
<p>Montesquieu (<span lang="fr">De l’esprit des lois</span>, 1748) teoriza a <b>separação dos poderes</b>; Rousseau (<span lang="fr">Du contrat social</span>, 1762) a soberania popular; Voltaire luta contra o fanatismo.</p>
<div class="call tip"><b>Memória</b>Vercingétorix → Clóvis → Carlos Magno → Joana d’Arc → Luís XIV: cinco nomes em ordem cobrem 1 700 anos.</div>`,
traps:["Clóvis (batismo, ~496) não é Carlos Magno (imperador, 800).","Édito de Nantes = tolerância religiosa, não abolição da escravidão.","Villers-Cotterêts (1539) impõe o francês; a lei Toubon é de 1994."]},

7:{t:"A Revolução e a Primeira República (1792-1804)",obj:"Entender como a monarquia caiu e nasceu a primeira República.",
html:`<h3>1789, o ano da Revolução</h3>
<dl class="facts">
<dt>5 maio</dt><dd>Estados Gerais convocados (crise financeira).</dd>
<dt>20 junho</dt><dd>Juramento do Jeu de Paume.</dd>
<dt>14 julho</dt><dd><b>Tomada da Bastilha</b>.</dd>
<dt>4 agosto</dt><dd><b>Abolição dos privilégios</b>.</dd>
<dt>26 agosto</dt><dd>DDHC.</dd>
</dl>
<p>1790: criação dos <b>departamentos</b>. 1791: primeira Constituição (monarquia constitucional); Olympe de Gouges escreve a Declaração dos Direitos da Mulher e da Cidadã.</p>
<h3>A Primeira República</h3>
<div class="rep"><div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Proclamada em 21-22 de setembro de 1792, após a vitória de <b>Valmy</b>.</span></div></div>
<ul><li><b>1793</b>: Luís XVI guilhotinado (21 de janeiro); o <b>Terror</b> (Robespierre).</li><li><b>1794</b>: primeira abolição da escravidão.</li><li><b>1795-1799</b>: o Diretório.</li><li><b>1799</b>: golpe do 18 Brumário, Bonaparte Primeiro Cônsul.</li><li><b>1804</b>: Napoleão imperador → fim da I República.</li></ul>
<h3>Heranças</h3><p>Sistema métrico, departamentos, registro civil nas prefeituras, casamento civil e divórcio (1792), bandeira, Marseillaise, lema, soberania nacional.</p>`,
traps:["A Revolução começa em 1789, mas a República só em 1792.","Primeira abolição da escravidão: 1794; definitiva: 1848.","Bastilha = 14/07/1789; Festa da Federação = 14/07/1790."]},

8:{t:"Do Império à Segunda República (1804-1870)",obj:"Não confundir Napoleão I e III e saber o que 1848 trouxe.",
html:`<h3>Primeiro Império (1804-1815)</h3>
<p><b>Napoleão I</b>: Código Civil (1804), préfets (1800), lycées, Banco da França, Légion d’honneur (1802). Restabelece a escravidão em 1802. Derrotado em <b>Waterloo</b> (1815), exilado em Santa Helena.</p>
<h3>Os reis de volta (1815-1848)</h3>
<p>Restauração (Luís XVIII, Carlos X); revolução de 1830 (Trois Glorieuses) → Monarquia de Julho (Luís Filipe), que cai em fevereiro de 1848.</p>
<h3>Segunda República</h3>
<div class="rep"><div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Curta, mas decisiva.</span></div></div>
<ul><li><b>Sufrágio universal masculino</b>.</li><li><b>Abolição definitiva da escravidão</b> (27/04/1848, Victor Schœlcher).</li><li>Liberdade de imprensa e reunião; fim da pena de morte política.</li><li>Dez. 1848: <b>Louis-Napoléon Bonaparte</b>, primeiro presidente eleito por sufrágio universal.</li><li>2/12/1851: golpe de Estado; 1852: imperador <b>Napoleão III</b>.</li></ul>
<h3>Segundo Império (1852-1870)</h3>
<p>Ferrovias, bancos, obras de <b>Haussmann</b> em Paris. Fim com a derrota de <b>Sedan</b> (setembro de 1870).</p>`,
traps:["Napoleão I (tio, 1804) ≠ Napoleão III (sobrinho, 1852).","O primeiro presidente eleito por sufrágio universal foi Louis-Napoléon, em 1848, não De Gaulle.","Sufrágio de 1848 é só masculino."]},

9:{t:"A Terceira República (1870-1940)",obj:"A república que enraizou os valores republicanos.",
html:`<div class="rep"><div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>Proclamada em 4 de setembro de 1870, após Sedan.</span></div></div>
<dl class="facts">
<dt>1871</dt><dd>Comuna de Paris; perda da Alsácia-Mosela.</dd>
<dt>1875</dt><dd>Leis constitucionais.</dd>
<dt>1879-80</dt><dd>Marseillaise hino; 14 de julho festa nacional.</dd>
<dt>1881</dt><dd>Liberdade de imprensa e de reunião.</dd>
<dt>1881-82</dt><dd><b>Leis Jules Ferry</b>: escola gratuita, obrigatória, laica.</dd>
<dt>1884</dt><dd>Liberdade sindical; divórcio restabelecido.</dd>
<dt>1894-1906</dt><dd><b>Caso Dreyfus</b>; Zola, “J’accuse…!” (1898).</dd>
<dt>1901</dt><dd>Lei das associações.</dd>
<dt>1905</dt><dd>Separação das Igrejas e do Estado.</dd>
<dt>1914</dt><dd>Assassinato de Jean Jaurès; início da Grande Guerra.</dd>
<dt>1914-18</dt><dd>1ª Guerra: Verdun (1916); armistício <b>11/11/1918</b>; 1,4 milhão de soldados franceses mortos.</dd>
<dt>1936</dt><dd><b>Front populaire</b> (Léon Blum): férias pagas, 40 horas.</dd>
<dt>1940</dt><dd>Derrota; plenos poderes a Pétain (10 de julho) → fim.</dd>
</dl>`,
traps:["Leis Ferry = escola; lei 1901 = associações; lei 1905 = laicidade.","A III República não termina em 1945, mas em 1940 com Vichy.","Armistício de 1918 = 11 de novembro."]},

10:{t:"Segunda Guerra, Vichy e Resistência",obj:"Entender o período mais sombrio e a memória que a França cultiva.",
html:`<dl class="facts">
<dt>1939</dt><dd>França declara guerra à Alemanha (3 de setembro).</dd>
<dt>Jun. 1940</dt><dd>Derrota; Pétain assina o armistício; país dividido.</dd>
<dt>18/06/1940</dt><dd><b>Apelo de De Gaulle</b> de Londres (BBC): nasce a <b>França Livre</b>.</dd>
<dt>1940-44</dt><dd><b>Regime de Vichy</b> (“État français”): fim da República, colaboração, leis antissemitas.</dd>
<dt>Jul. 1942</dt><dd><b>Rafle du Vél d’Hiv</b>: mais de 13 000 judeus presos pela polícia francesa em Paris. Em 1995, Jacques Chirac reconhece a responsabilidade do Estado.</dd>
<dt>1943</dt><dd><b>Jean Moulin</b> unifica a Resistência (CNR).</dd>
<dt>21/04/1944</dt><dd>Voto das mulheres.</dd>
<dt>06/06/1944</dt><dd>Desembarque na Normandia.</dd>
<dt>25/08/1944</dt><dd>Libertação de Paris.</dd>
<dt>08/05/1945</dt><dd>Fim da guerra na Europa.</dd>
</dl>
<h3>Figuras</h3><ul><li><b>Charles de Gaulle</b>, chefe da França Livre.</li><li><b>Jean Moulin</b>, herói da Resistência.</li><li><b>Missak Manouchian</b>, resistente de origem armênia, Panthéon 2024.</li><li><b>Simone Veil</b>, sobrevivente de Auschwitz.</li><li><b>Joséphine Baker</b>, artista naturalizada, resistente, Panthéon 2021.</li><li><b>Lucie Aubrac</b>, resistente.</li></ul>
<div class="call tip"><b>Ponte pessoal</b>Manouchian e Baker eram estrangeiros que escolheram a França: exemplos perfeitos para a entrevista.</div>`,
traps:["Apelo de 18 de junho = De Gaulle (Londres), não Pétain.","8 de maio de 1945 ≠ 11 de novembro de 1918.","Vichy não é uma República: é o “État français”."]},

11:{t:"IV e V Repúblicas: a linha do tempo completa",obj:"Saber as cinco Repúblicas, datas e marcos.",
html:`<h3>As cinco Repúblicas</h3>
<div class="rep">
<div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Revolução; fim com o Império de Napoleão I.</span></div>
<div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Sufrágio masculino, fim da escravidão; fim com o golpe de Louis-Napoléon.</span></div>
<div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>Escola Ferry, 1905, Grande Guerra; fim com Vichy.</span></div>
<div><span class="rn">IV</span><span class="ry">1946 – 1958</span><span>Reconstrução, Seguridade Social; instável; fim com a crise argelina.</span></div>
<div><span class="rn">V</span><span class="ry">1958 – hoje</span><span>De Gaulle; executivo forte.</span></div>
</div>
<p>Entre elas: 1º Império (1804-15), Restauração e Monarquia de Julho (1815-48), 2º Império (1852-70), Vichy (1940-44), Governo Provisório (1944-46).</p>
<h3>IV República (1946-1958)</h3>
<ul><li>Constituição de 27/10/1946 e Preâmbulo social.</li><li>Sécurité sociale (1945), reconstrução, “Trinta Gloriosos”.</li><li>CECA (1951), Tratado de Roma (1957).</li><li>Indochina (1946-54), guerra da Argélia (1954-62).</li><li>Cerca de 24 governos em 12 anos.</li></ul>
<h3>V República</h3>
<dl class="facts">
<dt>1958</dt><dd>Constituição; De Gaulle presidente (1959-69).</dd>
<dt>1962</dt><dd>Acordos de Évian (fim da guerra da Argélia); eleição direta do Presidente.</dd>
<dt>1968</dt><dd>Maio de 68.</dd>
<dt>1974</dt><dd>Maioridade aos 18.</dd>
<dt>1975</dt><dd>Lei Veil (IVG).</dd>
<dt>1981</dt><dd>Abolição da pena de morte (Badinter).</dd>
<dt>1992</dt><dd>Maastricht.</dd>
<dt>1999</dt><dd>PACS.</dd>
<dt>2000</dt><dd>Referendo do quinquenato.</dd>
<dt>2002</dt><dd>Euro em circulação.</dd>
<dt>2013</dt><dd>Casamento para todos.</dd>
<dt>2024</dt><dd>IVG na Constituição.</dd>
</dl>
<h3>Presidentes da V República</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>1959-1969</td><td>Charles de Gaulle</td></tr><tr><td>1969-1974</td><td>Georges Pompidou</td></tr><tr><td>1974-1981</td><td>Valéry Giscard d’Estaing</td></tr><tr><td>1981-1995</td><td>François Mitterrand</td></tr><tr><td>1995-2007</td><td>Jacques Chirac</td></tr><tr><td>2007-2012</td><td>Nicolas Sarkozy</td></tr><tr><td>2012-2017</td><td>François Hollande</td></tr><tr><td>2017-</td><td>Emmanuel Macron (reeleito em 2022; eleição prevista para 2027)</td></tr>
</tbody></table></div>`,
traps:["São 5 Repúblicas, não 4 nem 6.","Eleição direta do Presidente: 1962, não 1958.","Quinquenato votado em 2000, aplicado em 2002."]},

12:{t:"O Presidente e o Governo",obj:"Saber quem faz o quê no executivo.",
html:`<h3>O Presidente da República</h3>
<dl class="facts"><dt>Eleição</dt><dd>Sufrágio universal direto, 2 turnos, <b>5 anos</b>, máximo <b>2 mandatos consecutivos</b>.</dd><dt>Sede</dt><dd>Palácio do <b>Eliseu</b>.</dd><dt>Atual</dt><dd>Emmanuel Macron (2017, reeleito em 2022).</dd></dl>
<ul><li>Garante da Constituição e da independência nacional.</li><li><b>Nomeia o Primeiro-Ministro</b> e os ministros (por proposta do PM).</li><li>Preside o Conselho de Ministros (quarta-feira).</li><li><b>Chefe dos exércitos</b>; negocia os tratados.</li><li>Promulga as leis; pode convocar <b>referendo</b> (art. 11).</li><li>Pode <b>dissolver</b> a Assembleia (art. 12; última vez em 2024).</li><li>Poderes excepcionais (art. 16); direito de graça.</li></ul>
<h3>O Governo</h3>
<dl class="facts"><dt>Chefe</dt><dd><b>Primeiro-Ministro</b>, no <b>Hôtel de Matignon</b>.</dd><dt>Papel</dt><dd>“Determina e conduz a política da Nação” (art. 20): projetos de lei, decretos, administração.</dd><dt>Responsável</dt><dd>Perante a <b>Assembleia Nacional</b>: moção de censura (art. 49).</dd></dl>
<div class="call"><b>Verifique</b>O Primeiro-Ministro mudou várias vezes desde 2024. Confira o nome atual em gouvernement.fr na semana da entrevista, assim como o ministro do Interior.</div>
<p><b>Coabitação</b>: Presidente e maioria parlamentar opostos (1986-88, 1993-95, 1997-2002).</p>`,
traps:["Eliseu = Presidente; Matignon = Primeiro-Ministro.","Mandato de 5 anos (não 7 desde 2002).","O Governo responde à Assembleia, não ao Senado."]},

13:{t:"O Parlamento e a lei",obj:"Entender como se faz uma lei.",
html:`<div class="tscroll"><table class="t"><thead><tr><th></th><th>Assemblée nationale</th><th>Sénat</th></tr></thead><tbody>
<tr><td>Membros</td><td><b>577 deputados</b></td><td><b>348 senadores</b></td></tr>
<tr><td>Eleição</td><td>Direta</td><td>Indireta (~160 000 grandes eleitores)</td></tr>
<tr><td>Mandato</td><td>5 anos (dissolúvel)</td><td>6 anos, renovado pela metade a cada 3 anos</td></tr>
<tr><td>Sede</td><td>Palais Bourbon</td><td>Palais du Luxembourg</td></tr>
<tr><td>Especial</td><td>Última palavra; derruba o Governo</td><td>Representa as coletividades</td></tr>
</tbody></table></div>
<p>O Parlamento <b>vota as leis e o orçamento</b> e <b>controla o Governo</b>. Reunido em Versalhes = <b>Congresso</b> (revisões constitucionais).</p>
<h3>Como nasce uma lei</h3>
<ol><li>Projeto (Governo) ou proposta (parlamentar).</li><li>Comissão e votação nas duas câmaras (<span lang="fr">navette</span>).</li><li>Em desacordo, a Assembleia decide.</li><li>Eventual controle do Conselho Constitucional.</li><li>Promulgação e publicação no <span lang="fr">Journal officiel</span>.</li></ol>
<p><b>Art. 49.3</b>: o Governo pode fazer passar um texto sem voto, salvo moção de censura aprovada. <b>Referendo</b>: o povo vota diretamente (art. 11).</p>`,
traps:["577 deputados, 348 senadores — não inverter.","Palais Bourbon = Assembleia; Luxembourg = Senado.","Senadores: eleição indireta, 6 anos."]},

14:{t:"Justiça e liberdades",obj:"Conhecer a organização da justiça e seus direitos diante dela.",
html:`<h3>Duas ordens de jurisdição</h3>
<dl class="facts"><dt>Judiciária</dt><dd>Litígios entre pessoas e infrações. Tribunal judiciário → Cour d’appel → <b>Cour de cassation</b>. Tribunal de polícia (contravenções), correcional (delitos), <b>Cour d’assises</b> (crimes, com jurados sorteados).</dd>
<dt>Administrativa</dt><dd>Litígios com a administração. Tribunal administrativo → Cour administrative d’appel → <b>Conseil d’État</b>.</dd>
<dt>Especializadas</dt><dd><b>Conseil de prud’hommes</b> (trabalho), tribunal de comércio.</dd></dl>
<h3>Seus direitos</h3>
<ul><li><b>Presunção de inocência</b>; direito a um advogado e a recorrer.</li><li>Em <b>garde à vue</b> (detenção policial, 24h renováveis): direito a advogado <b>desde o início</b>, a um médico, a avisar um parente, a ficar calado, a um intérprete.</li><li><b>Aide juridictionnelle</b>: o Estado paga o advogado para quem tem poucos recursos.</li><li>Vítima: prestar queixa na polícia/gendarmerie ou por carta ao procurador.</li></ul>
<h3>Autoridades independentes</h3>
<dl class="facts"><dt>Défenseur des droits</dt><dd>Gratuito: discriminações, abusos da administração, direitos das crianças, ética das forças de segurança.</dd>
<dt>CNIL</dt><dd>Proteção dos dados pessoais (RGPD).</dd>
<dt>Cour des comptes</dt><dd>Controla o dinheiro público.</dd>
<dt>Conseil constitutionnel</dt><dd>Controla leis e eleições nacionais.</dd></dl>
<p>A justiça é <b>independente</b> do Governo (separação dos poderes) e é feita “em nome do povo francês”.</p>`,
traps:["Cour de cassation (judiciário) ≠ Conseil d’État (administrativo).","Em garde à vue, o advogado é garantido desde a primeira hora.","Prud’hommes = trabalho; assises = crimes graves com jurados."]},

15:{t:"Regiões, departamentos, comunas e ultramar",obj:"Organização territorial e sua própria comuna.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Nível</th><th>Quantos</th><th>Quem dirige</th><th>Competências</th></tr></thead><tbody>
<tr><td><b>Região</b></td><td>18 (13 + 5)</td><td>Conselho regional (6 anos)</td><td><b>Lycées</b>, trens regionais, economia, formação</td></tr>
<tr><td><b>Departamento</b></td><td>101 (96 + 5)</td><td>Conselho departamental (6 anos)</td><td><b>Ação social</b> (RSA, idosos, infância), <b>collèges</b>, estradas</td></tr>
<tr><td><b>Comuna</b></td><td>~35 000</td><td>Conselho municipal (6 anos) → <b>maire</b></td><td><b>Escolas primárias</b>, estado civil, urbanismo</td></tr>
</tbody></table></div>
<p>Intercomunalidades: comunidades de comunas, metrópoles. Últimas municipais: <b>março de 2026</b>.</p>
<h3>O Estado no território</h3><p>O <b>préfet</b> (criado em 1800) representa o Estado: segurança, ordem pública, estrangeiros, naturalização, controle da legalidade. O maire é também agente do Estado (estado civil, eleições).</p>
<h3>As 13 regiões metropolitanas</h3><div class="regs" data-regs></div>
<h3>Ultramar</h3>
<ul><li><b>5 DROM</b>: Guadeloupe (971), Martinique (972), Guyane (973), La Réunion (974), Mayotte (976). Parte da UE.</li><li><b>COM</b>: Polynésie française, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, Saint-Martin, Saint-Barthélemy.</li><li><b>Nouvelle-Calédonie</b>: estatuto próprio.</li><li>TAAF e Clipperton.</li></ul>
<div class="call tip"><b>Obrigatório</b>Sua comuna e seu maire, seu departamento (nome e número), sua região e capital, seu préfet, seu deputado.</div>`,
traps:["18 regiões (13 na metrópole), 101 departamentos.","Nova Caledônia e Polinésia não são departamentos.","Escola primária = comuna; collège = departamento; lycée = região."]},

16:{t:"Geografia física e grandes cidades",obj:"Visualizar o mapa da França.",
html:`<dl class="facts"><dt>Superfície</dt><dd>~550 000 km² na metrópole (maior país da UE).</dd><dt>População</dt><dd>~68 milhões.</dd><dt>Capital</dt><dd>Paris.</dd><dt>Forma</dt><dd>O “Hexágono”.</dd></dl>
<h3>Mares</h3><p>Mancha e mar do Norte (norte), Atlântico (oeste), Mediterrâneo (sul). Córsega, ilha do Mediterrâneo.</p>
<h3>Vizinhos</h3><p>Metrópole: <b>Bélgica, Luxemburgo, Alemanha, Suíça, Itália, Mônaco, Espanha, Andorra</b>. Ultramar: <b>Brasil</b> e Suriname (Guiana — a fronteira com o Brasil, ~730 km, é a mais longa da França), <b>Países Baixos</b> (Saint-Martin).</p>
<h3>Montanhas</h3><ul><li><b>Alpes</b>: Mont Blanc 4 805 m.</li><li><b>Pirineus</b>: fronteira com a Espanha.</li><li><b>Maciço Central</b>: vulcões (Puy de Dôme).</li><li><b>Jura</b>, <b>Vosges</b>.</li></ul>
<h3>Rios</h3><div class="tscroll"><table class="t"><thead><tr><th>Rio</th><th>Deságua</th><th>Cidades</th></tr></thead><tbody>
<tr><td>Loire</td><td>Atlântico</td><td>Orléans, Tours, Nantes — o mais longo (~1 000 km)</td></tr>
<tr><td>Seine</td><td>Mancha</td><td>Paris, Rouen, Le Havre</td></tr>
<tr><td>Rhône</td><td>Mediterrâneo</td><td>Lyon, Avignon</td></tr>
<tr><td>Garonne</td><td>Atlântico</td><td>Toulouse, Bordeaux</td></tr>
<tr><td>Rhin</td><td>Mar do Norte</td><td>Strasbourg</td></tr></tbody></table></div>
<h3>Cidades</h3><p>Paris · Marseille · Lyon · Toulouse · Nice · Nantes · Montpellier · Strasbourg · Bordeaux · Lille. Strasbourg: Parlamento Europeu. Marseille: maior porto. Toulouse: aeronáutica.</p>`,
traps:["O Portugal não faz fronteira com a França.","Loire é o mais longo, não o Seine.","Segunda cidade: Marseille, não Lyon."]},

17:{t:"A França na Europa e no mundo",obj:"Papel da França na UE e nas organizações internacionais.",
html:`<dl class="facts"><dt>9/05/1950</dt><dd><b>Declaração Schuman</b>: Dia da Europa.</dd><dt>1951</dt><dd>CECA (6 países).</dd><dt>1957</dt><dd><b>Tratado de Roma</b>: CEE; França fundadora.</dd><dt>1979</dt><dd>1ª eleição direta do Parlamento Europeu (Simone Veil presidente).</dd><dt>1985/95</dt><dd>Espaço Schengen.</dd><dt>1992</dt><dd><b>Maastricht</b>: União Europeia.</dd><dt>2002</dt><dd>Euro.</dd><dt>2020</dt><dd>Brexit: 27 membros.</dd></dl>
<div class="tscroll"><table class="t"><thead><tr><th>Instituição</th><th>Sede</th><th>Papel</th></tr></thead><tbody>
<tr><td>Parlamento Europeu</td><td>Strasbourg</td><td>Eleito a cada 5 anos (2024); 81 eurodeputados franceses</td></tr>
<tr><td>Comissão Europeia</td><td>Bruxelas</td><td>Propõe e executa</td></tr>
<tr><td>Conselho da UE / Europeu</td><td>Bruxelas</td><td>Ministros / chefes de Estado</td></tr>
<tr><td>Tribunal de Justiça da UE</td><td>Luxemburgo</td><td>Interpreta o direito europeu</td></tr></tbody></table></div>
<p>Símbolos: bandeira azul com <b>12 estrelas</b>, “Ode à Alegria”, lema “Unida na diversidade”. Cidadão europeu vota nas municipais e europeias do país de residência.</p>
<div class="call info"><b>Não confunda</b>Conselho da Europa (46 países, Strasbourg, Corte Europeia dos Direitos do Homem) não é a UE.</div>
<h3>No mundo</h3><ul><li>Membro permanente do Conselho de Segurança da ONU (veto).</li><li>Fundadora da OTAN (1949), G7, G20.</li><li>Francofonia: ~320 milhões de falantes (OIF).</li><li>Potência nuclear; 2º espaço marítimo do mundo.</li></ul>`,
traps:["12 estrelas ≠ número de países.","CEDH (Conselho da Europa) ≠ Tribunal de Justiça da UE.","Tratado de Roma 1957 (CEE) ≠ Maastricht 1992 (UE)."]},

18:{t:"Direitos, deveres e eleições",obj:"Listar direitos e deveres com segurança.",
html:`<h3>Direitos</h3><ul><li><b>Civis</b>: expressão, consciência, religião, circulação, associação, reunião, vida privada, propriedade, igualdade.</li><li><b>Políticos</b> (cidadãos franceses, 18 anos): votar e ser eleito.</li><li><b>Sociais</b>: saúde, educação, trabalho, greve, sindicato, proteção social, moradia digna, asilo.</li></ul>
<h3>Deveres</h3><ul><li>Respeitar as leis e os outros.</li><li><b>Pagar impostos</b> segundo os recursos.</li><li><b>Votar</b>: dever cívico, mas <b>não obrigatório</b>.</li><li>Defesa: recenseamento aos 16 anos e <b>JDC</b>; serviço militar suspenso em 1997.</li><li>Ser <b>jurado</b> se sorteado.</li><li>Escolarizar os filhos (3-16 anos; formação até 18).</li><li>Socorrer uma pessoa em perigo.</li></ul>
<h3>Eleições</h3><div class="tscroll"><table class="t"><thead><tr><th>Eleição</th><th>Elege</th><th>Ritmo</th></tr></thead><tbody>
<tr><td>Presidencial</td><td>Presidente</td><td>5 anos (2027)</td></tr><tr><td>Legislativas</td><td>Deputados</td><td>5 anos (última 2024)</td></tr><tr><td>Municipais</td><td>Conselheiros → maire</td><td>6 anos (2026)</td></tr><tr><td>Departamentais / Regionais</td><td>Conselheiros</td><td>6 anos</td></tr><tr><td>Europeias</td><td>Eurodeputados</td><td>5 anos (2024)</td></tr></tbody></table></div>
<p>Voto <b>secreto</b> (cabine obrigatória), pessoal; procuração possível. Inscrição automática aos 18 anos e, para naturalizados, em geral automática após o decreto — confira no service-public.</p>`,
traps:["O voto não é obrigatório na França.","Estrangeiros não europeus não votam em nenhuma eleição.","Instrução obrigatória a partir dos 3 anos (não 6)."]},

19:{t:"Família, escola, saúde e emergências",obj:"Responder às situações práticas sobre família e vida cotidiana.",
html:`<h3>Família</h3><ul><li><b>Casamento civil</b> na mairie, único com valor legal, <b>antes</b> de qualquer cerimônia religiosa.</li><li>Casamento para todos desde 2013; PACS desde 1999.</li><li>Idade mínima 18 anos, consentimento livre; casamento forçado e poligamia proibidos.</li><li><b>Autoridade parental</b> conjunta; toda violência educativa proibida (2019).</li><li>Divórcio possível; igualdade na herança entre filhos.</li></ul>
<h3>Escola</h3><ul><li>Instrução obrigatória de 3 a 16 anos; escola pública gratuita e laica.</li><li>Todas as aulas são obrigatórias (natação, educação sexual, ciências), para meninas e meninos.</li><li>Escola primária → collège (11-15) → lycée (15-18) → baccalauréat.</li></ul>
<h3>Saúde</h3><p><b>Sécurité sociale</b> (1945): doença, aposentadoria, família, acidentes do trabalho. Carte Vitale, médico de referência, mutuelle. Complementar solidária para baixa renda. Vacinas obrigatórias para crianças; PMI para mães e bebês.</p>
<h3>Emergências</h3><div class="tscroll"><table class="t"><tbody>
<tr><td><b>15</b></td><td>SAMU</td></tr><tr><td><b>17</b></td><td>Polícia / Gendarmerie</td></tr><tr><td><b>18</b></td><td>Bombeiros</td></tr><tr><td><b>112</b></td><td>Emergência europeia</td></tr><tr><td><b>114</b></td><td>Emergência por SMS</td></tr><tr><td><b>115</b></td><td>Pessoas sem abrigo</td></tr><tr><td><b>119</b></td><td>Criança em perigo</td></tr><tr><td><b>3919</b></td><td>Violências contra mulheres</td></tr></tbody></table></div>`,
traps:["Casamento religioso sozinho não tem valor legal.","Nenhuma aula pode ser dispensada por motivo religioso.","15 SAMU, 17 polícia, 18 bombeiros — não trocar."]},

20:{t:"Trabalho, moradia, consumo e banco",obj:"Dominar as mises en situation práticas do exame.",
html:`<h3>Trabalho</h3><ul><li><b>35 h</b> semanais; <b>5 semanas</b> de férias pagas; salário mínimo <b>SMIC</b>.</li><li>Contrato CDI (indeterminado) ou CDD (determinado); período de experiência; holerite (<span lang="fr">fiche de paie</span>) obrigatório.</li><li>Discriminação proibida; não é preciso responder a perguntas sobre religião, gravidez, vida privada numa entrevista de emprego.</li><li>Salário não pago, demissão abusiva → <b>conseil de prud’hommes</b> (até em urgência, <span lang="fr">référé</span>); inspeção do trabalho.</li><li>Trabalho não declarado é ilegal. France Travail (antigo Pôle emploi) para desempregados.</li></ul>
<h3>Moradia</h3><ul><li>Contrato de locação (<span lang="fr">bail</span>), caução, estado dos lugares na entrada e saída.</li><li>O proprietário <b>não pode entrar</b> sem autorização: violação de domicílio.</li><li>Recusa de aluguel por origem ou nome = discriminação → queixa ou Défenseur des droits.</li><li>Seguro habitação obrigatório para o locatário. Ajuda da CAF (APL).</li><li>Barulho noturno (22h-7h), coleta seletiva, regras do condomínio.</li></ul>
<h3>Consumo e banco</h3><ul><li><b>Garantia legal de conformidade</b>: 2 anos, gratuita, em produto novo.</li><li>Compra online: 14 dias para desistir.</li><li>Nenhum banco aceita você? <b>Droit au compte</b> pela Banque de France.</li><li>Endividamento: comissão de superendividamento da Banque de France.</li></ul>
<h3>Impostos</h3><p>Declaração anual de renda (mesmo sem imposto a pagar), retenção na fonte, IVA (TVA) no consumo, taxa foncière para proprietários.</p>`,
traps:["Prud’hommes (trabalho) ≠ tribunal administrativo.","Garantia legal é de 2 anos e gratuita — não depende de seguro.","O proprietário não tem “direito de visita” sem seu acordo."]},

21:{t:"Cultura, personalidades, Panthéon e feriados",obj:"Ter referências culturais prontas.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Área</th><th>Nomes</th></tr></thead><tbody>
<tr><td>Literatura</td><td><b>Molière</b> (teatro, séc. XVII) · La Fontaine · <b>Voltaire</b> · Rousseau · <b>Victor Hugo</b> (Les Misérables) · Balzac · Flaubert · <b>Zola</b> · Proust · Saint-Exupéry (Le Petit Prince) · <b>Camus</b> (Nobel 1957) · Simone de Beauvoir · Annie Ernaux (Nobel 2022)</td></tr>
<tr><td>Ciências</td><td><b>Marie Curie</b> (2 Nobel) · <b>Pasteur</b> (vacina antirrábica) · Descartes · Pascal · Lavoisier</td></tr>
<tr><td>Artes</td><td><b>Monet</b> (impressionismo) · Renoir · Cézanne · Delacroix (La Liberté guidant le peuple) · Rodin</td></tr>
<tr><td>Música</td><td>Debussy · Ravel · Bizet · Édith Piaf · Aznavour</td></tr>
<tr><td>Cinema</td><td>Irmãos <b>Lumière</b> (1895) · Festival de Cannes</td></tr>
<tr><td>Política</td><td>Jaurès · Clemenceau · <b>Simone Veil</b> · Badinter · Jean Moulin</td></tr></tbody></table></div>
<h3>Panthéon</h3><p><span lang="fr">« Aux grands hommes, la patrie reconnaissante »</span>. Voltaire, Rousseau, Hugo, Zola, Jaurès, Moulin, Marie Curie, Simone Veil (2018), Joséphine Baker (2021), Manouchian (2024), Badinter (2025).</p>
<h3>Patrimônio</h3><p>Torre Eiffel (1889), Louvre, Arco do Triunfo, Notre-Dame (reaberta em dez. 2024), Mont-Saint-Michel, Versalhes, castelos do Loire, Pont du Gard. A refeição gastronômica francesa (2010) e a baguete (2022) são patrimônio da UNESCO. Tour de France desde 1903.</p>
<h3>11 feriados</h3><div class="tscroll"><table class="t"><tbody>
<tr><td>1º jan.</td><td>Ano Novo</td></tr><tr><td>variável</td><td>Segunda de Páscoa</td></tr><tr><td>1º maio</td><td>Trabalho</td></tr><tr><td><b>8 maio</b></td><td>Vitória 1945</td></tr><tr><td>variável</td><td>Ascensão</td></tr><tr><td>variável</td><td>Segunda de Pentecostes</td></tr><tr><td><b>14 jul.</b></td><td>Festa nacional</td></tr><tr><td>15 ago.</td><td>Assunção</td></tr><tr><td>1º nov.</td><td>Todos os Santos</td></tr><tr><td><b>11 nov.</b></td><td>Armistício 1918</td></tr><tr><td>25 dez.</td><td>Natal</td></tr></tbody></table></div>
<p>+2 na Alsácia-Mosela (Sexta-feira Santa, 26/12). 10 de maio: memória da escravidão.</p>`,
traps:["Les Misérables = Hugo, não Zola.","Pasteur = raiva; Curie = radioatividade.","8 de maio = 1945; 11 de novembro = 1918."]},

22:{t:"Ensaio da entrevista",obj:"Treinar em voz alta as respostas pessoais e sobre valores.",
html:`<p>Hoje você <b>fala</b>. Abra a aba <b>Entrevista</b> e siga este roteiro:</p>
<ol><li><b>3 min</b> — Apresente-se em voz alta (cerca de 1 minuto).</li><li><b>5 min</b> — Responda às perguntas de motivação e valores sem ler; depois compare com o modelo.</li><li><b>4 min</b> — Responda às situações.</li><li><b>3 min</b> — Revise sua ficha pessoal.</li></ol>
<h3>Ficha pessoal (preencha e decore)</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>Minha comuna / maire</td><td>____________</td></tr><tr><td>Departamento (nº) / préfet</td><td>____________</td></tr><tr><td>Região / capital</td><td>____________</td></tr><tr><td>Meu deputado</td><td>____________</td></tr><tr><td>Chegada na França</td><td>____________</td></tr><tr><td>Empregadores e datas</td><td>____________</td></tr><tr><td>Endereços desde a chegada</td><td>____________</td></tr><tr><td>Presidente / Primeiro-Ministro</td><td>Emmanuel Macron / (verificar)</td></tr></tbody></table></div>
<div class="call"><b>Coerência</b>O agente tem seu dossiê: datas, endereços, empregos e família devem bater exatamente.</div>
<div class="call tip"><b>Técnica</b>Fato + exemplo pessoal + valor. Três frases, nem mais, nem menos.</div>`,
traps:["Decorar respostas robóticas: o agente percebe e aprofunda.","Contradizer o dossiê.","Criticar a França ou o governo atual: fique nas instituições e valores."]},

23:{t:"Simulado final e revisão",obj:"Fazer um simulado completo e revisar os erros.",
html:`<p>Dia de prova real: <b>40 questões, 45 minutos, meta 32</b> (ideal 36+). Aba <b>Simulado</b> → “Exame completo”.</p>
<ol><li>Faça sem consultar nada.</li><li>Anote os temas errados.</li><li>Eles entram automaticamente em “Revisar” nos flashcards.</li><li>Releia os módulos correspondentes.</li></ol>
<h3>Os 20 fatos que mais caem</h3>
<dl class="facts"><dt>Lema</dt><dd>Liberté, Égalité, Fraternité</dd><dt>Art. 1</dt><dd>Indivisível, laica, democrática e social</dd><dt>1789</dt><dd>Bastilha (14/07), DDHC (26/08)</dd><dt>1792</dt><dd>I República; Marseillaise</dd><dt>1848</dt><dd>II República; sufrágio masculino; fim da escravidão</dd><dt>1870</dt><dd>III República</dd><dt>1881-82</dt><dd>Escola Ferry</dd><dt>1905</dt><dd>Laicidade</dd><dt>1918</dt><dd>Armistício 11/11</dd><dt>1940</dt><dd>18 de junho; Vichy</dd><dt>1944</dt><dd>Voto das mulheres</dd><dt>1945</dt><dd>8 de maio; Seguridade Social</dd><dt>1946</dt><dd>IV República</dd><dt>1957</dt><dd>Tratado de Roma</dd><dt>1958</dt><dd>V República, 4/10</dd><dt>1962</dt><dd>Presidente eleito diretamente</dd><dt>1981</dt><dd>Fim da pena de morte</dd><dt>2002</dt><dd>Euro</dd><dt>577 / 348</dt><dd>Deputados / senadores</dd><dt>18 / 101</dt><dd>Regiões / departamentos</dd></dl>`,
traps:["Na prova, leia todas as opções: as erradas costumam ser quase certas.","Não gaste mais de 1 minuto por questão; volte depois às difíceis."]}
};
