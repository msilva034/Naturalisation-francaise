DEEP.pt = {
3:`<h4>Por que a França insiste tanto na igualdade mulher-homem?</h4>
<p>Porque foi uma conquista lenta, e o Estado a considera parte da identidade republicana. Linha do tempo: 1944 voto; 1946 igualdade no Preâmbulo; 1965 a mulher casada trabalha e abre conta sem o marido; 1967 contracepção (lei Neuwirth); 1970 autoridade parental conjunta substitui o “poder paterno”; 1975 lei Veil (IVG) e divórcio por consentimento mútuo; 1983 igualdade profissional; 2000 paridade eleitoral; 2011 cotas em conselhos de empresas; 2024 IVG na Constituição.</p>
<h4>Discriminação: o que a lei proíbe</h4>
<p>O Código Penal lista mais de 25 critérios proibidos: origem, sexo, situação familiar, gravidez, aparência física, sobrenome, local de residência, estado de saúde, deficiência, orientação sexual, identidade de gênero, idade, opiniões políticas, atividade sindical, religião, idioma… Discriminar na contratação, na moradia ou no acesso a um serviço pode custar até 3 anos de prisão e 45 000 € de multa.</p>
<h4>Casos para treinar o raciocínio</h4>
<dl class="facts">
<dt>Caso</dt><dd>Uma imobiliária pede “de preferência sem sobrenome estrangeiro”. → Discriminação (critério do sobrenome/origem). Recurso: queixa ou Défenseur des droits.</dd>
<dt>Caso</dt><dd>Um clube esportivo reserva uma hora de piscina só para mulheres de uma religião. → Contrário à igualdade e à neutralidade se for equipamento público.</dd>
<dt>Caso</dt><dd>Um irmão proíbe a irmã maior de idade de sair. → Ela é livre; restringir a liberdade de alguém pode ser crime (sequestro, violência psicológica).</dd>
</dl>
<h4>Como responder na entrevista</h4>
<p>Evite o “sim, mas…”. O agente espera adesão sem ressalvas. Uma boa estrutura: princípio → exemplo da sua vida → consequência. <span lang="fr">« Chez nous, ma femme et moi prenons les décisions ensemble ; nos enfants, filles et garçons, ont les mêmes droits et les mêmes chances. »</span></p>`,

4:`<h4>A lógica que resolve 90 % das questões de laicidade</h4>
<p>Faça sempre duas perguntas: <b>1) quem é a pessoa?</b> (agente do Estado ou particular) e <b>2) onde ela está?</b> (escola até o lycée, serviço público, rua, empresa). O <b>agente</b> é sempre neutro. O <b>particular</b> é livre, com três limites: a lei de 2004 (alunos), a lei de 2010 (rosto coberto) e a ordem pública.</p>
<div class="tscroll"><table class="t"><thead><tr><th>Situação</th><th>Resposta</th><th>Por quê</th></tr></thead><tbody>
<tr><td>Mãe de aluno com véu acompanha passeio escolar</td><td>Em princípio permitido</td><td>Ela é usuária colaboradora, não agente; a escola pode restringir por motivo de ordem ou proselitismo.</td></tr>
<tr><td>Funcionária de prefeitura com véu no guichê</td><td>Proibido</td><td>Agente público.</td></tr>
<tr><td>Motorista de ônibus de empresa privada que opera o serviço público</td><td>Neutralidade exigida</td><td>Lei de 2021 estende a neutralidade aos concessionários.</td></tr>
<tr><td>Aluno pede para faltar à aula de biologia sobre evolução</td><td>Recusado</td><td>Programa obrigatório; a escola não se adapta a crenças.</td></tr>
<tr><td>Presépio na prefeitura</td><td>Só se tiver caráter cultural/festivo, não religioso</td><td>Conselho de Estado, 2016.</td></tr>
<tr><td>Oração na rua bloqueando a via</td><td>Pode ser proibida</td><td>Ordem pública, não por ser religiosa.</td></tr>
<tr><td>Empresa privada proíbe sinais religiosos a quem atende clientes</td><td>Possível</td><td>Se previsto no regulamento interno, geral e justificado.</td></tr>
</tbody></table></div>
<h4>O contexto histórico da lei de 1905</h4>
<p>No século XIX, a Igreja católica tinha grande peso na escola e na política. Depois do caso Dreyfus, os republicanos quiseram garantir que nenhuma religião dominasse o Estado. A lei de 1905 põe fim à Concordata de Napoleão (1801), mas garante o livre exercício dos cultos. Os edifícios religiosos construídos antes de 1905 pertencem ao Estado ou às comunas, que os mantêm (por isso Notre-Dame é propriedade do Estado).</p>
<h4>Blasfêmia</h4>
<p>Não existe delito de blasfêmia na França (exceto antiga regra na Alsácia-Mosela, revogada em 2017): criticar ou caricaturar uma religião é permitido; insultar ou incitar ao ódio contra <b>pessoas</b> por causa da religião é proibido.</p>`,

5:`<h4>Como se muda a Constituição (art. 89)</h4>
<ol><li>Proposta do Presidente (por sugestão do PM) ou dos parlamentares.</li><li>Votada em termos idênticos pela Assembleia e pelo Senado.</li><li>Aprovada por <b>referendo</b> ou, se o Presidente preferir, pelo <b>Congresso</b> (as duas câmaras reunidas em Versalhes) com 3/5 dos votos.</li></ol>
<p>Foi assim em 2024 com a IVG: 780 votos a favor no Congresso.</p>
<h4>A QPC na prática</h4>
<p>Desde 2010, se num processo você achar que a lei aplicada viola seus direitos constitucionais, pode levantar uma <b>questão prioritária de constitucionalidade</b>. O juiz a transmite ao Conselho de Estado ou à Cour de cassation, que a enviam ao Conselho Constitucional. Se ele concordar, a lei é revogada para todos.</p>
<h4>Estado de direito</h4>
<p>Significa que o próprio Estado obedece às regras: hierarquia das normas (Constituição > tratados > leis > decretos > portarias), juízes independentes, direitos fundamentais protegidos. Um prefeito ou um ministro podem ser condenados; um decreto ilegal pode ser anulado pelo juiz administrativo.</p>`,

7:`<h4>Por que a Revolução aconteceu?</h4>
<ul><li><b>Crise financeira</b>: guerras (inclusive o apoio à independência americana) endividaram o reino.</li><li><b>Injustiça fiscal</b>: nobreza e clero quase não pagavam impostos; o “terceiro estado” (98 % da população) pagava tudo.</li><li><b>Ideias do Iluminismo</b>: soberania do povo, igualdade, separação dos poderes.</li><li><b>Fome</b>: colheitas ruins em 1788, pão caro.</li></ul>
<h4>O que muda concretamente</h4>
<p>Fim da sociedade de ordens (nobreza, clero, terceiro estado) e dos privilégios; igualdade perante a lei e o imposto; fim da monarquia absoluta; nascimento do cidadão. Os departamentos (1790) substituem as antigas províncias para unificar o país. O registro civil (nascimento, casamento, morte) passa da Igreja para a prefeitura em 1792.</p>
<h4>Os lados sombrios</h4>
<p>A Revolução também teve violência: o Terror (1793-1794) com cerca de 17 000 condenações à morte oficiais, a guerra da Vendée. Saber disso mostra maturidade histórica.</p>`,

9:`<h4>A III República “funda” a França republicana moderna</h4>
<p>Depois da derrota de 1870 e da Comuna, os republicanos precisam convencer um país ainda muito monarquista e católico. A estratégia: <b>a escola</b>. O “hussard noir” (professor primário) ensina a ler, a contar, a história nacional e a moral cívica em todas as aldeias. O francês substitui as línguas regionais.</p>
<h4>O caso Dreyfus em 4 pontos</h4>
<ol><li>1894: o capitão Alfred Dreyfus, judeu, é condenado por espionagem com provas falsas.</li><li>1898: Zola publica “J’accuse…!” e é condenado por difamação.</li><li>A França se divide entre “dreyfusards” (justiça, direitos) e “antidreyfusards” (exército, nação).</li><li>1906: Dreyfus é reabilitado. O caso leva à criação da Liga dos Direitos Humanos (1898) e prepara a lei de 1905.</li></ol>
<h4>A Grande Guerra</h4>
<p>Guerra de trincheiras, 1,4 milhão de soldados franceses mortos, entre eles soldados das colônias (tirailleurs senegaleses, argelinos…). Todas as comunas têm um monumento aos mortos. O 11 de novembro é dia de memória de todos os mortos pela França.</p>`,

10:`<h4>Duas Franças em 1940</h4>
<p>Após a derrota, o norte e a costa atlântica ficam ocupados pela Alemanha; o sul é a “zona livre” até novembro de 1942. Em Vichy, o marechal Pétain recebe plenos poderes e cria o “État français”: fim da República, lema “Travail, Famille, Patrie”, estatuto dos judeus (outubro de 1940), colaboração com a Alemanha.</p>
<h4>Os Justos</h4>
<p>Muitos franceses esconderam judeus arriscando a vida: são os “Justos entre as Nações” (mais de 4 000 reconhecidos na França). Cerca de 75 % dos judeus da França sobreviveram, graças também a essa solidariedade.</p>
<h4>A Resistência</h4>
<p>Dentro (redes, maquis, sabotagem, jornais clandestinos) e fora (França Livre de De Gaulle, com soldados das colônias). O Conselho Nacional da Resistência (1943) prepara o programa do pós-guerra: Seguridade Social, voto das mulheres, nacionalizações.</p>
<h4>O dever de memória</h4>
<p>Em 1995, Jacques Chirac reconhece que “a França” cometeu o irreparável na Rafle du Vél d’Hiv. Lugares de memória: Memorial da Shoah (Paris), Oradour-sur-Glane (aldeia massacrada), plages du Débarquement.</p>`,

11:`<h4>Por que a IV República caiu?</h4>
<p>O Parlamento era todo-poderoso e dividido: os governos caíam em média a cada 6 meses. Diante da guerra da Argélia, com risco de golpe militar em maio de 1958, o Parlamento chama De Gaulle, que exige uma nova Constituição com um <b>executivo forte</b>.</p>
<h4>Os instrumentos do executivo forte</h4>
<ul><li>Presidente eleito diretamente (desde 1962) e com poderes próprios: dissolução, referendo, art. 16.</li><li>Governo protegido pelo art. 49.3 e pela dificuldade de aprovar uma moção de censura (maioria absoluta).</li><li>Parlamento “racionalizado”: o Governo controla boa parte da agenda.</li></ul>
<h4>A guerra da Argélia</h4>
<p>A Argélia era francesa desde 1830, com um milhão de europeus. A guerra (1954-1962) terminou com os acordos de Évian e a independência. Cerca de 800 000 “pieds-noirs” e harkis vieram para a França. É uma memória ainda sensível.</p>
<h4>Maio de 68</h4>
<p>Revolta de estudantes e greve geral de ~10 milhões de trabalhadores. Resultados: aumento do salário mínimo de 35 %, mais liberdades nas universidades e nos costumes.</p>`,

12:`<h4>Como funciona a eleição presidencial</h4>
<p>Para ser candidato: ser francês, ter 18 anos e reunir <b>500 assinaturas</b> (“parrainages”) de eleitos (prefeitos, deputados…) de pelo menos 30 departamentos. Primeiro turno; se ninguém tiver maioria absoluta, segundo turno entre os dois primeiros, duas semanas depois.</p>
<h4>A dissolução de 2024</h4>
<p>Em junho de 2024, após as eleições europeias, o Presidente dissolveu a Assembleia. As legislativas antecipadas deram uma Assembleia sem maioria absoluta, dividida em três blocos. Resultado: governos frágeis, moções de censura (o governo Barnier caiu em dezembro de 2024) e trocas sucessivas de Primeiro-Ministro. Por isso o site pede para verificar o nome atual.</p>
<h4>Moção de censura</h4>
<p>Assinada por 1/10 dos deputados; só é aprovada com a maioria absoluta dos membros (289 votos). Se aprovada, o Primeiro-Ministro entrega a demissão do Governo.</p>
<h4>Os ministros</h4>
<p>Cada ministério dirige um setor (Interior, Justiça, Economia, Educação…). O <b>ministro do Interior</b> é responsável pela polícia, pelas prefeituras e pela naturalização: é em nome dele que seu decreto será preparado.</p>`,

13:`<h4>A vida de uma lei, exemplo real</h4>
<p>A lei “casamento para todos” (2013): projeto do Governo → debate na Assembleia (mais de 130 horas) → Senado → nova leitura → adoção → recurso ao Conselho Constitucional (validada) → promulgação em 17 de maio de 2013 → primeiro casamento em Montpellier em 29 de maio.</p>
<h4>O que o Parlamento controla</h4>
<ul><li><b>Perguntas ao governo</b> (terças e quartas na Assembleia, transmitidas pela TV).</li><li><b>Comissões de inquérito</b> que podem convocar qualquer pessoa.</li><li><b>Orçamento</b>: sem a lei de finanças votada, o Estado não pode gastar.</li></ul>
<h4>Por que o Senado é eleito indiretamente?</h4>
<p>Porque representa as <b>coletividades territoriais</b> (comunas, departamentos, regiões). Seus eleitores são sobretudo os conselheiros municipais: por isso as comunas rurais pesam bastante. O Senado tem a fama de “câmara da reflexão”; não pode derrubar o Governo, e a Assembleia tem a última palavra.</p>
<h4>O referendo de iniciativa compartilhada</h4>
<p>Desde 2008, 1/5 dos parlamentares apoiados por 1/10 dos eleitores (~4,8 milhões de assinaturas) podem provocar um referendo. Nunca chegou ao fim até hoje.</p>`,

14:`<h4>Contravenção, delito, crime</h4>
<div class="tscroll"><table class="t"><thead><tr><th>Infração</th><th>Exemplo</th><th>Tribunal</th><th>Pena máxima</th></tr></thead><tbody>
<tr><td>Contravenção</td><td>Estacionamento proibido, barulho noturno</td><td>Tribunal de polícia</td><td>Multa (até 1 500 €, 3 000 € reincidência)</td></tr>
<tr><td>Delito</td><td>Furto, direção embriagada, discriminação, violência conjugal</td><td>Tribunal correcional</td><td>Até 10 anos (20 em reincidência)</td></tr>
<tr><td>Crime</td><td>Homicídio, estupro, roubo à mão armada</td><td>Cour d’assises (jurados) ou cour criminelle</td><td>Até prisão perpétua</td></tr>
</tbody></table></div>
<h4>Garde à vue passo a passo</h4>
<ol><li>Só se houver suspeita de crime ou delito punido com prisão.</li><li>Duração: 24 h, renovável uma vez (48 h; mais em terrorismo/tráfico).</li><li>Você é informado dos seus direitos numa língua que entende.</li><li>Direitos: avisar um parente e o empregador, ver um médico, falar com um advogado desde o início (inclusive gratuito, de plantão), ter intérprete, ficar em silêncio.</li></ol>
<h4>Vítima: seus caminhos</h4>
<ul><li>Queixa na polícia/gendarmerie (não podem recusar recebê-la).</li><li>Carta ao procurador da República.</li><li>Associações de ajuda às vítimas (número 116 006).</li><li>Violência doméstica: 17, 3919, e o juiz pode dar uma “ordonnance de protection” com afastamento do agressor.</li></ul>`,

18:`<h4>Votar pela primeira vez, passo a passo</h4>
<ol><li>Verifique sua inscrição em service-public.fr (“vérifier son inscription”). Naturalizados costumam ser inscritos automaticamente, mas confirme.</li><li>Se não estiver inscrito: na mairie ou online, até o 6º sexta-feira antes da eleição.</li><li>No dia: leve um <b>documento de identidade</b> (obrigatório em comunas com mais de 1 000 habitantes); o cartão eleitoral é útil mas não obrigatório.</li><li>Pegue as cédulas (de preferência de todos os candidatos, para preservar o segredo), passe pela <b>cabine</b>, ponha a cédula no envelope, depois na urna, e assine a lista.</li></ol>
<h4>Os deveres que as pessoas esquecem</h4>
<ul><li><b>Declarar os rendimentos</b> todo ano, mesmo sem imposto a pagar.</li><li><b>Recenseamento</b> dos jovens aos 16 anos.</li><li><b>Respeitar as decisões da justiça</b> e comparecer quando convocado.</li><li><b>Cuidar dos filhos</b>: educação, saúde, segurança.</li><li><b>Respeitar os bens públicos</b> e o meio ambiente (lixo, barulho).</li></ul>
<h4>Manifestar</h4>
<p>É um direito. Os organizadores devem declarar a manifestação na prefeitura/prefeitura de polícia 3 a 15 dias antes. Manifestantes não podem cobrir o rosto nem levar armas. A autoridade pode proibir se houver risco grave à ordem pública.</p>`,

19:`<h4>Casamento e família: o que costuma cair</h4>
<ul><li>Publicação dos proclamas (“bans”) 10 dias antes na mairie.</li><li>Cerimônia pública, com 2 a 4 testemunhas; o maire lê artigos do Código Civil sobre fidelidade, respeito, socorro e assistência, e educação dos filhos.</li><li>Um ministro religioso que celebra um casamento religioso <b>sem</b> casamento civil prévio comete infração.</li><li>Casamento no exterior: deve ser transcrito no consulado francês para valer na França.</li></ul>
<h4>Escola: organização e regras</h4>
<p>Maternelle (3-6), élémentaire (6-11), collège (11-15, “brevet”), lycée (15-18, “bac”). A escola pública é gratuita; material e cantina podem ter custos, com ajudas (bolsas, preço segundo a renda). Pais participam via conselhos de escola e associações. É possível a instrução em família, mas desde 2022 depende de autorização.</p>
<h4>Saúde, o caminho certo</h4>
<ol><li>Declarar um <b>médecin traitant</b> (melhor reembolso).</li><li>Urgência vital: <b>15</b>. Fora de horário, não grave: médico de plantão (116 117 em muitas regiões) ou farmácia de plantão.</li><li>Sem recursos: Complémentaire santé solidaire; para estrangeiros sem título, AME.</li></ol>
<h4>Proteção da infância</h4>
<p>Todo adulto que suspeita de maus-tratos a uma criança deve alertar: 119 (gratuito, 24h). Os pais têm autoridade parental <b>no interesse da criança</b>, não como poder absoluto.</p>`,

20:`<h4>O contrato de trabalho: o essencial</h4>
<ul><li><b>CDI</b> é a regra; <b>CDD</b> só em casos previstos (substituição, aumento temporário) e com duração máxima.</li><li>Período de experiência: pode ser rompido pelos dois lados, mas nunca por motivo discriminatório.</li><li>Horas extras a partir da 36ª hora, pagas com acréscimo (25 % e depois 50 %).</li><li>Demissão: procedimento com entrevista prévia e motivo real e sério; o empregado pode contestar nos prud’hommes em até 12 meses.</li><li>Representantes dos trabalhadores (CSE) a partir de 11 empregados.</li></ul>
<h4>Moradia: entrar e sair</h4>
<ol><li>Entrada: contrato escrito, estado dos lugares, caução (máx. 1 mês sem mobília, 2 mobiliado), seguro habitação.</li><li>Durante: pagar o aluguel, cuidar do imóvel, pequenos reparos a cargo do locatário; grandes reparos (telhado, caldeira) a cargo do proprietário.</li><li>Saída: aviso de 3 meses (1 mês se mobiliado ou zona “tendue”); caução devolvida em 1 mês se o estado for igual, 2 meses se houver danos.</li></ol>
<p>Moradia indigna (umidade, insalubridade): a comuna e a CAF podem intervir.</p>
<h4>Consumo</h4>
<ul><li><b>Garantia legal de conformidade</b>: 2 anos, produto novo, reparo ou troca gratuitos.</li><li><b>Garantia de vícios ocultos</b>: defeito escondido que torna o bem impróprio (também para usados).</li><li>Venda a domicílio ou online: 14 dias para desistir.</li><li>Litígio: tentar acordo → mediador do consumo → justiça.</li></ul>
<h4>Dinheiro e fraudes</h4>
<p>Banco nunca pede código por telefone ou SMS. Em caso de fraude no cartão: bloquear (serviço de oposição) e contestar em até 13 meses; o banco deve reembolsar operações não autorizadas.</p>`

1:{t:"How naturalisation works in 2026",obj:"Understand the steps, the format of the civic exam and the interview, and how to use this platform 15 minutes a day.",
html:`<h3>The steps, in order</h3>
<ol>
<li><b>Eligibility</b>: usually 5 years of regular residence in France (shorter in some cases, e.g. 2 years after a French higher-education degree), stable income, taxes up to date, no serious convictions.</li>
<li><b>Online application</b> on the Interior Ministry’s ANEF platform: civil status, residence, income, taxes, French-language certificate and civic-exam certificate.</li>
<li><b>French at B2 level</b> (since 1 January 2026; previously B1), proven by a diploma or recognised test (TCF, TEF…).</li>
<li><b lang="fr">Examen civique</b>: an on-screen multiple-choice test in French at an approved centre (CCI Paris Île-de-France or France Éducation International). <b>40 questions, 45 minutes, pass mark 32 (80 %)</b>: 28 knowledge questions + 12 real-life scenarios (<span lang="fr">mises en situation</span>).</li>
<li><b lang="fr">Entretien d’assimilation</b> at the prefecture: a conversation in French about your background, motivation, knowledge of France and commitment to republican values.</li>
<li><b>Decision</b> by decree published in the <span lang="fr">Journal officiel</span> (or a reasoned refusal/postponement).</li>
<li><b lang="fr">Cérémonie d’accueil</b>: you receive your decree and the <span lang="fr">Livret du citoyen</span>, and sign the <span lang="fr">Charte des droits et devoirs du citoyen français</span>.</li>
</ol>
<h3>The 5 official themes</h3>
<dl class="facts">
<dt>Theme 1</dt><dd>Principles and values of the Republic → <b>days 2–5</b></dd>
<dt>Theme 2</dt><dd>Institutions and politics → <b>days 11–15</b></dd>
<dt>Theme 3</dt><dd>Rights and duties → <b>days 14, 18</b></dd>
<dt>Theme 4</dt><dd>History, geography and culture → <b>days 6–11, 16, 17, 21</b></dd>
<dt>Theme 5</dt><dd>Living in French society → <b>days 19–20</b></dd>
</dl>
<h3>How to use the platform</h3>
<p>Each day: <b>3 min</b> review (flashcards), <b>8 min</b> reading, <b>4 min</b> mini-quiz. Every module ends with the <b>frequent interview questions</b> on that topic and the <b>traps</b> that catch most candidates. At weekends, take a quick mock exam; in the final week, a full mock exam every other day. A safe target: <b>36/40</b> in mock exams before booking the real one.</p>
<div class="call info"><b>Dual nationality</b>France lets you keep your original nationality. Check your own country’s rules (the UK, the US, Brazil and Portugal, for example, allow it).</div>
<div class="call tip"><b>Tip</b>Read the French passages aloud. The interview is spoken: train your mouth, not just your eyes.</div>`,
traps:["Mixing up the civic exam (written multiple choice) and the interview (spoken): they are two separate steps.","Studying from old material (2022 booklet): the 2026 syllabus is broader.","Thinking the interview is a memory test: it is mostly about consistency and commitment to the values."]},

2:{t:"Symbols of the Republic",obj:"Recognise and explain the official symbols: flag, anthem, motto, Marianne, national day.",
html:`<p>Article 2 of the 1958 Constitution: <span lang="fr">« La langue de la République est le français. L’emblème national est le drapeau tricolore, bleu, blanc, rouge. L’hymne national est La Marseillaise. La devise de la République est Liberté, Égalité, Fraternité. Son principe est : gouvernement du peuple, par le peuple et pour le peuple. »</span></p>
<dl class="facts">
<dt>Flag</dt><dd><b>Blue, white, red</b> (from the flagpole). Born in the Revolution: blue and red are the colours of Paris; white was the king’s colour.</dd>
<dt>Anthem</dt><dd><b lang="fr">La Marseillaise</b>, written in April 1792 in <b>Strasbourg</b> by <b>Rouget de Lisle</b> (“War Song for the Army of the Rhine”). Named after volunteers from Marseille who sang it on arriving in Paris. Anthem in 1795 and permanently from 1879.</dd>
<dt>Motto</dt><dd><b lang="fr">Liberté, Égalité, Fraternité</b>, from the Revolution, carved on town halls and schools.</dd>
<dt>Marianne</dt><dd>A female figure in a Phrygian cap (liberty). Her bust stands in every <span lang="fr">mairie</span>; she appears on stamps and the State logo.</dd>
<dt>14 July</dt><dd><b>National day</b> since 1880: storming of the Bastille (1789) and Fête de la Fédération (1790). Military parade on the Champs-Élysées.</dd>
<dt>Others</dt><dd>The <b>Gallic rooster</b> (unofficial), the <b>seal</b> of the Republic, the <b>French language</b>.</dd>
</dl>
<h3>La Marseillaise: first verse and chorus</h3>
<blockquote lang="fr">Allons enfants de la Patrie,<br>Le jour de gloire est arrivé !<br>Contre nous de la tyrannie<br>L’étendard sanglant est levé…<br><br><b>Aux armes, citoyens,<br>Formez vos bataillons,<br>Marchons, marchons !<br>Qu’un sang impur abreuve nos sillons !</b></blockquote>
<p>You do not have to know it by heart, but knowing the first line makes a very good impression.</p>`,
traps:["“Travail, Famille, Patrie” was the Vichy regime’s motto, not the Republic’s.","La Marseillaise was written in Strasbourg, not Marseille.","The flag reads blue-white-red from the pole.","14 July is not 11 November (armistice) nor 8 May (1945)."]},

3:{t:"Liberty, equality, fraternity",obj:"Explain each value with examples, including gender equality and the fight against discrimination.",
html:`<p>Article 1 of the Constitution: <span lang="fr">« La France est une République <b>indivisible, laïque, démocratique et sociale</b>. Elle assure l’égalité devant la loi de tous les citoyens sans distinction d’origine, de race ou de religion. Elle respecte toutes les croyances. »</span></p>
<h3>Liberty</h3>
<p>Freedom of expression, opinion, conscience, religion, movement, association, press and assembly. Limit: <span lang="fr">« La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui »</span> (Declaration, art. 4). Defamation, insult and incitement to hatred are <b>offences</b>.</p>
<h3>Equality</h3>
<ul>
<li><b>Before the law</b>: the same rights and duties, whatever one’s origin, sex, religion, sexual orientation or disability.</li>
<li><b>Women and men</b>: vote in 1944; since 1965 a married woman may work and open a bank account without her husband’s consent; 1970 joint parental authority; 1972 equal pay in law; 2000 parity law for elections.</li>
<li><b>Banned</b>: polygamy, forced marriage, female genital mutilation (a crime even abroad), “honour” crimes, discrimination in jobs, housing and services.</li>
</ul>
<h3>Fraternity</h3>
<p>Practical solidarity: Social Security (1945), unemployment insurance, pensions, the RSA minimum income, volunteering. Failing to help a person in danger is a crime.</p>
<h3>The adjectives of Article 1</h3>
<dl class="facts">
<dt>Indivisible</dt><dd>One people, one territory, one law; no community has separate rights.</dd>
<dt>Secular</dt><dd>The State is neutral on religion (day 4).</dd>
<dt>Democratic</dt><dd>Sovereignty belongs to the people: elections and referendums (art. 3).</dd>
<dt>Social</dt><dd>The State protects the vulnerable: health, education, work.</dd>
</dl>`,
traps:["Equality does not mean the same salary for everyone: it means the same rights before the law.","Freedom of speech has legal limits (hate speech, defamation).","Women have voted since 1944 (first in 1945), not 1789 or 1848."]},

4:{t:"Laïcité (secularism)",obj:"Master the most-tested topic: what it is, where it comes from, who must be neutral and who is free.",
html:`<p>Laïcité guarantees:</p>
<ol><li><b>Freedom of conscience</b>: to believe, not believe or change religion.</li><li><b>Separation of Churches and State</b>: the State recognises, pays and subsidises no religion.</li><li><b>Equality</b> of all, whatever their beliefs.</li></ol>
<h3>Key dates</h3>
<dl class="facts">
<dt>1789</dt><dd>Declaration art. 10: no one may be troubled for their opinions, even religious ones.</dd>
<dt>1881-82</dt><dd>Free, compulsory, <b>secular</b> state school (Jules Ferry).</dd>
<dt>9 Dec 1905</dt><dd><b>Law separating the Churches and the State</b>. Art. 2: <span lang="fr">« La République ne reconnaît, ne salarie ni ne subventionne aucun culte. »</span> 9 December = Laïcité Day.</dd>
<dt>1946 / 1958</dt><dd>Laïcité enters the Constitution.</dd>
<dt>2004</dt><dd>Ban on <b>conspicuous</b> religious signs for <b>pupils</b> in state primary and secondary schools.</dd>
<dt>2010</dt><dd>Ban on <b>covering the face</b> in public spaces.</dd>
<dt>2013</dt><dd>Charter of laïcité in schools.</dd>
<dt>2021</dt><dd>Law reinforcing republican principles (neutrality extended to contractors running public services).</dd>
</dl>
<h3>Who must be neutral, who is free</h3>
<div class="tscroll"><table class="t"><thead><tr><th>Situation</th><th>Rule</th></tr></thead><tbody>
<tr><td>Public servant (teacher, clerk, police officer, public-hospital nurse)</td><td><b>Strict neutrality</b>: no religious sign, no proselytising.</td></tr>
<tr><td>User of a public service</td><td>Free, face visible; may not reject staff because of their sex or religion.</td></tr>
<tr><td>Pupil up to lycée</td><td>Conspicuous signs banned; discreet ones allowed.</td></tr>
<tr><td>University student</td><td>Free.</td></tr>
<tr><td>Street</td><td>Free, except covering the face.</td></tr>
<tr><td>Private company</td><td>Free in principle; internal rules may restrict if justified.</td></tr>
</tbody></table></div>
<div class="call info"><b>Exception</b>In <b>Alsace-Moselle</b> (German in 1905) the Concordat still applies: some religions are State-funded.</div>
<p><b>Model sentence:</b> <span lang="fr">« Pour moi, la laïcité, c’est la liberté de croire ou de ne pas croire, et la neutralité de l’État. La loi de la République passe avant les règles religieuses. »</span></p>`,
traps:["Laïcité is not hostility to religion: it protects all religions and non-believers.","The 2004 law applies to pupils, not parents or university students.","Public servants are neutral; users are free (face visible).","The 1905 law has an exception in Alsace-Moselle."]},

5:{t:"The 1789 Declaration and the Constitution",obj:"Know the founding texts: the Declaration, the 1946 Preamble, the 1958 Constitution and its amendments.",
html:`<h3>Declaration of the Rights of Man and of the Citizen — 26 August 1789</h3>
<dl class="facts">
<dt>Art. 1</dt><dd lang="fr">« Les hommes naissent et demeurent libres et égaux en droits. »</dd>
<dt>Art. 2</dt><dd>Natural rights: liberty, property, security, resistance to oppression.</dd>
<dt>Art. 3</dt><dd>Sovereignty lies with the Nation.</dd>
<dt>Art. 4</dt><dd>Liberty = doing anything that does not harm others.</dd>
<dt>Art. 6</dt><dd>Law is the expression of the general will.</dd>
<dt>Art. 9</dt><dd>Presumption of innocence.</dd>
<dt>Art. 10-11</dt><dd>Freedom of opinion and expression.</dd>
<dt>Art. 13</dt><dd>Common contribution (taxes) according to means.</dd>
<dt>Art. 16</dt><dd>Without guaranteed rights and separation of powers, there is no Constitution.</dd>
</dl>
<h3>The 1946 Preamble</h3>
<p>Social rights: gender equality in all fields, the right to strike, unions, health, free secular education, asylum.</p>
<h3>The Constitution of 4 October 1958</h3>
<p>Approved by referendum on 28 September 1958, it founded the Fifth Republic (De Gaulle, drafted with Michel Debré). Major amendments: <b>1962</b> direct election of the President; <b>2000</b> five-year term; <b>2005</b> Environment Charter; <b>2007</b> ban on the death penalty; <b>2008</b> two consecutive terms maximum and the QPC; <b>2024</b> guaranteed freedom to have an abortion.</p>
<div class="call info"><b>Constitutional bloc</b>1958 Constitution + 1789 Declaration + 1946 Preamble + 2004 Environment Charter. The Constitutional Council (9 members, 9 years) reviews laws.</div>`,
traps:["The Declaration dates from 26 August 1789, not 14 July.","The current Constitution is from 1958, not 1946.","Constitutional review is done by the Constitutional Council, not the Council of State."]},

6:{t:"From the origins to absolute monarchy",obj:"Place the main landmarks before 1789.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Date</th><th>Event</th><th>Why it matters</th></tr></thead><tbody>
<tr><td>52 BC</td><td><b>Vercingetorix</b> defeated by Caesar at Alesia</td><td>Gaul becomes Roman: Latin, Roman law.</td></tr>
<tr><td>c. 496</td><td>Baptism of <b>Clovis</b>, king of the Franks</td><td>The Franks give France its name.</td></tr>
<tr><td>800</td><td><b>Charlemagne</b> crowned emperor</td><td>A vast empire; spread of schooling.</td></tr>
<tr><td>987</td><td>Hugh Capet king</td><td>Capetian dynasty.</td></tr>
<tr><td>1337-1453</td><td><b>Hundred Years’ War</b></td><td><b>Joan of Arc</b> frees Orléans (1429), burned in Rouen (1431).</td></tr>
<tr><td>1539</td><td><b>Ordinance of Villers-Cotterêts</b></td><td>French in official acts.</td></tr>
<tr><td>1572</td><td>St Bartholomew’s Day massacre</td><td>Wars of religion.</td></tr>
<tr><td>1598</td><td><b>Edict of Nantes</b> (Henri IV)</td><td>Tolerance for Protestants; revoked 1685.</td></tr>
<tr><td>1635</td><td>Académie française (Richelieu)</td><td>Guardian of the language.</td></tr>
<tr><td>1643-1715</td><td><b>Louis XIV</b>, the Sun King</td><td>Absolute monarchy, Versailles.</td></tr>
<tr><td>18th c.</td><td><b>The Enlightenment</b></td><td>Voltaire, Rousseau, Montesquieu, Diderot.</td></tr>
</tbody></table></div>
<p>Montesquieu (<span lang="fr">De l’esprit des lois</span>, 1748) theorised the <b>separation of powers</b>; Rousseau (<span lang="fr">Du contrat social</span>, 1762) popular sovereignty; Voltaire fought fanaticism.</p>
<div class="call tip"><b>Memory hook</b>Vercingetorix → Clovis → Charlemagne → Joan of Arc → Louis XIV: five names in order cover 1,700 years.</div>`,
traps:["Clovis (baptism, c. 496) is not Charlemagne (emperor, 800).","Edict of Nantes = religious tolerance, not the end of slavery.","Villers-Cotterêts (1539) imposed French; the Toubon law is from 1994."]},

7:{t:"The Revolution and the First Republic (1792-1804)",obj:"Understand how the monarchy fell and the first Republic was born.",
html:`<h3>1789, the year of the Revolution</h3>
<dl class="facts">
<dt>5 May</dt><dd>Estates-General summoned (financial crisis).</dd>
<dt>20 June</dt><dd>Tennis Court Oath.</dd>
<dt>14 July</dt><dd><b>Storming of the Bastille</b>.</dd>
<dt>4 August</dt><dd><b>Abolition of privileges</b>.</dd>
<dt>26 August</dt><dd>Declaration of the Rights of Man.</dd>
</dl>
<p>1790: <b>departments</b> created. 1791: first Constitution (constitutional monarchy); Olympe de Gouges writes the Declaration of the Rights of Woman.</p>
<h3>The First Republic</h3>
<div class="rep"><div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Proclaimed on 21-22 September 1792, after the victory at <b>Valmy</b>.</span></div></div>
<ul><li><b>1793</b>: Louis XVI guillotined (21 January); the <b>Terror</b> (Robespierre).</li><li><b>1794</b>: first abolition of slavery.</li><li><b>1795-1799</b>: the Directory.</li><li><b>1799</b>: coup of 18 Brumaire, Bonaparte First Consul.</li><li><b>1804</b>: Napoleon emperor → end of the First Republic.</li></ul>
<h3>Legacy</h3><p>Metric system, departments, civil registers in town halls, civil marriage and divorce (1792), the flag, the Marseillaise, the motto, national sovereignty.</p>`,
traps:["The Revolution begins in 1789, but the Republic only in 1792.","Slavery first abolished in 1794; for good in 1848.","Bastille = 14 July 1789; Fête de la Fédération = 14 July 1790."]},

8:{t:"From Empire to Second Republic (1804-1870)",obj:"Tell Napoleon I from Napoleon III and know what 1848 brought.",
html:`<h3>First Empire (1804-1815)</h3>
<p><b>Napoleon I</b>: Civil Code (1804), prefects (1800), lycées, Banque de France, Légion d’honneur (1802). Restored slavery in 1802. Defeated at <b>Waterloo</b> (1815), exiled to Saint Helena.</p>
<h3>Kings return (1815-1848)</h3>
<p>Restoration (Louis XVIII, Charles X); 1830 revolution (Trois Glorieuses) → July Monarchy (Louis-Philippe), which falls in February 1848.</p>
<h3>Second Republic</h3>
<div class="rep"><div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Short but decisive.</span></div></div>
<ul><li><b>Universal male suffrage</b>.</li><li><b>Final abolition of slavery</b> (27 April 1848, Victor Schœlcher).</li><li>Press and assembly freedom; end of the death penalty for political crimes.</li><li>Dec. 1848: <b>Louis-Napoléon Bonaparte</b>, first president elected by universal suffrage.</li><li>2 Dec. 1851: coup; 1852: Emperor <b>Napoleon III</b>.</li></ul>
<h3>Second Empire (1852-1870)</h3>
<p>Railways, banks, <b>Haussmann</b>’s rebuilding of Paris. Ends with defeat at <b>Sedan</b> (September 1870).</p>`,
traps:["Napoleon I (uncle, 1804) ≠ Napoleon III (nephew, 1852).","The first president elected by universal suffrage was Louis-Napoléon in 1848, not De Gaulle.","1848 suffrage was for men only."]},

9:{t:"The Third Republic (1870-1940)",obj:"The Republic that rooted republican values.",
html:`<div class="rep"><div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>Proclaimed on 4 September 1870, after Sedan.</span></div></div>
<dl class="facts">
<dt>1871</dt><dd>Paris Commune; loss of Alsace-Moselle.</dd>
<dt>1875</dt><dd>Constitutional laws.</dd>
<dt>1879-80</dt><dd>Marseillaise anthem; 14 July national day.</dd>
<dt>1881</dt><dd>Freedom of the press and of assembly.</dd>
<dt>1881-82</dt><dd><b>Jules Ferry laws</b>: free, compulsory, secular school.</dd>
<dt>1884</dt><dd>Trade-union freedom; divorce restored.</dd>
<dt>1894-1906</dt><dd><b>Dreyfus affair</b>; Zola, “J’accuse…!” (1898).</dd>
<dt>1901</dt><dd>Law on associations.</dd>
<dt>1905</dt><dd>Separation of Churches and State.</dd>
<dt>1914</dt><dd>Jean Jaurès assassinated; war begins.</dd>
<dt>1914-18</dt><dd>First World War: Verdun (1916); armistice <b>11 Nov. 1918</b>; 1.4 million French soldiers killed.</dd>
<dt>1936</dt><dd><b>Popular Front</b> (Léon Blum): paid holidays, 40-hour week.</dd>
<dt>1940</dt><dd>Defeat; full powers to Pétain (10 July) → end.</dd>
</dl>`,
traps:["Ferry laws = school; 1901 law = associations; 1905 law = laïcité.","The Third Republic ends in 1940 with Vichy, not in 1945.","1918 armistice = 11 November."]},

10:{t:"Second World War, Vichy and the Resistance",obj:"Understand the darkest period and how France remembers it.",
html:`<dl class="facts">
<dt>1939</dt><dd>France declares war on Germany (3 September).</dd>
<dt>June 1940</dt><dd>Defeat; Pétain signs the armistice; the country is split.</dd>
<dt>18/06/1940</dt><dd><b>De Gaulle’s appeal</b> from London (BBC): <b>Free France</b> is born.</dd>
<dt>1940-44</dt><dd><b>Vichy regime</b> (“État français”): end of the Republic, collaboration, antisemitic laws.</dd>
<dt>July 1942</dt><dd><b>Vél d’Hiv round-up</b>: over 13,000 Jews arrested by French police in Paris. In 1995 Jacques Chirac acknowledged the State’s responsibility.</dd>
<dt>1943</dt><dd><b>Jean Moulin</b> unites the Resistance (CNR).</dd>
<dt>21/04/1944</dt><dd>Women get the vote.</dd>
<dt>06/06/1944</dt><dd>Normandy landings.</dd>
<dt>25/08/1944</dt><dd>Liberation of Paris.</dd>
<dt>08/05/1945</dt><dd>End of the war in Europe.</dd>
</dl>
<h3>Key figures</h3><ul><li><b>Charles de Gaulle</b>, leader of Free France.</li><li><b>Jean Moulin</b>, Resistance hero.</li><li><b>Missak Manouchian</b>, Armenian-born resistance fighter, Panthéon 2024.</li><li><b>Simone Veil</b>, Auschwitz survivor.</li><li><b>Joséphine Baker</b>, naturalised artist and resistance agent, Panthéon 2021.</li><li><b>Lucie Aubrac</b>, resistance fighter.</li></ul>
<div class="call tip"><b>Personal link</b>Manouchian and Baker were foreigners who chose France: perfect examples for the interview.</div>`,
traps:["The 18 June appeal = De Gaulle (London), not Pétain.","8 May 1945 ≠ 11 November 1918.","Vichy was not a Republic: it was the “État français”."]},

11:{t:"Fourth and Fifth Republics: the full timeline",obj:"Know the five Republics, their dates and landmarks.",
html:`<h3>The five Republics</h3>
<div class="rep">
<div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Revolution; ends with Napoleon I’s Empire.</span></div>
<div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Male suffrage, end of slavery; ends with Louis-Napoléon’s coup.</span></div>
<div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>Ferry schools, 1905, Great War; ends with Vichy.</span></div>
<div><span class="rn">IV</span><span class="ry">1946 – 1958</span><span>Reconstruction, Social Security; unstable; ends with the Algerian crisis.</span></div>
<div><span class="rn">V</span><span class="ry">1958 – today</span><span>De Gaulle; strong executive.</span></div>
</div>
<p>In between: First Empire (1804-15), Restoration and July Monarchy (1815-48), Second Empire (1852-70), Vichy (1940-44), Provisional Government (1944-46).</p>
<h3>Fourth Republic (1946-1958)</h3>
<ul><li>Constitution of 27 October 1946 and its social Preamble.</li><li>Social Security (1945), reconstruction, the “Thirty Glorious Years”.</li><li>ECSC (1951), Treaty of Rome (1957).</li><li>Indochina (1946-54), Algerian War (1954-62).</li><li>About 24 governments in 12 years.</li></ul>
<h3>Fifth Republic</h3>
<dl class="facts">
<dt>1958</dt><dd>Constitution; De Gaulle president (1959-69).</dd>
<dt>1962</dt><dd>Évian Accords (end of Algerian War); direct election of the President.</dd>
<dt>1968</dt><dd>May 68.</dd>
<dt>1974</dt><dd>Age of majority 18.</dd>
<dt>1975</dt><dd>Veil law (abortion).</dd>
<dt>1981</dt><dd>Death penalty abolished (Badinter).</dd>
<dt>1992</dt><dd>Maastricht.</dd>
<dt>1999</dt><dd>PACS.</dd>
<dt>2000</dt><dd>Five-year-term referendum.</dd>
<dt>2002</dt><dd>Euro in circulation.</dd>
<dt>2013</dt><dd>Same-sex marriage.</dd>
<dt>2024</dt><dd>Abortion in the Constitution.</dd>
</dl>
<h3>Presidents of the Fifth Republic</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>1959-1969</td><td>Charles de Gaulle</td></tr><tr><td>1969-1974</td><td>Georges Pompidou</td></tr><tr><td>1974-1981</td><td>Valéry Giscard d’Estaing</td></tr><tr><td>1981-1995</td><td>François Mitterrand</td></tr><tr><td>1995-2007</td><td>Jacques Chirac</td></tr><tr><td>2007-2012</td><td>Nicolas Sarkozy</td></tr><tr><td>2012-2017</td><td>François Hollande</td></tr><tr><td>2017-</td><td>Emmanuel Macron (re-elected 2022; next election due 2027)</td></tr>
</tbody></table></div>`,
traps:["There are 5 Republics, not 4 or 6.","Direct presidential election dates from 1962, not 1958.","Five-year term voted in 2000, applied from 2002."]},

12:{t:"The President and the Government",obj:"Know who does what in the executive.",
html:`<h3>The President of the Republic</h3>
<dl class="facts"><dt>Election</dt><dd>Direct universal suffrage, two rounds, <b>5 years</b>, at most <b>2 consecutive terms</b>.</dd><dt>Seat</dt><dd>The <b>Élysée</b> Palace.</dd><dt>Current</dt><dd>Emmanuel Macron (2017, re-elected 2022).</dd></dl>
<ul><li>Guardian of the Constitution and national independence.</li><li><b>Appoints the Prime Minister</b> and ministers (on the PM’s proposal).</li><li>Chairs the Council of Ministers (Wednesdays).</li><li><b>Commander-in-chief</b>; negotiates treaties.</li><li>Promulgates laws; may call a <b>referendum</b> (art. 11).</li><li>May <b>dissolve</b> the National Assembly (art. 12; last in 2024).</li><li>Emergency powers (art. 16); right of pardon.</li></ul>
<h3>The Government</h3>
<dl class="facts"><dt>Head</dt><dd>The <b>Prime Minister</b>, at the <b>Hôtel de Matignon</b>.</dd><dt>Role</dt><dd>“Determines and conducts the policy of the Nation” (art. 20): bills, decrees, administration.</dd><dt>Accountable</dt><dd>To the <b>National Assembly</b>: motion of censure (art. 49).</dd></dl>
<div class="call"><b>Check</b>The Prime Minister has changed several times since 2024. Check the current name, and the Interior Minister, on gouvernement.fr the week of your interview.</div>
<p><b>Cohabitation</b>: President and parliamentary majority from opposite camps (1986-88, 1993-95, 1997-2002).</p>`,
traps:["Élysée = President; Matignon = Prime Minister.","5-year term (not 7 since 2002).","The Government answers to the National Assembly, not the Senate."]},

13:{t:"Parliament and lawmaking",obj:"Understand how a law is made.",
html:`<div class="tscroll"><table class="t"><thead><tr><th></th><th>Assemblée nationale</th><th>Sénat</th></tr></thead><tbody>
<tr><td>Members</td><td><b>577 MPs</b></td><td><b>348 senators</b></td></tr>
<tr><td>Election</td><td>Direct</td><td>Indirect (~160,000 electors)</td></tr>
<tr><td>Term</td><td>5 years (can be dissolved)</td><td>6 years, half renewed every 3 years</td></tr>
<tr><td>Seat</td><td>Palais Bourbon</td><td>Palais du Luxembourg</td></tr>
<tr><td>Special</td><td>Final say; can bring down the Government</td><td>Represents local authorities</td></tr>
</tbody></table></div>
<p>Parliament <b>passes laws and the budget</b> and <b>scrutinises the Government</b>. Meeting jointly at Versailles = the <b>Congress</b> (constitutional amendments).</p>
<h3>How a law is made</h3>
<ol><li>Government bill or member’s bill.</li><li>Committee and votes in both chambers (the <span lang="fr">navette</span>).</li><li>If they disagree, the Assembly decides.</li><li>Possible review by the Constitutional Council.</li><li>Promulgation and publication in the <span lang="fr">Journal officiel</span>.</li></ol>
<p><b>Art. 49.3</b>: the Government can pass a text without a vote unless a motion of censure succeeds. <b>Referendum</b>: the people vote directly (art. 11).</p>`,
traps:["577 MPs, 348 senators — don’t swap them.","Palais Bourbon = Assembly; Luxembourg = Senate.","Senators: indirect election, 6 years."]},

14:{t:"Justice and liberties",obj:"Know how justice is organised and your rights before it.",
html:`<h3>Two court systems</h3>
<dl class="facts"><dt>Judicial</dt><dd>Disputes between people and offences. Judicial court → Court of appeal → <b>Cour de cassation</b>. Police court (minor offences), criminal court (délits), <b>Cour d’assises</b> (serious crimes, with jurors drawn by lot).</dd>
<dt>Administrative</dt><dd>Disputes with the administration. Administrative court → Administrative court of appeal → <b>Conseil d’État</b>.</dd>
<dt>Specialised</dt><dd><b>Conseil de prud’hommes</b> (employment), commercial court.</dd></dl>
<h3>Your rights</h3>
<ul><li><b>Presumption of innocence</b>; right to a lawyer and to appeal.</li><li>In <b>garde à vue</b> (police custody, 24 h renewable): a lawyer <b>from the start</b>, a doctor, informing a relative, the right to silence, an interpreter.</li><li><b>Aide juridictionnelle</b>: the State pays the lawyer for people on low incomes.</li><li>Victims: file a complaint with police/gendarmerie or by letter to the prosecutor.</li></ul>
<h3>Independent authorities</h3>
<dl class="facts"><dt>Défenseur des droits</dt><dd>Free: discrimination, administrative abuse, children’s rights, conduct of security forces.</dd>
<dt>CNIL</dt><dd>Personal data protection (GDPR).</dd>
<dt>Cour des comptes</dt><dd>Audits public money.</dd>
<dt>Conseil constitutionnel</dt><dd>Reviews laws and national elections.</dd></dl>
<p>Justice is <b>independent</b> of the Government (separation of powers) and is rendered “in the name of the French people”.</p>`,
traps:["Cour de cassation (judicial) ≠ Conseil d’État (administrative).","In custody, a lawyer is guaranteed from the first hour.","Prud’hommes = employment; assises = serious crimes with jurors."]},

15:{t:"Regions, departments, communes and overseas France",obj:"Territorial organisation and your own commune.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Level</th><th>How many</th><th>Run by</th><th>Responsibilities</th></tr></thead><tbody>
<tr><td><b>Region</b></td><td>18 (13 + 5)</td><td>Regional council (6 years)</td><td><b>Lycées</b>, regional trains, economy, training</td></tr>
<tr><td><b>Department</b></td><td>101 (96 + 5)</td><td>Departmental council (6 years)</td><td><b>Social welfare</b> (RSA, elderly, child protection), <b>collèges</b>, roads</td></tr>
<tr><td><b>Commune</b></td><td>~35,000</td><td>Municipal council (6 years) → <b>maire</b></td><td><b>Primary schools</b>, civil registry, planning</td></tr>
</tbody></table></div>
<p>Inter-communal bodies: communities of communes, metropolises. Last municipal elections: <b>March 2026</b>.</p>
<h3>The State locally</h3><p>The <b>préfet</b> (created 1800) represents the State: security, public order, foreigners, naturalisation, legality checks. The mayor is also a State agent (civil registry, elections).</p>
<h3>The 13 metropolitan regions</h3><div class="regs" data-regs></div>
<h3>Overseas France</h3>
<ul><li><b>5 DROM</b>: Guadeloupe (971), Martinique (972), Guyane (973), La Réunion (974), Mayotte (976). Part of the EU.</li><li><b>COM</b>: French Polynesia, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, Saint-Martin, Saint-Barthélemy.</li><li><b>New Caledonia</b>: special status.</li><li>TAAF and Clipperton.</li></ul>
<div class="call tip"><b>Must know</b>Your commune and mayor, your department (name and number), your region and its capital, your prefect, your MP.</div>`,
traps:["18 regions (13 in mainland France), 101 departments.","New Caledonia and French Polynesia are not departments.","Primary school = commune; collège = department; lycée = region."]},

16:{t:"Physical geography and major cities",obj:"Picture the map of France.",
html:`<dl class="facts"><dt>Area</dt><dd>~550,000 km² in mainland France (largest EU country).</dd><dt>Population</dt><dd>~68 million.</dd><dt>Capital</dt><dd>Paris.</dd><dt>Shape</dt><dd>“The Hexagon”.</dd></dl>
<h3>Seas</h3><p>English Channel and North Sea (north), Atlantic (west), Mediterranean (south). Corsica is a Mediterranean island.</p>
<h3>Neighbours</h3><p>Mainland: <b>Belgium, Luxembourg, Germany, Switzerland, Italy, Monaco, Spain, Andorra</b>. Overseas: <b>Brazil</b> and Suriname (via French Guiana — the ~730 km border with Brazil is France’s longest), the <b>Netherlands</b> (Saint-Martin).</p>
<h3>Mountains</h3><ul><li><b>Alps</b>: Mont Blanc 4,805 m.</li><li><b>Pyrenees</b>: border with Spain.</li><li><b>Massif Central</b>: volcanoes (Puy de Dôme).</li><li><b>Jura</b>, <b>Vosges</b>.</li></ul>
<h3>Rivers</h3><div class="tscroll"><table class="t"><thead><tr><th>River</th><th>Flows into</th><th>Cities</th></tr></thead><tbody>
<tr><td>Loire</td><td>Atlantic</td><td>Orléans, Tours, Nantes — the longest (~1,000 km)</td></tr>
<tr><td>Seine</td><td>Channel</td><td>Paris, Rouen, Le Havre</td></tr>
<tr><td>Rhône</td><td>Mediterranean</td><td>Lyon, Avignon</td></tr>
<tr><td>Garonne</td><td>Atlantic</td><td>Toulouse, Bordeaux</td></tr>
<tr><td>Rhine</td><td>North Sea</td><td>Strasbourg</td></tr></tbody></table></div>
<h3>Cities</h3><p>Paris · Marseille · Lyon · Toulouse · Nice · Nantes · Montpellier · Strasbourg · Bordeaux · Lille. Strasbourg: European Parliament. Marseille: largest port. Toulouse: aerospace.</p>`,
traps:["Portugal does not border France.","The Loire is the longest river, not the Seine.","Second city: Marseille, not Lyon."]},

17:{t:"France in Europe and the world",obj:"France’s role in the EU and international bodies.",
html:`<dl class="facts"><dt>9/05/1950</dt><dd><b>Schuman Declaration</b>: Europe Day.</dd><dt>1951</dt><dd>ECSC (6 countries).</dd><dt>1957</dt><dd><b>Treaty of Rome</b>: EEC; France a founder.</dd><dt>1979</dt><dd>First direct election of the European Parliament (Simone Veil president).</dd><dt>1985/95</dt><dd>Schengen area.</dd><dt>1992</dt><dd><b>Maastricht</b>: European Union.</dd><dt>2002</dt><dd>Euro.</dd><dt>2020</dt><dd>Brexit: 27 members.</dd></dl>
<div class="tscroll"><table class="t"><thead><tr><th>Institution</th><th>Seat</th><th>Role</th></tr></thead><tbody>
<tr><td>European Parliament</td><td>Strasbourg</td><td>Elected every 5 years (2024); 81 French MEPs</td></tr>
<tr><td>European Commission</td><td>Brussels</td><td>Proposes and implements</td></tr>
<tr><td>Council of the EU / European Council</td><td>Brussels</td><td>Ministers / heads of State</td></tr>
<tr><td>Court of Justice of the EU</td><td>Luxembourg</td><td>Interprets EU law</td></tr></tbody></table></div>
<p>Symbols: blue flag with <b>12 stars</b>, “Ode to Joy”, motto “United in diversity”. EU citizens vote in local and European elections where they live.</p>
<div class="call info"><b>Don’t confuse</b>The Council of Europe (46 countries, Strasbourg, European Court of Human Rights) is not the EU.</div>
<h3>In the world</h3><ul><li>Permanent member of the UN Security Council (veto).</li><li>NATO founder (1949), G7, G20.</li><li>Francophonie: ~320 million speakers (OIF).</li><li>Nuclear power; 2nd-largest maritime area in the world.</li></ul>`,
traps:["12 stars ≠ number of countries.","ECHR (Council of Europe) ≠ EU Court of Justice.","Treaty of Rome 1957 (EEC) ≠ Maastricht 1992 (EU)."]},

18:{t:"Rights, duties and elections",obj:"List rights and duties confidently.",
html:`<h3>Rights</h3><ul><li><b>Civil</b>: expression, conscience, religion, movement, association, assembly, privacy, property, equality.</li><li><b>Political</b> (French citizens, 18+): to vote and stand for election.</li><li><b>Social</b>: health, education, work, strike, unions, social protection, decent housing, asylum.</li></ul>
<h3>Duties</h3><ul><li>Obey the law and respect others.</li><li><b>Pay taxes</b> according to means.</li><li><b>Vote</b>: a civic duty, but <b>not compulsory</b>.</li><li>Defence: census at 16 and the <b>JDC</b>; military service suspended in 1997.</li><li>Serve as a <b>juror</b> if drawn.</li><li>Educate your children (ages 3-16; training to 18).</li><li>Help a person in danger.</li></ul>
<h3>Elections</h3><div class="tscroll"><table class="t"><thead><tr><th>Election</th><th>Elects</th><th>Every</th></tr></thead><tbody>
<tr><td>Presidential</td><td>President</td><td>5 years (2027)</td></tr><tr><td>Legislative</td><td>MPs</td><td>5 years (last 2024)</td></tr><tr><td>Municipal</td><td>Councillors → mayor</td><td>6 years (2026)</td></tr><tr><td>Departmental / Regional</td><td>Councillors</td><td>6 years</td></tr><tr><td>European</td><td>MEPs</td><td>5 years (2024)</td></tr></tbody></table></div>
<p>Voting is <b>secret</b> (booth compulsory) and personal; proxy votes allowed. Registration is automatic at 18 and, for naturalised citizens, generally automatic after the decree — check service-public.</p>`,
traps:["Voting is not compulsory in France.","Non-EU foreigners cannot vote in any election.","Schooling is compulsory from age 3 (not 6)."]},

19:{t:"Family, school, health and emergencies",obj:"Handle real-life situations about family and daily life.",
html:`<h3>Family</h3><ul><li><b>Civil marriage</b> at the town hall — the only legally valid one — <b>before</b> any religious ceremony.</li><li>Same-sex marriage since 2013; PACS since 1999.</li><li>Minimum age 18, free consent; forced marriage and polygamy banned.</li><li>Joint <b>parental authority</b>; all corporal punishment banned (2019).</li><li>Divorce possible; children inherit equally.</li></ul>
<h3>School</h3><ul><li>Compulsory education from 3 to 16; free, secular state school.</li><li>All lessons are compulsory (swimming, sex education, science) for girls and boys.</li><li>Primary → collège (11-15) → lycée (15-18) → baccalauréat.</li></ul>
<h3>Health</h3><p><b>Social Security</b> (1945): illness, pensions, family, workplace accidents. Carte Vitale, declared GP, top-up insurance (mutuelle); free top-up for low incomes. Compulsory vaccinations for children; PMI for mothers and babies.</p>
<h3>Emergencies</h3><div class="tscroll"><table class="t"><tbody>
<tr><td><b>15</b></td><td>SAMU (medical)</td></tr><tr><td><b>17</b></td><td>Police / Gendarmerie</td></tr><tr><td><b>18</b></td><td>Fire brigade</td></tr><tr><td><b>112</b></td><td>European emergency</td></tr><tr><td><b>114</b></td><td>Emergency by text</td></tr><tr><td><b>115</b></td><td>Homeless emergency</td></tr><tr><td><b>119</b></td><td>Child at risk</td></tr><tr><td><b>3919</b></td><td>Violence against women</td></tr></tbody></table></div>`,
traps:["A religious wedding alone has no legal value.","No lesson can be skipped on religious grounds.","15 SAMU, 17 police, 18 fire — don’t mix them up."]},

20:{t:"Work, housing, consumer rights and banking",obj:"Master the practical scenarios (mises en situation) of the exam.",
html:`<h3>Work</h3><ul><li><b>35-hour</b> week; <b>5 weeks</b> paid leave; minimum wage <b>SMIC</b>.</li><li>Permanent (CDI) or fixed-term (CDD) contract; trial period; payslip compulsory.</li><li>Discrimination banned; you need not answer questions on religion, pregnancy or private life in a job interview.</li><li>Unpaid wages, unfair dismissal → <b>conseil de prud’hommes</b> (including urgent <span lang="fr">référé</span>); labour inspectorate.</li><li>Undeclared work is illegal. France Travail for job seekers.</li></ul>
<h3>Housing</h3><ul><li>Lease (<span lang="fr">bail</span>), deposit, inventory on entry and exit.</li><li>The landlord <b>cannot enter</b> without permission: that is trespass (violation de domicile).</li><li>Refusing a tenant because of origin or name = discrimination → complaint or Défenseur des droits.</li><li>Home insurance compulsory for tenants. Housing aid from the CAF (APL).</li><li>Night noise (10 pm-7 am), recycling, building rules.</li></ul>
<h3>Consumer rights and banking</h3><ul><li><b>Legal guarantee of conformity</b>: 2 years, free, on new goods.</li><li>Online purchase: 14 days to withdraw.</li><li>No bank will open an account? <b>Droit au compte</b> via the Banque de France.</li><li>Over-indebtedness: Banque de France commission.</li></ul>
<h3>Taxes</h3><p>Annual income declaration (even if nothing is owed), tax withheld at source, VAT (TVA) on purchases, property tax for owners.</p>`,
traps:["Prud’hommes (employment) ≠ administrative court.","The legal guarantee lasts 2 years and is free — no insurance needed.","The landlord has no “right of inspection” without your consent."]},

21:{t:"Culture, famous figures, Panthéon and holidays",obj:"Have cultural references ready.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Field</th><th>Names</th></tr></thead><tbody>
<tr><td>Literature</td><td><b>Molière</b> (theatre, 17th c.) · La Fontaine · <b>Voltaire</b> · Rousseau · <b>Victor Hugo</b> (Les Misérables) · Balzac · Flaubert · <b>Zola</b> · Proust · Saint-Exupéry (The Little Prince) · <b>Camus</b> (Nobel 1957) · Simone de Beauvoir · Annie Ernaux (Nobel 2022)</td></tr>
<tr><td>Science</td><td><b>Marie Curie</b> (2 Nobels) · <b>Pasteur</b> (rabies vaccine) · Descartes · Pascal · Lavoisier</td></tr>
<tr><td>Arts</td><td><b>Monet</b> (Impressionism) · Renoir · Cézanne · Delacroix (Liberty Leading the People) · Rodin</td></tr>
<tr><td>Music</td><td>Debussy · Ravel · Bizet · Édith Piaf · Aznavour</td></tr>
<tr><td>Cinema</td><td>The <b>Lumière</b> brothers (1895) · Cannes Festival</td></tr>
<tr><td>Politics</td><td>Jaurès · Clemenceau · <b>Simone Veil</b> · Badinter · Jean Moulin</td></tr></tbody></table></div>
<h3>The Panthéon</h3><p><span lang="fr">« Aux grands hommes, la patrie reconnaissante »</span>. Voltaire, Rousseau, Hugo, Zola, Jaurès, Moulin, Marie Curie, Simone Veil (2018), Joséphine Baker (2021), Manouchian (2024), Badinter (2025).</p>
<h3>Heritage</h3><p>Eiffel Tower (1889), Louvre, Arc de Triomphe, Notre-Dame (reopened Dec. 2024), Mont-Saint-Michel, Versailles, Loire châteaux, Pont du Gard. The French gastronomic meal (2010) and the baguette (2022) are UNESCO heritage. Tour de France since 1903.</p>
<h3>11 public holidays</h3><div class="tscroll"><table class="t"><tbody>
<tr><td>1 Jan</td><td>New Year</td></tr><tr><td>varies</td><td>Easter Monday</td></tr><tr><td>1 May</td><td>Labour Day</td></tr><tr><td><b>8 May</b></td><td>Victory 1945</td></tr><tr><td>varies</td><td>Ascension</td></tr><tr><td>varies</td><td>Whit Monday</td></tr><tr><td><b>14 July</b></td><td>National day</td></tr><tr><td>15 Aug</td><td>Assumption</td></tr><tr><td>1 Nov</td><td>All Saints</td></tr><tr><td><b>11 Nov</b></td><td>Armistice 1918</td></tr><tr><td>25 Dec</td><td>Christmas</td></tr></tbody></table></div>
<p>+2 in Alsace-Moselle (Good Friday, 26 Dec). 10 May: remembrance of slavery.</p>`,
traps:["Les Misérables = Hugo, not Zola.","Pasteur = rabies; Curie = radioactivity.","8 May = 1945; 11 November = 1918."]},

22:{t:"Interview rehearsal",obj:"Practise personal and values answers out loud.",
html:`<p>Today you <b>speak</b>. Open the <b>Interview</b> tab and follow this plan:</p>
<ol><li><b>3 min</b> — Introduce yourself out loud (about 1 minute).</li><li><b>5 min</b> — Answer the motivation and values questions without reading; then compare with the model.</li><li><b>4 min</b> — Answer the scenarios.</li><li><b>3 min</b> — Review your personal sheet.</li></ol>
<h3>Personal sheet (fill in and learn)</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>My commune / mayor</td><td>____________</td></tr><tr><td>Department (no.) / prefect</td><td>____________</td></tr><tr><td>Region / capital</td><td>____________</td></tr><tr><td>My MP</td><td>____________</td></tr><tr><td>Arrival in France</td><td>____________</td></tr><tr><td>Employers and dates</td><td>____________</td></tr><tr><td>Addresses since arrival</td><td>____________</td></tr><tr><td>President / Prime Minister</td><td>Emmanuel Macron / (check)</td></tr></tbody></table></div>
<div class="call"><b>Consistency</b>The officer has your file: dates, addresses, jobs and family must match exactly.</div>
<div class="call tip"><b>Technique</b>Fact + personal example + value. Three sentences, no more, no less.</div>`,
traps:["Robotic memorised answers: the officer notices and digs deeper.","Contradicting your file.","Criticising France or the current government: stick to institutions and values."]},

23:{t:"Final mock exam and review",obj:"Sit a full mock exam and review mistakes.",
html:`<p>Real exam day: <b>40 questions, 45 minutes, target 32</b> (ideally 36+). <b>Mock exam</b> tab → “Full exam”.</p>
<ol><li>Do it without notes.</li><li>Write down the topics you missed.</li><li>They go automatically into “Review” in the flashcards.</li><li>Re-read the matching modules.</li></ol>
<h3>The 20 most-asked facts</h3>
<dl class="facts"><dt>Motto</dt><dd>Liberté, Égalité, Fraternité</dd><dt>Art. 1</dt><dd>Indivisible, secular, democratic and social</dd><dt>1789</dt><dd>Bastille (14/07), Declaration (26/08)</dd><dt>1792</dt><dd>First Republic; Marseillaise</dd><dt>1848</dt><dd>Second Republic; male suffrage; end of slavery</dd><dt>1870</dt><dd>Third Republic</dd><dt>1881-82</dt><dd>Ferry schools</dd><dt>1905</dt><dd>Laïcité</dd><dt>1918</dt><dd>Armistice 11/11</dd><dt>1940</dt><dd>18 June; Vichy</dd><dt>1944</dt><dd>Women’s vote</dd><dt>1945</dt><dd>8 May; Social Security</dd><dt>1946</dt><dd>Fourth Republic</dd><dt>1957</dt><dd>Treaty of Rome</dd><dt>1958</dt><dd>Fifth Republic, 4/10</dd><dt>1962</dt><dd>Direct presidential election</dd><dt>1981</dt><dd>End of the death penalty</dd><dt>2002</dt><dd>Euro</dd><dt>577 / 348</dt><dd>MPs / senators</dd><dt>18 / 101</dt><dd>Regions / departments</dd></dl>`,
traps:["Read every option: wrong answers are often almost right.","Spend no more than a minute per question; come back to hard ones."]}
};

;
DEEP.en = {
3:`<h4>Why does France stress gender equality so much?</h4>
<p>Because it was won slowly, and the State treats it as part of republican identity. Timeline: 1944 the vote; 1946 equality in the Preamble; 1965 a married woman may work and open an account without her husband; 1967 contraception (Neuwirth law); 1970 joint parental authority replaces “paternal power”; 1975 Veil law (abortion) and divorce by mutual consent; 1983 workplace equality; 2000 electoral parity; 2011 quotas on company boards; 2024 abortion in the Constitution.</p>
<h4>Discrimination: what the law bans</h4>
<p>The Criminal Code lists over 25 banned criteria: origin, sex, family situation, pregnancy, appearance, surname, place of residence, health, disability, sexual orientation, gender identity, age, political opinions, union activity, religion, language… Discriminating in hiring, housing or access to a service can cost up to 3 years in prison and a €45,000 fine.</p>
<h4>Cases to train your reasoning</h4>
<dl class="facts">
<dt>Case</dt><dd>An estate agent asks for tenants “preferably without a foreign surname”. → Discrimination (surname/origin). Remedy: complaint or Défenseur des droits.</dd>
<dt>Case</dt><dd>A sports club reserves pool time for women of one religion only. → Contrary to equality and neutrality if it is a public facility.</dd>
<dt>Case</dt><dd>A brother forbids his adult sister to go out. → She is free; restricting someone’s liberty can be a crime (false imprisonment, psychological violence).</dd>
</dl>
<h4>How to answer in the interview</h4>
<p>Avoid “yes, but…”. The officer expects commitment without reservations. A good structure: principle → example from your life → consequence. <span lang="fr">« Chez nous, ma femme et moi prenons les décisions ensemble ; nos enfants, filles et garçons, ont les mêmes droits et les mêmes chances. »</span></p>`,

4:`<h4>The logic that solves 90 % of laïcité questions</h4>
<p>Always ask two questions: <b>1) who is the person?</b> (State official or private individual) and <b>2) where are they?</b> (school up to lycée, public service, street, company). The <b>official</b> is always neutral. The <b>individual</b> is free, with three limits: the 2004 law (pupils), the 2010 law (face covering) and public order.</p>
<div class="tscroll"><table class="t"><thead><tr><th>Situation</th><th>Answer</th><th>Why</th></tr></thead><tbody>
<tr><td>A mother wearing a headscarf accompanies a school trip</td><td>Allowed in principle</td><td>She is a volunteer user, not an official; the school may restrict for order or proselytising.</td></tr>
<tr><td>Town-hall clerk wearing a headscarf at the counter</td><td>Banned</td><td>Public official.</td></tr>
<tr><td>Bus driver of a private firm running a public service</td><td>Neutrality required</td><td>The 2021 law extends neutrality to contractors.</td></tr>
<tr><td>A pupil asks to skip a biology class on evolution</td><td>Refused</td><td>The syllabus is compulsory; schools don’t adapt to beliefs.</td></tr>
<tr><td>Nativity scene in the town hall</td><td>Only if cultural/festive, not religious</td><td>Council of State, 2016.</td></tr>
<tr><td>Street prayers blocking the road</td><td>Can be banned</td><td>Public order, not because they are religious.</td></tr>
<tr><td>Private company bans religious signs for customer-facing staff</td><td>Possible</td><td>If set in internal rules, general and justified.</td></tr>
</tbody></table></div>
<h4>The historical context of the 1905 law</h4>
<p>In the 19th century the Catholic Church weighed heavily on schools and politics. After the Dreyfus affair, republicans wanted to make sure no religion dominated the State. The 1905 law ended Napoleon’s Concordat (1801) while guaranteeing free worship. Religious buildings built before 1905 belong to the State or the communes, which maintain them (that is why Notre-Dame belongs to the State).</p>
<h4>Blasphemy</h4>
<p>There is no offence of blasphemy in France (an old Alsace-Moselle rule was repealed in 2017): criticising or caricaturing a religion is allowed; insulting or inciting hatred against <b>people</b> because of their religion is banned.</p>`,

5:`<h4>How the Constitution is changed (art. 89)</h4>
<ol><li>Proposed by the President (on the PM’s suggestion) or by members of Parliament.</li><li>Passed in identical terms by the Assembly and the Senate.</li><li>Approved by <b>referendum</b> or, if the President chooses, by the <b>Congress</b> (both chambers meeting at Versailles) with 3/5 of the votes.</li></ol>
<p>That is how abortion was added in 2024: 780 votes in favour in Congress.</p>
<h4>The QPC in practice</h4>
<p>Since 2010, if during a case you think the law being applied breaches your constitutional rights, you can raise a <b>priority question of constitutionality</b>. The judge sends it to the Council of State or the Cour de cassation, which refer it to the Constitutional Council. If it agrees, the law is struck down for everyone.</p>
<h4>Rule of law</h4>
<p>The State itself obeys the rules: a hierarchy of norms (Constitution > treaties > laws > decrees > orders), independent judges, protected fundamental rights. A mayor or a minister can be convicted; an unlawful decree can be annulled by an administrative judge.</p>`,

7:`<h4>Why did the Revolution happen?</h4>
<ul><li><b>Financial crisis</b>: wars (including support for American independence) had indebted the kingdom.</li><li><b>Unfair taxes</b>: nobles and clergy paid almost nothing; the “Third Estate” (98 % of people) paid everything.</li><li><b>Enlightenment ideas</b>: popular sovereignty, equality, separation of powers.</li><li><b>Hunger</b>: bad harvests in 1788, expensive bread.</li></ul>
<h4>What changed</h4>
<p>End of the society of orders and of privileges; equality before the law and taxes; end of absolute monarchy; birth of the citizen. Departments (1790) replace old provinces to unify the country. Civil registers (births, marriages, deaths) move from the Church to the town hall in 1792.</p>
<h4>The dark side</h4>
<p>The Revolution was also violent: the Terror (1793-1794) with about 17,000 official death sentences, the war in the Vendée. Knowing this shows historical maturity.</p>`,

9:`<h4>The Third Republic “founds” modern republican France</h4>
<p>After the 1870 defeat and the Commune, republicans had to win over a country still largely monarchist and Catholic. Their strategy: <b>schools</b>. The “hussard noir” (primary teacher) taught reading, arithmetic, national history and civic morals in every village. French replaced regional languages.</p>
<h4>The Dreyfus affair in 4 points</h4>
<ol><li>1894: Captain Alfred Dreyfus, a Jew, is convicted of spying on forged evidence.</li><li>1898: Zola publishes “J’accuse…!” and is convicted of libel.</li><li>France splits into “Dreyfusards” (justice, rights) and “anti-Dreyfusards” (army, nation).</li><li>1906: Dreyfus is cleared. The affair led to the Human Rights League (1898) and paved the way for the 1905 law.</li></ol>
<h4>The Great War</h4>
<p>Trench warfare, 1.4 million French soldiers killed, including colonial troops (Senegalese, Algerian tirailleurs…). Every commune has a war memorial. 11 November honours all who died for France.</p>`,

10:`<h4>Two Frances in 1940</h4>
<p>After defeat, the north and Atlantic coast were occupied by Germany; the south was the “free zone” until November 1942. In Vichy, Marshal Pétain received full powers and created the “État français”: end of the Republic, motto “Travail, Famille, Patrie”, the anti-Jewish statute (October 1940), collaboration with Germany.</p>
<h4>The Righteous</h4>
<p>Many French people hid Jews at the risk of their lives: the “Righteous Among the Nations” (over 4,000 recognised in France). About 75 % of Jews in France survived, partly thanks to this solidarity.</p>
<h4>The Resistance</h4>
<p>Inside (networks, maquis, sabotage, underground papers) and outside (De Gaulle’s Free France, with colonial soldiers). The National Resistance Council (1943) drew up the post-war programme: Social Security, women’s vote, nationalisations.</p>
<h4>The duty to remember</h4>
<p>In 1995 Jacques Chirac acknowledged that “France” committed the irreparable in the Vél d’Hiv round-up. Memorial sites: Shoah Memorial (Paris), Oradour-sur-Glane (massacred village), the D-Day beaches.</p>`,

11:`<h4>Why did the Fourth Republic fall?</h4>
<p>Parliament was all-powerful and divided: governments fell on average every 6 months. Faced with the Algerian War and the threat of a military coup in May 1958, Parliament called on De Gaulle, who demanded a new Constitution with a <b>strong executive</b>.</p>
<h4>The tools of a strong executive</h4>
<ul><li>President elected directly (since 1962), with personal powers: dissolution, referendum, art. 16.</li><li>Government protected by art. 49.3 and by the difficulty of passing a motion of censure (absolute majority).</li><li>“Rationalised” Parliament: the Government controls much of the agenda.</li></ul>
<h4>The Algerian War</h4>
<p>Algeria had been French since 1830, with a million Europeans. The war (1954-1962) ended with the Évian Accords and independence. About 800,000 “pieds-noirs” and harkis came to France. It remains a sensitive memory.</p>
<h4>May 68</h4>
<p>Student revolt and a general strike of ~10 million workers. Results: a 35 % rise in the minimum wage, more freedom in universities and in social life.</p>`,

12:`<h4>How the presidential election works</h4>
<p>To stand: be French, 18 or over, and gather <b>500 signatures</b> (“parrainages”) from elected officials (mayors, MPs…) in at least 30 departments. First round; if no one has an absolute majority, a run-off between the top two two weeks later.</p>
<h4>The 2024 dissolution</h4>
<p>In June 2024, after the European elections, the President dissolved the Assembly. The snap election produced an Assembly with no absolute majority, split into three blocs. Result: fragile governments, motions of censure (the Barnier government fell in December 2024) and successive Prime Ministers. That is why the site asks you to check the current name.</p>
<h4>Motion of censure</h4>
<p>Signed by 1/10 of MPs; it passes only with an absolute majority of members (289 votes). If it passes, the Prime Minister must resign with the Government.</p>
<h4>Ministers</h4>
<p>Each ministry runs a sector (Interior, Justice, Economy, Education…). The <b>Interior Minister</b> is in charge of police, prefectures and naturalisation: your decree is prepared in their name.</p>`,

13:`<h4>A law’s life, a real example</h4>
<p>“Marriage for all” (2013): Government bill → Assembly debate (over 130 hours) → Senate → further reading → adoption → referral to the Constitutional Council (upheld) → promulgated 17 May 2013 → first wedding in Montpellier on 29 May.</p>
<h4>What Parliament scrutinises</h4>
<ul><li><b>Questions to the government</b> (Tuesdays and Wednesdays in the Assembly, televised).</li><li><b>Committees of inquiry</b> that can summon anyone.</li><li><b>Budget</b>: without the finance act, the State cannot spend.</li></ul>
<h4>Why is the Senate elected indirectly?</h4>
<p>Because it represents <b>local authorities</b> (communes, departments, regions). Its electors are mostly municipal councillors, so rural communes weigh heavily. The Senate is known as the “chamber of reflection”; it cannot bring down the Government, and the Assembly has the final say.</p>
<h4>Shared-initiative referendum</h4>
<p>Since 2008, 1/5 of parliamentarians backed by 1/10 of voters (~4.8 million signatures) can trigger a referendum. None has succeeded so far.</p>`,

14:`<h4>Minor offence, délit, crime</h4>
<div class="tscroll"><table class="t"><thead><tr><th>Offence</th><th>Example</th><th>Court</th><th>Maximum penalty</th></tr></thead><tbody>
<tr><td>Contravention</td><td>Illegal parking, night noise</td><td>Police court</td><td>Fine (up to €1,500; €3,000 if repeated)</td></tr>
<tr><td>Délit</td><td>Theft, drink-driving, discrimination, domestic violence</td><td>Criminal court</td><td>Up to 10 years (20 if repeated)</td></tr>
<tr><td>Crime</td><td>Murder, rape, armed robbery</td><td>Cour d’assises (jury) or cour criminelle</td><td>Up to life imprisonment</td></tr>
</tbody></table></div>
<h4>Police custody step by step</h4>
<ol><li>Only if you are suspected of a crime or délit punishable by prison.</li><li>Length: 24 h, renewable once (48 h; longer for terrorism/trafficking).</li><li>You are told your rights in a language you understand.</li><li>Rights: inform a relative and your employer, see a doctor, a lawyer from the start (free duty lawyer if needed), an interpreter, the right to remain silent.</li></ol>
<h4>Victims: your options</h4>
<ul><li>Complaint to police/gendarmerie (they cannot refuse to take it).</li><li>Letter to the public prosecutor.</li><li>Victim-support associations (116 006).</li><li>Domestic violence: 17, 3919; the judge can issue a protection order removing the abuser.</li></ul>`,

18:`<h4>Voting for the first time, step by step</h4>
<ol><li>Check your registration on service-public.fr (“vérifier son inscription”). Naturalised citizens are usually registered automatically, but check.</li><li>If not registered: at the town hall or online, up to the 6th Friday before the election.</li><li>On the day: bring <b>ID</b> (compulsory in communes over 1,000 inhabitants); the voter card is useful but not compulsory.</li><li>Take ballot papers (ideally for all candidates, to keep your vote secret), go into the <b>booth</b>, put your ballot in the envelope, then in the ballot box, and sign the register.</li></ol>
<h4>Duties people forget</h4>
<ul><li><b>Declare your income</b> every year, even if no tax is due.</li><li><b>Census</b> of young people at 16.</li><li><b>Respect court decisions</b> and attend when summoned.</li><li><b>Care for your children</b>: education, health, safety.</li><li><b>Respect public property</b> and the environment (litter, noise).</li></ul>
<h4>Demonstrating</h4>
<p>It is a right. Organisers must declare the demonstration to the town hall or prefecture 3 to 15 days in advance. Demonstrators may not cover their faces or carry weapons. The authorities can ban it if there is a serious threat to public order.</p>`,

19:`<h4>Marriage and family: what often comes up</h4>
<ul><li>Banns published 10 days in advance at the town hall.</li><li>Public ceremony with 2 to 4 witnesses; the mayor reads Civil Code articles on fidelity, respect, mutual support and raising children.</li><li>A religious minister who performs a religious wedding <b>without</b> a prior civil marriage commits an offence.</li><li>A marriage abroad must be registered at the French consulate to be valid in France.</li></ul>
<h4>School: organisation and rules</h4>
<p>Maternelle (3-6), élémentaire (6-11), collège (11-15, “brevet”), lycée (15-18, “bac”). State school is free; supplies and canteen may cost something, with help (grants, income-based prices). Parents take part through school councils and associations. Home schooling is possible, but since 2022 it needs authorisation.</p>
<h4>Health: the right path</h4>
<ol><li>Declare a <b>médecin traitant</b> (better reimbursement).</li><li>Life-threatening emergency: <b>15</b>. Out of hours, not serious: on-call doctor (116 117 in many regions) or on-call pharmacy.</li><li>No means: Complémentaire santé solidaire; for undocumented foreigners, AME.</li></ol>
<h4>Child protection</h4>
<p>Any adult who suspects a child is being mistreated must report it: 119 (free, 24/7). Parents hold parental authority <b>in the child’s interest</b>, not as absolute power.</p>`,

20:`<h4>Employment contracts: the essentials</h4>
<ul><li><b>CDI</b> (permanent) is the norm; <b>CDD</b> (fixed-term) only in set cases (replacement, temporary increase) and for a maximum length.</li><li>Trial period: either side may end it, but never on discriminatory grounds.</li><li>Overtime from the 36th hour, paid at a premium (25 % then 50 %).</li><li>Dismissal: procedure with a prior interview and a real and serious reason; employees can challenge it at the prud’hommes within 12 months.</li><li>Staff representatives (CSE) from 11 employees.</li></ul>
<h4>Housing: moving in and out</h4>
<ol><li>Moving in: written lease, inventory, deposit (max. 1 month unfurnished, 2 furnished), home insurance.</li><li>During: pay rent, look after the property, minor repairs by the tenant; major repairs (roof, boiler) by the landlord.</li><li>Moving out: 3 months’ notice (1 month if furnished or in a “tight” area); deposit back within 1 month if unchanged, 2 months if there is damage.</li></ol>
<p>Substandard housing (damp, unhealthy): the commune and the CAF can step in.</p>
<h4>Consumer rights</h4>
<ul><li><b>Legal guarantee of conformity</b>: 2 years, new goods, free repair or replacement.</li><li><b>Hidden-defects guarantee</b>: a hidden fault that makes the item unusable (also for second-hand goods).</li><li>Doorstep or online sale: 14 days to withdraw.</li><li>Dispute: try to settle → consumer mediator → court.</li></ul>
<h4>Money and scams</h4>
<p>A bank never asks for your code by phone or text. If your card is used fraudulently: block it and dispute within 13 months; the bank must refund unauthorised payments.</p>`
};
