1:{t:"La naturalisation en 2026, étape par étape",obj:"Comprendre les étapes, le format de l’examen civique et de l’entretien, et comment utiliser cette plateforme 15 minutes par jour.",
html:`<h3>Les étapes, dans l’ordre</h3>
<ol>
<li><b>Conditions</b> : en général 5 ans de résidence régulière en France (réduits dans certains cas, par exemple 2 ans après un diplôme d’enseignement supérieur français), des ressources stables, des impôts à jour, pas de condamnation grave.</li>
<li><b>Dossier en ligne</b> sur la plateforme ANEF du ministère de l’Intérieur : état civil, résidence, revenus, impôts, diplôme de français et attestation d’examen civique.</li>
<li><b>Niveau B2 en français</b> (depuis le 1er janvier 2026 ; auparavant B1), prouvé par un diplôme ou un test reconnu (TCF, TEF…).</li>
<li><b>Examen civique</b> : QCM sur écran en français, dans un centre agréé (CCI Paris Île-de-France ou France Éducation International). <b>40 questions, 45 minutes, 32 bonnes réponses minimum (80 %)</b> : 28 questions de connaissance et 12 mises en situation.</li>
<li><b>Entretien d’assimilation</b> en préfecture : échange en français sur votre parcours, votre motivation, votre connaissance de la France et votre adhésion aux valeurs républicaines.</li>
<li><b>Décision</b> par décret publié au <i>Journal officiel</i> (ou refus / ajournement motivé).</li>
<li><b>Cérémonie d’accueil</b> : remise du décret et du <i>Livret du citoyen</i> ; signature de la <i>Charte des droits et devoirs du citoyen français</i>.</li>
</ol>
<h3>Les 5 thèmes officiels</h3>
<dl class="facts">
<dt>Thème 1</dt><dd>Principes et valeurs de la République → <b>jours 2 à 5</b></dd>
<dt>Thème 2</dt><dd>Système institutionnel et politique → <b>jours 11 à 15</b></dd>
<dt>Thème 3</dt><dd>Droits et devoirs → <b>jours 14 et 18</b></dd>
<dt>Thème 4</dt><dd>Histoire, géographie et culture → <b>jours 6 à 11, 16, 17, 21</b></dd>
<dt>Thème 5</dt><dd>Vivre dans la société française → <b>jours 19 et 20</b></dd>
</dl>
<h3>Comment utiliser la plateforme</h3>
<p>Chaque jour : <b>3 min</b> de révision (flashcards), <b>8 min</b> de lecture, <b>4 min</b> de mini-quiz. Chaque module se termine par les <b>questions fréquentes d’entretien</b> sur le thème et les <b>pièges</b> les plus courants. Le week-end, faites un QCM rapide ; la dernière semaine, un examen blanc complet tous les deux jours. Objectif sûr : <b>36/40</b> aux examens blancs avant de vous inscrire.</p>
<div class="call info"><b>Double nationalité</b>La France vous permet de garder votre nationalité d’origine. Vérifiez la règle de votre pays.</div>
<div class="call tip"><b>Conseil</b>Lisez à voix haute. L’entretien est oral : entraînez votre bouche, pas seulement vos yeux.</div>`,
traps:["Confondre l’examen civique (QCM écrit) et l’entretien (oral) : ce sont deux étapes distinctes.","Réviser avec d’anciens supports (livret 2022) : le programme 2026 est plus large.","Croire que l’entretien est un test de mémoire : il porte surtout sur la cohérence et l’adhésion aux valeurs."]},

2:{t:"Les symboles de la République",obj:"Reconnaître et expliquer les symboles officiels : drapeau, hymne, devise, Marianne, fête nationale.",
html:`<p>Article 2 de la Constitution de 1958 : « La langue de la République est le français. L’emblème national est le drapeau tricolore, bleu, blanc, rouge. L’hymne national est La Marseillaise. La devise de la République est Liberté, Égalité, Fraternité. Son principe est : gouvernement du peuple, par le peuple et pour le peuple. »</p>
<dl class="facts">
<dt>Drapeau</dt><dd><b>Bleu, blanc, rouge</b> (depuis le mât). Né de la Révolution : bleu et rouge, couleurs de Paris ; blanc, couleur du roi.</dd>
<dt>Hymne</dt><dd><b>La Marseillaise</b>, écrite en avril 1792 à <b>Strasbourg</b> par <b>Rouget de Lisle</b> (« Chant de guerre pour l’armée du Rhin »). Son nom vient des fédérés marseillais qui la chantaient en arrivant à Paris. Hymne en 1795, puis définitivement en 1879.</dd>
<dt>Devise</dt><dd><b>Liberté, Égalité, Fraternité</b>, héritée de la Révolution, gravée sur les mairies et les écoles.</dd>
<dt>Marianne</dt><dd>Figure féminine coiffée du bonnet phrygien (liberté). Buste dans chaque mairie, présente sur les timbres et le logo de l’État.</dd>
<dt>14 juillet</dt><dd><b>Fête nationale</b> depuis 1880 : prise de la Bastille (1789) et fête de la Fédération (1790). Défilé sur les Champs-Élysées.</dd>
<dt>Autres</dt><dd>Le <b>coq gaulois</b> (non officiel), le <b>sceau</b> de la République, la <b>langue française</b>.</dd>
</dl>
<h3>La Marseillaise : 1er couplet et refrain</h3>
<blockquote>Allons enfants de la Patrie,<br>Le jour de gloire est arrivé !<br>Contre nous de la tyrannie<br>L’étendard sanglant est levé…<br><br><b>Aux armes, citoyens,<br>Formez vos bataillons,<br>Marchons, marchons !<br>Qu’un sang impur abreuve nos sillons !</b></blockquote>
<p>Il n’est pas obligatoire de la connaître par cœur, mais connaître le premier couplet fait très bonne impression.</p>`,
traps:["« Travail, Famille, Patrie » était la devise du régime de Vichy, pas de la République.","La Marseillaise a été écrite à Strasbourg, pas à Marseille.","Le drapeau se lit bleu-blanc-rouge depuis le mât.","Le 14 juillet n’est ni le 11 novembre (armistice) ni le 8 mai (1945)."]},

3:{t:"Liberté, égalité, fraternité",obj:"Expliquer chaque valeur avec des exemples, dont l’égalité femmes-hommes et la lutte contre les discriminations.",
html:`<p>Article 1er de la Constitution : « La France est une République <b>indivisible, laïque, démocratique et sociale</b>. Elle assure l’égalité devant la loi de tous les citoyens sans distinction d’origine, de race ou de religion. Elle respecte toutes les croyances. »</p>
<h3>Liberté</h3>
<p>D’expression, d’opinion, de conscience, de religion, d’aller et venir, d’association, de la presse, de réunion. Limite : « La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui » (DDHC, art. 4). La diffamation, l’injure et l’incitation à la haine sont des <b>délits</b>.</p>
<h3>Égalité</h3>
<ul>
<li><b>Devant la loi</b> : mêmes droits et devoirs, quels que soient l’origine, le sexe, la religion, l’orientation sexuelle, le handicap.</li>
<li><b>Femmes-hommes</b> : droit de vote en 1944 ; depuis 1965, une femme mariée travaille et ouvre un compte sans l’accord de son mari ; 1970, autorité parentale conjointe ; 1972, égalité salariale dans la loi ; 2000, loi sur la parité.</li>
<li><b>Interdits</b> : polygamie, mariage forcé, mutilations sexuelles (crime, même commis à l’étranger), crimes dits « d’honneur », discriminations à l’embauche, au logement, dans l’accès aux services.</li>
</ul>
<h3>Fraternité</h3>
<p>Solidarité concrète : Sécurité sociale (1945), assurance chômage, retraites, RSA, bénévolat. La non-assistance à personne en danger est un délit.</p>
<h3>Les adjectifs de l’article 1er</h3>
<dl class="facts">
<dt>Indivisible</dt><dd>Un seul peuple, un seul territoire, une seule loi ; aucune communauté n’a de droits à part.</dd>
<dt>Laïque</dt><dd>L’État est neutre en matière religieuse (jour 4).</dd>
<dt>Démocratique</dt><dd>La souveraineté appartient au peuple : élections et référendum (art. 3).</dd>
<dt>Sociale</dt><dd>L’État protège les plus fragiles : santé, éducation, travail.</dd>
</dl>`,
traps:["L’égalité ne veut pas dire le même salaire pour tous, mais les mêmes droits devant la loi.","La liberté d’expression a des limites légales (haine, diffamation).","Les femmes votent depuis 1944 (première fois en 1945), pas depuis 1789 ni 1848."]},

4:{t:"La laïcité",obj:"Maîtriser le sujet le plus fréquent : ce qu’elle est, d’où elle vient, qui doit être neutre et qui est libre.",
html:`<p>La laïcité garantit :</p>
<ol><li>La <b>liberté de conscience</b> : croire, ne pas croire, changer de religion.</li><li>La <b>séparation des Églises et de l’État</b> : l’État ne reconnaît, ne salarie ni ne subventionne aucun culte.</li><li>L’<b>égalité</b> de tous, quelles que soient leurs croyances.</li></ol>
<h3>Dates clés</h3>
<dl class="facts">
<dt>1789</dt><dd>DDHC art. 10 : « Nul ne doit être inquiété pour ses opinions, même religieuses… »</dd>
<dt>1881-82</dt><dd>École publique gratuite, obligatoire et <b>laïque</b> (Jules Ferry).</dd>
<dt>9 déc. 1905</dt><dd><b>Loi de séparation des Églises et de l’État</b>. Art. 2 : « La République ne reconnaît, ne salarie ni ne subventionne aucun culte. » Le 9 décembre est la Journée de la laïcité.</dd>
<dt>1946 / 1958</dt><dd>La laïcité entre dans la Constitution.</dd>
<dt>2004</dt><dd>Interdiction des signes religieux <b>ostensibles</b> pour les <b>élèves</b> des écoles, collèges et lycées publics.</dd>
<dt>2010</dt><dd>Interdiction de <b>dissimuler son visage</b> dans l’espace public.</dd>
<dt>2013</dt><dd>Charte de la laïcité à l’école.</dd>
<dt>2021</dt><dd>Loi confortant le respect des principes de la République (neutralité étendue aux délégataires de service public).</dd>
</dl>
<h3>Qui est neutre, qui est libre</h3>
<div class="tscroll"><table class="t"><thead><tr><th>Situation</th><th>Règle</th></tr></thead><tbody>
<tr><td>Agent public (enseignant, agent de mairie, policier, infirmière d’hôpital public)</td><td><b>Neutralité totale</b> : aucun signe religieux, aucun prosélytisme.</td></tr>
<tr><td>Usager du service public</td><td>Libre, visage découvert ; il ne peut pas récuser un agent pour son sexe ou sa religion.</td></tr>
<tr><td>Élève jusqu’au lycée</td><td>Signes ostensibles interdits ; signes discrets autorisés.</td></tr>
<tr><td>Étudiant</td><td>Libre.</td></tr>
<tr><td>Rue</td><td>Libre, sauf dissimulation du visage.</td></tr>
<tr><td>Entreprise privée</td><td>Libre en principe ; le règlement intérieur peut restreindre si c’est justifié.</td></tr>
</tbody></table></div>
<div class="call info"><b>Exception</b>En <b>Alsace-Moselle</b> (allemande en 1905), le régime concordataire s’applique encore : certains cultes sont financés par l’État.</div>
<p><b>Phrase modèle :</b> « Pour moi, la laïcité, c’est la liberté de croire ou de ne pas croire, et la neutralité de l’État. La loi de la République passe avant les règles religieuses. »</p>`,
traps:["La laïcité n’est pas une hostilité aux religions : elle les protège toutes, ainsi que les non-croyants.","La loi de 2004 vise les élèves, pas les parents ni les étudiants.","L’agent public est neutre ; l’usager est libre (visage découvert).","La loi de 1905 connaît une exception en Alsace-Moselle."]},

5:{t:"La Déclaration de 1789 et la Constitution",obj:"Connaître les textes fondateurs : DDHC, Préambule de 1946, Constitution de 1958 et ses révisions.",
html:`<h3>DDHC — 26 août 1789</h3>
<dl class="facts">
<dt>Art. 1</dt><dd>« Les hommes naissent et demeurent libres et égaux en droits. »</dd>
<dt>Art. 2</dt><dd>Droits naturels : liberté, propriété, sûreté, résistance à l’oppression.</dd>
<dt>Art. 3</dt><dd>La souveraineté réside dans la Nation.</dd>
<dt>Art. 4</dt><dd>La liberté = faire tout ce qui ne nuit pas à autrui.</dd>
<dt>Art. 6</dt><dd>La loi est l’expression de la volonté générale.</dd>
<dt>Art. 9</dt><dd>Présomption d’innocence.</dd>
<dt>Art. 10-11</dt><dd>Liberté d’opinion et d’expression.</dd>
<dt>Art. 13</dt><dd>Contribution commune (impôt) selon les facultés.</dd>
<dt>Art. 16</dt><dd>Sans garantie des droits ni séparation des pouvoirs, pas de Constitution.</dd>
</dl>
<h3>Préambule de 1946</h3>
<p>Droits sociaux : égalité femmes-hommes dans tous les domaines, droit de grève, droit syndical, santé, enseignement gratuit et laïque, droit d’asile.</p>
<h3>Constitution du 4 octobre 1958</h3>
<p>Approuvée par référendum le 28 septembre 1958, elle fonde la Ve République (de Gaulle, rédigée avec Michel Debré). Grandes révisions : <b>1962</b> élection directe du Président ; <b>2000</b> quinquennat ; <b>2005</b> Charte de l’environnement ; <b>2007</b> interdiction de la peine de mort ; <b>2008</b> deux mandats consécutifs maximum et QPC ; <b>2024</b> liberté garantie de recourir à l’IVG.</p>
<div class="call info"><b>Bloc de constitutionnalité</b>Constitution de 1958 + DDHC de 1789 + Préambule de 1946 + Charte de l’environnement de 2004. Le Conseil constitutionnel (9 membres, 9 ans) contrôle les lois.</div>`,
traps:["La DDHC date du 26 août 1789, pas du 14 juillet.","La Constitution actuelle est celle de 1958, pas de 1946.","Le contrôle de constitutionnalité relève du Conseil constitutionnel, pas du Conseil d’État."]},

6:{t:"Des origines à la monarchie absolue",obj:"Situer les grands repères avant 1789.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Date</th><th>Événement</th><th>Pourquoi c’est important</th></tr></thead><tbody>
<tr><td>52 av. J.-C.</td><td><b>Vercingétorix</b> vaincu par César à Alésia</td><td>La Gaule devient romaine : latin, droit romain.</td></tr>
<tr><td>vers 496</td><td>Baptême de <b>Clovis</b>, roi des Francs</td><td>Les Francs donnent son nom à la France.</td></tr>
<tr><td>800</td><td><b>Charlemagne</b> couronné empereur</td><td>Grand empire ; diffusion de l’école.</td></tr>
<tr><td>987</td><td>Hugues Capet roi</td><td>Dynastie capétienne.</td></tr>
<tr><td>1337-1453</td><td><b>Guerre de Cent Ans</b></td><td><b>Jeanne d’Arc</b> libère Orléans (1429), brûlée à Rouen (1431).</td></tr>
<tr><td>1539</td><td><b>Ordonnance de Villers-Cotterêts</b></td><td>Le français dans les actes officiels.</td></tr>
<tr><td>1572</td><td>Massacre de la Saint-Barthélemy</td><td>Guerres de religion.</td></tr>
<tr><td>1598</td><td><b>Édit de Nantes</b> (Henri IV)</td><td>Tolérance envers les protestants ; révoqué en 1685.</td></tr>
<tr><td>1635</td><td>Académie française (Richelieu)</td><td>Gardienne de la langue.</td></tr>
<tr><td>1643-1715</td><td><b>Louis XIV</b>, le Roi-Soleil</td><td>Monarchie absolue, Versailles.</td></tr>
<tr><td>XVIIIe s.</td><td><b>Les Lumières</b></td><td>Voltaire, Rousseau, Montesquieu, Diderot.</td></tr>
</tbody></table></div>
<p>Montesquieu (<i>De l’esprit des lois</i>, 1748) théorise la <b>séparation des pouvoirs</b> ; Rousseau (<i>Du contrat social</i>, 1762) la souveraineté populaire ; Voltaire combat le fanatisme.</p>
<div class="call tip"><b>Moyen mnémotechnique</b>Vercingétorix → Clovis → Charlemagne → Jeanne d’Arc → Louis XIV : cinq noms dans l’ordre couvrent 1 700 ans.</div>`,
traps:["Clovis (baptême, vers 496) n’est pas Charlemagne (empereur, 800).","L’édit de Nantes = tolérance religieuse, pas l’abolition de l’esclavage.","Villers-Cotterêts (1539) impose le français ; la loi Toubon date de 1994."]},

7:{t:"La Révolution et la Première République (1792-1804)",obj:"Comprendre la chute de la monarchie et la naissance de la République.",
html:`<h3>1789, l’année de la Révolution</h3>
<dl class="facts">
<dt>5 mai</dt><dd>Réunion des États généraux (crise financière).</dd>
<dt>20 juin</dt><dd>Serment du Jeu de paume.</dd>
<dt>14 juillet</dt><dd><b>Prise de la Bastille</b>.</dd>
<dt>4 août</dt><dd><b>Abolition des privilèges</b>.</dd>
<dt>26 août</dt><dd>DDHC.</dd>
</dl>
<p>1790 : création des <b>départements</b>. 1791 : première Constitution (monarchie constitutionnelle) ; Olympe de Gouges écrit la Déclaration des droits de la femme et de la citoyenne.</p>
<h3>La Première République</h3>
<div class="rep"><div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Proclamée les 21-22 septembre 1792, après la victoire de <b>Valmy</b>.</span></div></div>
<ul><li><b>1793</b> : Louis XVI guillotiné (21 janvier) ; la <b>Terreur</b> (Robespierre).</li><li><b>1794</b> : première abolition de l’esclavage.</li><li><b>1795-1799</b> : le Directoire.</li><li><b>1799</b> : coup d’État du 18 Brumaire, Bonaparte Premier consul.</li><li><b>1804</b> : Napoléon empereur → fin de la Ire République.</li></ul>
<h3>Héritages</h3><p>Système métrique, départements, état civil en mairie, mariage civil et divorce (1792), drapeau, Marseillaise, devise, souveraineté nationale.</p>`,
traps:["La Révolution commence en 1789, mais la République seulement en 1792.","Première abolition de l’esclavage : 1794 ; définitive : 1848.","Bastille = 14 juillet 1789 ; fête de la Fédération = 14 juillet 1790."]},

8:{t:"De l’Empire à la IIe République (1804-1870)",obj:"Ne pas confondre Napoléon Ier et Napoléon III, et savoir ce que 1848 a apporté.",
html:`<h3>Premier Empire (1804-1815)</h3>
<p><b>Napoléon Ier</b> : Code civil (1804), préfets (1800), lycées, Banque de France, Légion d’honneur (1802). Il rétablit l’esclavage en 1802. Vaincu à <b>Waterloo</b> (1815), exilé à Sainte-Hélène.</p>
<h3>Le retour des rois (1815-1848)</h3>
<p>Restauration (Louis XVIII, Charles X) ; révolution de 1830 (les Trois Glorieuses) → monarchie de Juillet (Louis-Philippe), qui tombe en février 1848.</p>
<h3>Deuxième République</h3>
<div class="rep"><div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Courte mais décisive.</span></div></div>
<ul><li><b>Suffrage universel masculin</b>.</li><li><b>Abolition définitive de l’esclavage</b> (27 avril 1848, Victor Schœlcher).</li><li>Liberté de la presse et de réunion ; abolition de la peine de mort en matière politique.</li><li>Déc. 1848 : <b>Louis-Napoléon Bonaparte</b>, premier président élu au suffrage universel.</li><li>2 déc. 1851 : coup d’État ; 1852 : empereur <b>Napoléon III</b>.</li></ul>
<h3>Second Empire (1852-1870)</h3>
<p>Chemins de fer, banques, travaux d’<b>Haussmann</b> à Paris. Fin avec la défaite de <b>Sedan</b> (septembre 1870).</p>`,
traps:["Napoléon Ier (l’oncle, 1804) ≠ Napoléon III (le neveu, 1852).","Le premier président élu au suffrage universel est Louis-Napoléon en 1848, pas de Gaulle.","Le suffrage de 1848 est seulement masculin."]},

9:{t:"La IIIe République (1870-1940)",obj:"La République qui a enraciné les valeurs républicaines.",
html:`<div class="rep"><div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>Proclamée le 4 septembre 1870, après Sedan.</span></div></div>
<dl class="facts">
<dt>1871</dt><dd>Commune de Paris ; perte de l’Alsace-Moselle.</dd>
<dt>1875</dt><dd>Lois constitutionnelles.</dd>
<dt>1879-80</dt><dd>La Marseillaise hymne ; le 14 juillet fête nationale.</dd>
<dt>1881</dt><dd>Liberté de la presse et de réunion.</dd>
<dt>1881-82</dt><dd><b>Lois Jules Ferry</b> : école gratuite, obligatoire, laïque.</dd>
<dt>1884</dt><dd>Liberté syndicale ; rétablissement du divorce.</dd>
<dt>1894-1906</dt><dd><b>Affaire Dreyfus</b> ; Zola, « J’accuse…! » (1898).</dd>
<dt>1901</dt><dd>Loi sur les associations.</dd>
<dt>1905</dt><dd>Séparation des Églises et de l’État.</dd>
<dt>1914</dt><dd>Assassinat de Jean Jaurès ; début de la guerre.</dd>
<dt>1914-18</dt><dd>Première Guerre mondiale : Verdun (1916) ; armistice du <b>11 novembre 1918</b> ; 1,4 million de soldats français tués.</dd>
<dt>1936</dt><dd><b>Front populaire</b> (Léon Blum) : congés payés, semaine de 40 heures.</dd>
<dt>1940</dt><dd>Défaite ; pleins pouvoirs à Pétain (10 juillet) → fin.</dd>
</dl>`,
traps:["Lois Ferry = école ; loi 1901 = associations ; loi 1905 = laïcité.","La IIIe République s’achève en 1940 avec Vichy, pas en 1945.","Armistice de 1918 = 11 novembre."]},

10:{t:"Seconde Guerre mondiale, Vichy et Résistance",obj:"Comprendre la période la plus sombre et la mémoire qu’en garde la France.",
html:`<dl class="facts">
<dt>1939</dt><dd>La France déclare la guerre à l’Allemagne (3 septembre).</dd>
<dt>Juin 1940</dt><dd>Défaite ; Pétain signe l’armistice ; le pays est coupé en deux.</dd>
<dt>18/06/1940</dt><dd><b>Appel du général de Gaulle</b> depuis Londres (BBC) : naissance de la <b>France libre</b>.</dd>
<dt>1940-44</dt><dd><b>Régime de Vichy</b> (« État français ») : fin de la République, collaboration, lois antisémites.</dd>
<dt>Juil. 1942</dt><dd><b>Rafle du Vél d’Hiv</b> : plus de 13 000 Juifs arrêtés par la police française à Paris. En 1995, Jacques Chirac reconnaît la responsabilité de l’État.</dd>
<dt>1943</dt><dd><b>Jean Moulin</b> unifie la Résistance (CNR).</dd>
<dt>21/04/1944</dt><dd>Droit de vote des femmes.</dd>
<dt>06/06/1944</dt><dd>Débarquement en Normandie.</dd>
<dt>25/08/1944</dt><dd>Libération de Paris.</dd>
<dt>08/05/1945</dt><dd>Fin de la guerre en Europe.</dd>
</dl>
<h3>Figures</h3><ul><li><b>Charles de Gaulle</b>, chef de la France libre.</li><li><b>Jean Moulin</b>, héros de la Résistance.</li><li><b>Missak Manouchian</b>, résistant d’origine arménienne, Panthéon 2024.</li><li><b>Simone Veil</b>, rescapée d’Auschwitz.</li><li><b>Joséphine Baker</b>, artiste naturalisée, résistante, Panthéon 2021.</li><li><b>Lucie Aubrac</b>, résistante.</li></ul>
<div class="call tip"><b>Lien personnel</b>Manouchian et Baker étaient des étrangers qui ont choisi la France : des exemples parfaits pour l’entretien.</div>`,
traps:["L’appel du 18 juin = de Gaulle (Londres), pas Pétain.","8 mai 1945 ≠ 11 novembre 1918.","Vichy n’est pas une République : c’est l’« État français »."]},

11:{t:"IVe et Ve Républiques : la chronologie complète",obj:"Connaître les cinq Républiques, leurs dates et leurs repères.",
html:`<h3>Les cinq Républiques</h3>
<div class="rep">
<div><span class="rn">I</span><span class="ry">1792 – 1804</span><span>Révolution ; fin avec l’Empire de Napoléon Ier.</span></div>
<div><span class="rn">II</span><span class="ry">1848 – 1852</span><span>Suffrage masculin, fin de l’esclavage ; fin avec le coup d’État de Louis-Napoléon.</span></div>
<div><span class="rn">III</span><span class="ry">1870 – 1940</span><span>École Ferry, 1905, Grande Guerre ; fin avec Vichy.</span></div>
<div><span class="rn">IV</span><span class="ry">1946 – 1958</span><span>Reconstruction, Sécurité sociale ; instable ; fin avec la crise algérienne.</span></div>
<div><span class="rn">V</span><span class="ry">1958 – aujourd’hui</span><span>De Gaulle ; exécutif fort.</span></div>
</div>
<p>Entre elles : Premier Empire (1804-15), Restauration et monarchie de Juillet (1815-48), Second Empire (1852-70), Vichy (1940-44), Gouvernement provisoire (1944-46).</p>
<h3>IVe République (1946-1958)</h3>
<ul><li>Constitution du 27 octobre 1946 et son Préambule social.</li><li>Sécurité sociale (1945), reconstruction, Trente Glorieuses.</li><li>CECA (1951), traité de Rome (1957).</li><li>Indochine (1946-54), guerre d’Algérie (1954-62).</li><li>Environ 24 gouvernements en 12 ans.</li></ul>
<h3>Ve République</h3>
<dl class="facts">
<dt>1958</dt><dd>Constitution ; de Gaulle président (1959-69).</dd>
<dt>1962</dt><dd>Accords d’Évian (fin de la guerre d’Algérie) ; élection du Président au suffrage direct.</dd>
<dt>1968</dt><dd>Mai 68.</dd>
<dt>1974</dt><dd>Majorité à 18 ans.</dd>
<dt>1975</dt><dd>Loi Veil (IVG).</dd>
<dt>1981</dt><dd>Abolition de la peine de mort (Badinter).</dd>
<dt>1992</dt><dd>Maastricht.</dd>
<dt>1999</dt><dd>PACS.</dd>
<dt>2000</dt><dd>Référendum sur le quinquennat.</dd>
<dt>2002</dt><dd>Euro en circulation.</dd>
<dt>2013</dt><dd>Mariage pour tous.</dd>
<dt>2024</dt><dd>IVG dans la Constitution.</dd>
</dl>
<h3>Présidents de la Ve République</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>1959-1969</td><td>Charles de Gaulle</td></tr><tr><td>1969-1974</td><td>Georges Pompidou</td></tr><tr><td>1974-1981</td><td>Valéry Giscard d’Estaing</td></tr><tr><td>1981-1995</td><td>François Mitterrand</td></tr><tr><td>1995-2007</td><td>Jacques Chirac</td></tr><tr><td>2007-2012</td><td>Nicolas Sarkozy</td></tr><tr><td>2012-2017</td><td>François Hollande</td></tr><tr><td>2017-</td><td>Emmanuel Macron (réélu en 2022 ; élection prévue en 2027)</td></tr>
</tbody></table></div>`,
traps:["Il y a eu 5 Républiques, ni 4 ni 6.","L’élection directe du Président date de 1962, pas de 1958.","Quinquennat voté en 2000, appliqué dès 2002."]},

12:{t:"Le Président et le Gouvernement",obj:"Savoir qui fait quoi au sein de l’exécutif.",
html:`<h3>Le président de la République</h3>
<dl class="facts"><dt>Élection</dt><dd>Suffrage universel direct, deux tours, <b>5 ans</b>, au maximum <b>2 mandats consécutifs</b>.</dd><dt>Siège</dt><dd>Palais de l’<b>Élysée</b>.</dd><dt>Actuel</dt><dd>Emmanuel Macron (2017, réélu en 2022).</dd></dl>
<ul><li>Garant de la Constitution et de l’indépendance nationale.</li><li><b>Nomme le Premier ministre</b> et les ministres (sur proposition du PM).</li><li>Préside le Conseil des ministres (le mercredi).</li><li><b>Chef des armées</b> ; négocie les traités.</li><li>Promulgue les lois ; peut organiser un <b>référendum</b> (art. 11).</li><li>Peut <b>dissoudre</b> l’Assemblée (art. 12 ; dernière fois en 2024).</li><li>Pouvoirs exceptionnels (art. 16) ; droit de grâce.</li></ul>
<h3>Le Gouvernement</h3>
<dl class="facts"><dt>Chef</dt><dd>Le <b>Premier ministre</b>, à l’<b>hôtel de Matignon</b>.</dd><dt>Rôle</dt><dd>« Détermine et conduit la politique de la Nation » (art. 20) : projets de loi, décrets, administration.</dd><dt>Responsable</dt><dd>Devant l’<b>Assemblée nationale</b> : motion de censure (art. 49).</dd></dl>
<div class="call"><b>À vérifier</b>Le Premier ministre a changé plusieurs fois depuis 2024. Vérifiez son nom, ainsi que celui du ministre de l’Intérieur, sur gouvernement.fr la semaine de votre entretien.</div>
<p><b>Cohabitation</b> : Président et majorité parlementaire de bords opposés (1986-88, 1993-95, 1997-2002).</p>`,
traps:["Élysée = Président ; Matignon = Premier ministre.","Mandat de 5 ans (et non 7 depuis 2002).","Le Gouvernement est responsable devant l’Assemblée, pas devant le Sénat."]},

13:{t:"Le Parlement et la loi",obj:"Comprendre comment une loi est adoptée.",
html:`<div class="tscroll"><table class="t"><thead><tr><th></th><th>Assemblée nationale</th><th>Sénat</th></tr></thead><tbody>
<tr><td>Membres</td><td><b>577 députés</b></td><td><b>348 sénateurs</b></td></tr>
<tr><td>Élection</td><td>Directe</td><td>Indirecte (~160 000 grands électeurs)</td></tr>
<tr><td>Mandat</td><td>5 ans (dissolution possible)</td><td>6 ans, renouvelé par moitié tous les 3 ans</td></tr>
<tr><td>Siège</td><td>Palais Bourbon</td><td>Palais du Luxembourg</td></tr>
<tr><td>Spécificité</td><td>Dernier mot ; peut renverser le Gouvernement</td><td>Représente les collectivités territoriales</td></tr>
</tbody></table></div>
<p>Le Parlement <b>vote les lois et le budget</b> et <b>contrôle le Gouvernement</b>. Réuni à Versailles, il forme le <b>Congrès</b> (révisions de la Constitution).</p>
<h3>Le parcours d’une loi</h3>
<ol><li>Projet (Gouvernement) ou proposition (parlementaire).</li><li>Commission et vote dans les deux chambres (la navette).</li><li>En cas de désaccord, l’Assemblée tranche.</li><li>Contrôle éventuel du Conseil constitutionnel.</li><li>Promulgation et publication au <i>Journal officiel</i>.</li></ol>
<p><b>Article 49.3</b> : le Gouvernement peut faire adopter un texte sans vote, sauf si une motion de censure est adoptée. <b>Référendum</b> : le peuple vote directement (art. 11).</p>`,
traps:["577 députés, 348 sénateurs : ne pas inverser.","Palais Bourbon = Assemblée ; Luxembourg = Sénat.","Sénateurs : élection indirecte, 6 ans."]},

14:{t:"Justice et libertés",obj:"Connaître l’organisation de la justice et vos droits.",
html:`<h3>Deux ordres de juridiction</h3>
<dl class="facts"><dt>Judiciaire</dt><dd>Litiges entre personnes et infractions. Tribunal judiciaire → cour d’appel → <b>Cour de cassation</b>. Tribunal de police (contraventions), tribunal correctionnel (délits), <b>cour d’assises</b> (crimes, avec des jurés tirés au sort).</dd>
<dt>Administratif</dt><dd>Litiges avec l’administration. Tribunal administratif → cour administrative d’appel → <b>Conseil d’État</b>.</dd>
<dt>Spécialisées</dt><dd><b>Conseil de prud’hommes</b> (travail), tribunal de commerce.</dd></dl>
<h3>Vos droits</h3>
<ul><li><b>Présomption d’innocence</b> ; droit à un avocat et à faire appel.</li><li>En <b>garde à vue</b> (24 h renouvelables) : avocat <b>dès le début</b>, médecin, prévenir un proche, droit de se taire, interprète.</li><li><b>Aide juridictionnelle</b> : l’État prend en charge l’avocat des personnes aux revenus modestes.</li><li>Victime : porter plainte au commissariat, à la gendarmerie ou par courrier au procureur.</li></ul>
<h3>Autorités indépendantes</h3>
<dl class="facts"><dt>Défenseur des droits</dt><dd>Gratuit : discriminations, abus de l’administration, droits de l’enfant, déontologie des forces de sécurité.</dd>
<dt>CNIL</dt><dd>Protection des données personnelles (RGPD).</dd>
<dt>Cour des comptes</dt><dd>Contrôle l’argent public.</dd>
<dt>Conseil constitutionnel</dt><dd>Contrôle les lois et les élections nationales.</dd></dl>
<p>La justice est <b>indépendante</b> du Gouvernement (séparation des pouvoirs) et rendue « au nom du peuple français ».</p>`,
traps:["Cour de cassation (judiciaire) ≠ Conseil d’État (administratif).","En garde à vue, l’avocat est garanti dès la première heure.","Prud’hommes = travail ; assises = crimes, avec des jurés."]},

15:{t:"Régions, départements, communes et outre-mer",obj:"L’organisation territoriale et votre propre commune.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Niveau</th><th>Nombre</th><th>Dirigé par</th><th>Compétences</th></tr></thead><tbody>
<tr><td><b>Région</b></td><td>18 (13 + 5)</td><td>Conseil régional (6 ans)</td><td><b>Lycées</b>, TER, économie, formation</td></tr>
<tr><td><b>Département</b></td><td>101 (96 + 5)</td><td>Conseil départemental (6 ans)</td><td><b>Action sociale</b> (RSA, personnes âgées, protection de l’enfance), <b>collèges</b>, routes</td></tr>
<tr><td><b>Commune</b></td><td>~35 000</td><td>Conseil municipal (6 ans) → <b>maire</b></td><td><b>Écoles primaires</b>, état civil, urbanisme</td></tr>
</tbody></table></div>
<p>Intercommunalités : communautés de communes, métropoles. Dernières municipales : <b>mars 2026</b>.</p>
<h3>L’État dans les territoires</h3><p>Le <b>préfet</b> (créé en 1800) représente l’État : sécurité, ordre public, étrangers, naturalisation, contrôle de légalité. Le maire est aussi agent de l’État (état civil, élections).</p>
<h3>Les 13 régions métropolitaines</h3><div class="regs" data-regs></div>
<h3>Outre-mer</h3>
<ul><li><b>5 DROM</b> : Guadeloupe (971), Martinique (972), Guyane (973), La Réunion (974), Mayotte (976). Ils font partie de l’UE.</li><li><b>COM</b> : Polynésie française, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, Saint-Martin, Saint-Barthélemy.</li><li><b>Nouvelle-Calédonie</b> : statut particulier.</li><li>TAAF et Clipperton.</li></ul>
<div class="call tip"><b>À savoir absolument</b>Votre commune et votre maire, votre département (nom et numéro), votre région et son chef-lieu, votre préfet, votre député.</div>`,
traps:["18 régions (13 en métropole), 101 départements.","La Nouvelle-Calédonie et la Polynésie ne sont pas des départements.","École primaire = commune ; collège = département ; lycée = région."]},

16:{t:"Géographie physique et grandes villes",obj:"Visualiser la carte de France.",
html:`<dl class="facts"><dt>Superficie</dt><dd>~550 000 km² en métropole (plus grand pays de l’UE).</dd><dt>Population</dt><dd>~68 millions d’habitants.</dd><dt>Capitale</dt><dd>Paris.</dd><dt>Forme</dt><dd>L’« Hexagone ».</dd></dl>
<h3>Mers</h3><p>Manche et mer du Nord (nord), océan Atlantique (ouest), Méditerranée (sud). La Corse est une île de Méditerranée.</p>
<h3>Voisins</h3><p>En métropole : <b>Belgique, Luxembourg, Allemagne, Suisse, Italie, Monaco, Espagne, Andorre</b>. Outre-mer : <b>Brésil</b> et Suriname (par la Guyane — la frontière avec le Brésil, ~730 km, est la plus longue de France), <b>Pays-Bas</b> (Saint-Martin).</p>
<h3>Montagnes</h3><ul><li><b>Alpes</b> : mont Blanc, 4 805 m.</li><li><b>Pyrénées</b> : frontière avec l’Espagne.</li><li><b>Massif central</b> : volcans (puy de Dôme).</li><li><b>Jura</b>, <b>Vosges</b>.</li></ul>
<h3>Fleuves</h3><div class="tscroll"><table class="t"><thead><tr><th>Fleuve</th><th>Se jette dans</th><th>Villes</th></tr></thead><tbody>
<tr><td>Loire</td><td>Atlantique</td><td>Orléans, Tours, Nantes — le plus long (~1 000 km)</td></tr>
<tr><td>Seine</td><td>Manche</td><td>Paris, Rouen, Le Havre</td></tr>
<tr><td>Rhône</td><td>Méditerranée</td><td>Lyon, Avignon</td></tr>
<tr><td>Garonne</td><td>Atlantique</td><td>Toulouse, Bordeaux</td></tr>
<tr><td>Rhin</td><td>Mer du Nord</td><td>Strasbourg</td></tr></tbody></table></div>
<h3>Villes</h3><p>Paris · Marseille · Lyon · Toulouse · Nice · Nantes · Montpellier · Strasbourg · Bordeaux · Lille. Strasbourg : Parlement européen. Marseille : premier port. Toulouse : aéronautique.</p>`,
traps:["Le Portugal n’a pas de frontière avec la France.","La Loire est le plus long fleuve, pas la Seine.","Deuxième ville : Marseille, pas Lyon."]},

17:{t:"La France en Europe et dans le monde",obj:"Le rôle de la France dans l’UE et les organisations internationales.",
html:`<dl class="facts"><dt>9/05/1950</dt><dd><b>Déclaration Schuman</b> : Journée de l’Europe.</dd><dt>1951</dt><dd>CECA (6 pays).</dd><dt>1957</dt><dd><b>Traité de Rome</b> : CEE ; la France est membre fondateur.</dd><dt>1979</dt><dd>Première élection directe du Parlement européen (Simone Veil présidente).</dd><dt>1985/95</dt><dd>Espace Schengen.</dd><dt>1992</dt><dd><b>Maastricht</b> : Union européenne.</dd><dt>2002</dt><dd>Euro.</dd><dt>2020</dt><dd>Brexit : 27 membres.</dd></dl>
<div class="tscroll"><table class="t"><thead><tr><th>Institution</th><th>Siège</th><th>Rôle</th></tr></thead><tbody>
<tr><td>Parlement européen</td><td>Strasbourg</td><td>Élu tous les 5 ans (2024) ; 81 eurodéputés français</td></tr>
<tr><td>Commission européenne</td><td>Bruxelles</td><td>Propose et exécute</td></tr>
<tr><td>Conseil de l’UE / Conseil européen</td><td>Bruxelles</td><td>Ministres / chefs d’État</td></tr>
<tr><td>Cour de justice de l’UE</td><td>Luxembourg</td><td>Interprète le droit européen</td></tr></tbody></table></div>
<p>Symboles : drapeau bleu à <b>12 étoiles</b>, « Ode à la joie », devise « Unie dans la diversité ». Un citoyen européen vote aux municipales et européennes de son pays de résidence.</p>
<div class="call info"><b>À ne pas confondre</b>Le Conseil de l’Europe (46 pays, Strasbourg, Cour européenne des droits de l’homme) n’est pas l’UE.</div>
<h3>Dans le monde</h3><ul><li>Membre permanent du Conseil de sécurité de l’ONU (droit de veto).</li><li>Fondatrice de l’OTAN (1949), G7, G20.</li><li>Francophonie : ~320 millions de locuteurs (OIF).</li><li>Puissance nucléaire ; 2e espace maritime mondial.</li></ul>`,
traps:["12 étoiles ≠ nombre de pays.","CEDH (Conseil de l’Europe) ≠ Cour de justice de l’UE.","Traité de Rome 1957 (CEE) ≠ Maastricht 1992 (UE)."]},

18:{t:"Droits, devoirs et élections",obj:"Citer droits et devoirs avec assurance.",
html:`<h3>Droits</h3><ul><li><b>Civils</b> : expression, conscience, religion, circulation, association, réunion, vie privée, propriété, égalité.</li><li><b>Politiques</b> (citoyens français, 18 ans) : voter et être élu.</li><li><b>Sociaux</b> : santé, éducation, travail, grève, syndicat, protection sociale, logement décent, asile.</li></ul>
<h3>Devoirs</h3><ul><li>Respecter les lois et les autres.</li><li><b>Payer ses impôts</b> selon ses moyens.</li><li><b>Voter</b> : devoir civique, mais <b>pas obligatoire</b>.</li><li>Défense : recensement à 16 ans et <b>JDC</b> ; service militaire suspendu en 1997.</li><li>Être <b>juré</b> si l’on est tiré au sort.</li><li>Instruire ses enfants (3-16 ans ; formation jusqu’à 18 ans).</li><li>Porter secours à une personne en danger.</li></ul>
<h3>Élections</h3><div class="tscroll"><table class="t"><thead><tr><th>Élection</th><th>Élit</th><th>Tous les</th></tr></thead><tbody>
<tr><td>Présidentielle</td><td>Président</td><td>5 ans (2027)</td></tr><tr><td>Législatives</td><td>Députés</td><td>5 ans (dernières 2024)</td></tr><tr><td>Municipales</td><td>Conseillers → maire</td><td>6 ans (2026)</td></tr><tr><td>Départementales / Régionales</td><td>Conseillers</td><td>6 ans</td></tr><tr><td>Européennes</td><td>Eurodéputés</td><td>5 ans (2024)</td></tr></tbody></table></div>
<p>Le vote est <b>secret</b> (passage obligatoire par l’isoloir) et personnel ; procuration possible. Inscription d’office à 18 ans et, pour les naturalisés, en principe après le décret — vérifiez sur service-public.</p>`,
traps:["Le vote n’est pas obligatoire en France.","Les étrangers non européens ne votent à aucune élection.","L’instruction est obligatoire dès 3 ans (et non 6)."]},

19:{t:"Famille, école, santé et urgences",obj:"Répondre aux mises en situation sur la famille et la vie quotidienne.",
html:`<h3>Famille</h3><ul><li><b>Mariage civil</b> à la mairie, seul valable légalement, <b>avant</b> toute cérémonie religieuse.</li><li>Mariage pour tous depuis 2013 ; PACS depuis 1999.</li><li>Âge minimum 18 ans, consentement libre ; mariage forcé et polygamie interdits.</li><li><b>Autorité parentale</b> conjointe ; toute violence éducative interdite (2019).</li><li>Divorce possible ; égalité successorale entre enfants.</li></ul>
<h3>École</h3><ul><li>Instruction obligatoire de 3 à 16 ans ; école publique gratuite et laïque.</li><li>Tous les cours sont obligatoires (natation, éducation à la sexualité, sciences), pour les filles comme pour les garçons.</li><li>École élémentaire → collège (11-15 ans) → lycée (15-18 ans) → baccalauréat.</li></ul>
<h3>Santé</h3><p><b>Sécurité sociale</b> (1945) : maladie, retraite, famille, accidents du travail. Carte Vitale, médecin traitant, mutuelle ; complémentaire santé solidaire pour les revenus modestes. Vaccins obligatoires pour les enfants ; PMI pour les mères et les bébés.</p>
<h3>Urgences</h3><div class="tscroll"><table class="t"><tbody>
<tr><td><b>15</b></td><td>SAMU</td></tr><tr><td><b>17</b></td><td>Police / Gendarmerie</td></tr><tr><td><b>18</b></td><td>Pompiers</td></tr><tr><td><b>112</b></td><td>Urgence européenne</td></tr><tr><td><b>114</b></td><td>Urgence par SMS</td></tr><tr><td><b>115</b></td><td>SAMU social</td></tr><tr><td><b>119</b></td><td>Enfance en danger</td></tr><tr><td><b>3919</b></td><td>Violences femmes info</td></tr></tbody></table></div>`,
traps:["Un mariage religieux seul n’a aucune valeur légale.","Aucun cours ne peut être refusé pour motif religieux.","15 SAMU, 17 police, 18 pompiers : ne pas confondre."]},

20:{t:"Travail, logement, consommation et banque",obj:"Maîtriser les mises en situation pratiques de l’examen.",
html:`<h3>Travail</h3><ul><li><b>35 heures</b> par semaine ; <b>5 semaines</b> de congés payés ; salaire minimum : le <b>SMIC</b>.</li><li>CDI ou CDD ; période d’essai ; fiche de paie obligatoire.</li><li>Discriminations interdites ; en entretien d’embauche, vous n’avez pas à répondre sur votre religion, une grossesse ou votre vie privée.</li><li>Salaire impayé, licenciement abusif → <b>conseil de prud’hommes</b> (y compris en référé) ; inspection du travail.</li><li>Le travail non déclaré est illégal. France Travail pour les demandeurs d’emploi.</li></ul>
<h3>Logement</h3><ul><li>Bail, dépôt de garantie, état des lieux d’entrée et de sortie.</li><li>Le propriétaire <b>ne peut pas entrer</b> sans votre accord : c’est une violation de domicile.</li><li>Refus de location à cause de l’origine ou du nom = discrimination → plainte ou Défenseur des droits.</li><li>Assurance habitation obligatoire pour le locataire. Aides de la CAF (APL).</li><li>Tapage nocturne (22 h-7 h), tri des déchets, règlement de copropriété.</li></ul>
<h3>Consommation et banque</h3><ul><li><b>Garantie légale de conformité</b> : 2 ans, gratuite, sur un bien neuf.</li><li>Achat en ligne : 14 jours pour se rétracter.</li><li>Aucune banque ne veut vous ouvrir un compte ? <b>Droit au compte</b> via la Banque de France.</li><li>Surendettement : commission de la Banque de France.</li></ul>
<h3>Impôts</h3><p>Déclaration annuelle de revenus (même sans impôt à payer), prélèvement à la source, TVA sur la consommation, taxe foncière pour les propriétaires.</p>`,
traps:["Prud’hommes (travail) ≠ tribunal administratif.","La garantie légale dure 2 ans et est gratuite : aucune assurance n’est nécessaire.","Le propriétaire n’a aucun « droit de visite » sans votre accord."]},

21:{t:"Culture, grandes figures, Panthéon et jours fériés",obj:"Avoir des références culturelles prêtes à citer.",
html:`<div class="tscroll"><table class="t"><thead><tr><th>Domaine</th><th>Noms</th></tr></thead><tbody>
<tr><td>Littérature</td><td><b>Molière</b> (théâtre, XVIIe s.) · La Fontaine · <b>Voltaire</b> · Rousseau · <b>Victor Hugo</b> (Les Misérables) · Balzac · Flaubert · <b>Zola</b> · Proust · Saint-Exupéry (Le Petit Prince) · <b>Camus</b> (Nobel 1957) · Simone de Beauvoir · Annie Ernaux (Nobel 2022)</td></tr>
<tr><td>Sciences</td><td><b>Marie Curie</b> (2 Nobel) · <b>Pasteur</b> (vaccin contre la rage) · Descartes · Pascal · Lavoisier</td></tr>
<tr><td>Arts</td><td><b>Monet</b> (impressionnisme) · Renoir · Cézanne · Delacroix (La Liberté guidant le peuple) · Rodin</td></tr>
<tr><td>Musique</td><td>Debussy · Ravel · Bizet · Édith Piaf · Aznavour</td></tr>
<tr><td>Cinéma</td><td>Les frères <b>Lumière</b> (1895) · Festival de Cannes</td></tr>
<tr><td>Politique</td><td>Jaurès · Clemenceau · <b>Simone Veil</b> · Badinter · Jean Moulin</td></tr></tbody></table></div>
<h3>Le Panthéon</h3><p>« Aux grands hommes, la patrie reconnaissante ». Voltaire, Rousseau, Hugo, Zola, Jaurès, Moulin, Marie Curie, Simone Veil (2018), Joséphine Baker (2021), Manouchian (2024), Badinter (2025).</p>
<h3>Patrimoine</h3><p>Tour Eiffel (1889), Louvre, Arc de triomphe, Notre-Dame (rouverte en décembre 2024), Mont-Saint-Michel, Versailles, châteaux de la Loire, pont du Gard. Le repas gastronomique des Français (2010) et la baguette (2022) sont inscrits à l’UNESCO. Tour de France depuis 1903.</p>
<h3>Les 11 jours fériés</h3><div class="tscroll"><table class="t"><tbody>
<tr><td>1er janv.</td><td>Jour de l’an</td></tr><tr><td>variable</td><td>Lundi de Pâques</td></tr><tr><td>1er mai</td><td>Fête du Travail</td></tr><tr><td><b>8 mai</b></td><td>Victoire de 1945</td></tr><tr><td>variable</td><td>Ascension</td></tr><tr><td>variable</td><td>Lundi de Pentecôte</td></tr><tr><td><b>14 juillet</b></td><td>Fête nationale</td></tr><tr><td>15 août</td><td>Assomption</td></tr><tr><td>1er nov.</td><td>Toussaint</td></tr><tr><td><b>11 nov.</b></td><td>Armistice de 1918</td></tr><tr><td>25 déc.</td><td>Noël</td></tr></tbody></table></div>
<p>+2 en Alsace-Moselle (Vendredi saint, 26 décembre). 10 mai : mémoire de l’esclavage.</p>`,
traps:["Les Misérables = Hugo, pas Zola.","Pasteur = rage ; Curie = radioactivité.","8 mai = 1945 ; 11 novembre = 1918."]},

22:{t:"Répétition de l’entretien",obj:"S’entraîner à voix haute sur les réponses personnelles et les valeurs.",
html:`<p>Aujourd’hui, vous <b>parlez</b>. Ouvrez l’onglet <b>Entretien</b> et suivez ce plan :</p>
<ol><li><b>3 min</b> — Présentez-vous à voix haute (environ 1 minute).</li><li><b>5 min</b> — Répondez aux questions de motivation et de valeurs sans lire ; comparez ensuite avec le modèle.</li><li><b>4 min</b> — Répondez aux mises en situation.</li><li><b>3 min</b> — Relisez votre fiche personnelle.</li></ol>
<h3>Fiche personnelle (à compléter et à retenir)</h3>
<div class="tscroll"><table class="t"><tbody>
<tr><td>Ma commune / mon maire</td><td>____________</td></tr><tr><td>Département (n°) / préfet</td><td>____________</td></tr><tr><td>Région / chef-lieu</td><td>____________</td></tr><tr><td>Mon député</td><td>____________</td></tr><tr><td>Arrivée en France</td><td>____________</td></tr><tr><td>Employeurs et dates</td><td>____________</td></tr><tr><td>Adresses depuis l’arrivée</td><td>____________</td></tr><tr><td>Président / Premier ministre</td><td>Emmanuel Macron / (à vérifier)</td></tr></tbody></table></div>
<div class="call"><b>Cohérence</b>L’agent a votre dossier : dates, adresses, emplois et famille doivent correspondre exactement.</div>
<div class="call tip"><b>Méthode</b>Un fait + un exemple personnel + une valeur. Trois phrases, ni plus ni moins.</div>`,
traps:["Des réponses apprises par cœur et récitées : l’agent le remarque et creuse.","Contredire son dossier.","Critiquer la France ou le gouvernement : restez sur les institutions et les valeurs."]},

23:{t:"Examen blanc final et révision",obj:"Passer un examen blanc complet et revoir ses erreurs.",
html:`<p>Jour d’examen : <b>40 questions, 45 minutes, objectif 32</b> (idéalement 36+). Onglet <b>Examen blanc</b> → « Examen complet ».</p>
<ol><li>Faites-le sans notes.</li><li>Notez les thèmes manqués.</li><li>Ils sont ajoutés automatiquement à « À revoir » dans les flashcards.</li><li>Relisez les modules correspondants.</li></ol>
<h3>Les 20 repères les plus demandés</h3>
<dl class="facts"><dt>Devise</dt><dd>Liberté, Égalité, Fraternité</dd><dt>Art. 1</dt><dd>Indivisible, laïque, démocratique et sociale</dd><dt>1789</dt><dd>Bastille (14/07), DDHC (26/08)</dd><dt>1792</dt><dd>Ire République ; Marseillaise</dd><dt>1848</dt><dd>IIe République ; suffrage masculin ; fin de l’esclavage</dd><dt>1870</dt><dd>IIIe République</dd><dt>1881-82</dt><dd>École Ferry</dd><dt>1905</dt><dd>Laïcité</dd><dt>1918</dt><dd>Armistice 11/11</dd><dt>1940</dt><dd>18 juin ; Vichy</dd><dt>1944</dt><dd>Vote des femmes</dd><dt>1945</dt><dd>8 mai ; Sécurité sociale</dd><dt>1946</dt><dd>IVe République</dd><dt>1957</dt><dd>Traité de Rome</dd><dt>1958</dt><dd>Ve République, 4/10</dd><dt>1962</dt><dd>Président élu au suffrage direct</dd><dt>1981</dt><dd>Abolition de la peine de mort</dd><dt>2002</dt><dd>Euro</dd><dt>577 / 348</dt><dd>Députés / sénateurs</dd><dt>18 / 101</dt><dd>Régions / départements</dd></dl>`,

DEEP.fr = {
3:`<h4>Pourquoi la France insiste-t-elle autant sur l’égalité femmes-hommes ?</h4>
<p>Parce qu’elle a été conquise lentement, et que l’État la considère comme un élément de l’identité républicaine. Chronologie : 1944 droit de vote ; 1946 égalité inscrite au Préambule ; 1965 une femme mariée peut travailler et ouvrir un compte sans son mari ; 1967 contraception (loi Neuwirth) ; 1970 l’autorité parentale conjointe remplace la « puissance paternelle » ; 1975 loi Veil (IVG) et divorce par consentement mutuel ; 1983 égalité professionnelle ; 2000 parité électorale ; 2011 quotas dans les conseils d’administration ; 2024 IVG dans la Constitution.</p>
<h4>Discriminations : ce que la loi interdit</h4>
<p>Le Code pénal énumère plus de 25 critères interdits : origine, sexe, situation de famille, grossesse, apparence physique, nom de famille, lieu de résidence, état de santé, handicap, orientation sexuelle, identité de genre, âge, opinions politiques, activité syndicale, religion, langue… Discriminer à l’embauche, au logement ou dans l’accès à un service est puni jusqu’à 3 ans de prison et 45 000 € d’amende.</p>
<h4>Des cas pour s’entraîner</h4>
<dl class="facts">
<dt>Cas</dt><dd>Une agence immobilière demande des locataires « de préférence sans nom étranger ». → Discrimination (nom, origine). Recours : plainte ou Défenseur des droits.</dd>
<dt>Cas</dt><dd>Un club réserve des créneaux de piscine aux seules femmes d’une religion. → Contraire à l’égalité et à la neutralité s’il s’agit d’un équipement public.</dd>
<dt>Cas</dt><dd>Un frère interdit à sa sœur majeure de sortir. → Elle est libre ; priver quelqu’un de sa liberté peut être un crime (séquestration, violences psychologiques).</dd>
</dl>
<h4>Comment répondre en entretien</h4>
<p>Évitez le « oui, mais… ». L’agent attend une adhésion sans réserve. Structure efficace : principe → exemple de votre vie → conséquence. « Chez nous, ma femme et moi prenons les décisions ensemble ; nos enfants, filles et garçons, ont les mêmes droits et les mêmes chances. »</p>`,

4:`<h4>Le raisonnement qui résout 90 % des questions sur la laïcité</h4>
<p>Posez-vous toujours deux questions : <b>1) qui est la personne ?</b> (agent de l’État ou particulier) et <b>2) où est-elle ?</b> (école jusqu’au lycée, service public, rue, entreprise). L’<b>agent</b> est toujours neutre. Le <b>particulier</b> est libre, avec trois limites : la loi de 2004 (élèves), la loi de 2010 (visage dissimulé) et l’ordre public.</p>
<div class="tscroll"><table class="t"><thead><tr><th>Situation</th><th>Réponse</th><th>Pourquoi</th></tr></thead><tbody>
<tr><td>Une mère voilée accompagne une sortie scolaire</td><td>Autorisé en principe</td><td>Collaboratrice occasionnelle, pas agent ; l’école peut restreindre pour motif d’ordre ou de prosélytisme.</td></tr>
<tr><td>Agent de mairie voilée au guichet</td><td>Interdit</td><td>Agent public.</td></tr>
<tr><td>Conducteur de bus d’une entreprise privée gérant le service public</td><td>Neutralité exigée</td><td>La loi de 2021 étend la neutralité aux délégataires.</td></tr>
<tr><td>Un élève veut sauter un cours de SVT sur l’évolution</td><td>Refusé</td><td>Le programme est obligatoire ; l’école ne s’adapte pas aux croyances.</td></tr>
<tr><td>Crèche de Noël dans une mairie</td><td>Seulement si caractère culturel ou festif, non religieux</td><td>Conseil d’État, 2016.</td></tr>
<tr><td>Prières de rue bloquant la voie</td><td>Peuvent être interdites</td><td>Ordre public, pas parce qu’elles sont religieuses.</td></tr>
<tr><td>Entreprise privée interdisant les signes religieux aux salariés en contact avec la clientèle</td><td>Possible</td><td>Si prévu au règlement intérieur, général et justifié.</td></tr>
</tbody></table></div>
<h4>Le contexte historique de la loi de 1905</h4>
<p>Au XIXe siècle, l’Église catholique pesait lourdement sur l’école et la politique. Après l’affaire Dreyfus, les républicains veulent qu’aucune religion ne domine l’État. La loi de 1905 met fin au Concordat de Napoléon (1801) tout en garantissant le libre exercice des cultes. Les édifices religieux construits avant 1905 appartiennent à l’État ou aux communes, qui les entretiennent (Notre-Dame appartient ainsi à l’État).</p>
<h4>Le blasphème</h4>
<p>Il n’existe pas de délit de blasphème en France (l’ancienne règle d’Alsace-Moselle a été abrogée en 2017) : critiquer ou caricaturer une religion est permis ; injurier ou inciter à la haine contre des <b>personnes</b> en raison de leur religion est interdit.</p>`,

5:`<h4>Comment réviser la Constitution (art. 89)</h4>
<ol><li>Initiative du Président (sur proposition du Premier ministre) ou des parlementaires.</li><li>Vote en termes identiques par l’Assemblée et le Sénat.</li><li>Approbation par <b>référendum</b> ou, si le Président le décide, par le <b>Congrès</b> (les deux chambres réunies à Versailles) à la majorité des 3/5.</li></ol>
<p>C’est ainsi que l’IVG a été inscrite en 2024 : 780 voix pour au Congrès.</p>
<h4>La QPC en pratique</h4>
<p>Depuis 2010, si, lors d’un procès, vous estimez que la loi appliquée porte atteinte à vos droits constitutionnels, vous pouvez soulever une <b>question prioritaire de constitutionnalité</b>. Le juge la transmet au Conseil d’État ou à la Cour de cassation, qui la renvoient au Conseil constitutionnel. S’il vous donne raison, la loi est abrogée pour tous.</p>
<h4>L’État de droit</h4>
<p>L’État lui-même respecte les règles : hiérarchie des normes (Constitution > traités > lois > décrets > arrêtés), juges indépendants, droits fondamentaux protégés. Un maire ou un ministre peut être condamné ; un décret illégal peut être annulé par le juge administratif.</p>`,

7:`<h4>Pourquoi la Révolution a-t-elle éclaté ?</h4>
<ul><li><b>Crise financière</b> : les guerres (dont le soutien à l’indépendance américaine) ont endetté le royaume.</li><li><b>Injustice fiscale</b> : noblesse et clergé ne payaient presque pas d’impôts ; le tiers état (98 % de la population) payait tout.</li><li><b>Idées des Lumières</b> : souveraineté du peuple, égalité, séparation des pouvoirs.</li><li><b>Faim</b> : mauvaises récoltes en 1788, pain cher.</li></ul>
<h4>Ce qui change concrètement</h4>
<p>Fin de la société d’ordres et des privilèges ; égalité devant la loi et l’impôt ; fin de la monarchie absolue ; naissance du citoyen. Les départements (1790) remplacent les provinces pour unifier le pays. L’état civil (naissances, mariages, décès) passe de l’Église à la mairie en 1792.</p>
<h4>La face sombre</h4>
<p>La Révolution a aussi été violente : la Terreur (1793-1794), avec environ 17 000 condamnations à mort officielles, la guerre de Vendée. Le savoir montre une maturité historique.</p>`,

9:`<h4>La IIIe République « fonde » la France républicaine moderne</h4>
<p>Après la défaite de 1870 et la Commune, les républicains doivent convaincre un pays encore très monarchiste et catholique. Leur stratégie : <b>l’école</b>. Le « hussard noir » (instituteur) enseigne la lecture, le calcul, l’histoire nationale et la morale civique dans chaque village. Le français remplace les langues régionales.</p>
<h4>L’affaire Dreyfus en 4 points</h4>
<ol><li>1894 : le capitaine Alfred Dreyfus, juif, est condamné pour espionnage sur de fausses preuves.</li><li>1898 : Zola publie « J’accuse…! » et est condamné pour diffamation.</li><li>La France se divise entre dreyfusards (justice, droits) et antidreyfusards (armée, nation).</li><li>1906 : Dreyfus est réhabilité. L’affaire conduit à la création de la Ligue des droits de l’homme (1898) et prépare la loi de 1905.</li></ol>
<h4>La Grande Guerre</h4>
<p>Guerre des tranchées, 1,4 million de soldats français tués, dont des soldats des colonies (tirailleurs sénégalais, algériens…). Chaque commune a son monument aux morts. Le 11 novembre rend hommage à tous les morts pour la France.</p>`,

10:`<h4>Deux France en 1940</h4>
<p>Après la défaite, le nord et la façade atlantique sont occupés ; le sud reste « zone libre » jusqu’en novembre 1942. À Vichy, le maréchal Pétain reçoit les pleins pouvoirs et crée l’« État français » : fin de la République, devise « Travail, Famille, Patrie », statut des Juifs (octobre 1940), collaboration avec l’Allemagne.</p>
<h4>Les Justes</h4>
<p>De nombreux Français ont caché des Juifs au péril de leur vie : ce sont les « Justes parmi les nations » (plus de 4 000 reconnus en France). Environ 75 % des Juifs de France ont survécu, en partie grâce à cette solidarité.</p>
<h4>La Résistance</h4>
<p>Intérieure (réseaux, maquis, sabotages, presse clandestine) et extérieure (France libre de De Gaulle, avec des soldats des colonies). Le Conseil national de la Résistance (1943) prépare le programme de l’après-guerre : Sécurité sociale, vote des femmes, nationalisations.</p>
<h4>Le devoir de mémoire</h4>
<p>En 1995, Jacques Chirac reconnaît que « la France » a accompli l’irréparable lors de la rafle du Vél d’Hiv. Lieux de mémoire : Mémorial de la Shoah (Paris), Oradour-sur-Glane (village martyr), plages du Débarquement.</p>`,

11:`<h4>Pourquoi la IVe République est-elle tombée ?</h4>
<p>Le Parlement était tout-puissant et divisé : les gouvernements tombaient en moyenne tous les six mois. Face à la guerre d’Algérie et au risque de coup d’État militaire en mai 1958, le Parlement fait appel à de Gaulle, qui exige une nouvelle Constitution avec un <b>exécutif fort</b>.</p>
<h4>Les outils de l’exécutif fort</h4>
<ul><li>Président élu au suffrage direct (depuis 1962), doté de pouvoirs propres : dissolution, référendum, article 16.</li><li>Gouvernement protégé par l’article 49.3 et par la difficulté de faire adopter une motion de censure (majorité absolue).</li><li>Parlementarisme « rationalisé » : le Gouvernement maîtrise une grande partie de l’ordre du jour.</li></ul>
<h4>La guerre d’Algérie</h4>
<p>L’Algérie était française depuis 1830, avec un million d’Européens. La guerre (1954-1962) s’achève par les accords d’Évian et l’indépendance. Environ 800 000 pieds-noirs et des harkis rejoignent la France. C’est une mémoire encore sensible.</p>
<h4>Mai 68</h4>
<p>Révolte étudiante et grève générale d’environ 10 millions de salariés. Résultats : hausse de 35 % du salaire minimum, plus de libertés à l’université et dans les mœurs.</p>`,

12:`<h4>Comment fonctionne l’élection présidentielle</h4>
<p>Pour être candidat : être français, avoir 18 ans et réunir <b>500 parrainages</b> d’élus (maires, députés…) d’au moins 30 départements. Premier tour ; si personne n’a la majorité absolue, second tour entre les deux premiers, deux semaines plus tard.</p>
<h4>La dissolution de 2024</h4>
<p>En juin 2024, après les européennes, le Président a dissous l’Assemblée. Les législatives anticipées ont donné une Assemblée sans majorité absolue, divisée en trois blocs. Conséquences : gouvernements fragiles, motions de censure (le gouvernement Barnier est tombé en décembre 2024) et Premiers ministres successifs. D’où le conseil de vérifier le nom actuel.</p>
<h4>La motion de censure</h4>
<p>Signée par 1/10 des députés, elle n’est adoptée qu’à la majorité absolue des membres (289 voix). Si elle est adoptée, le Premier ministre remet la démission du Gouvernement.</p>
<h4>Les ministres</h4>
<p>Chaque ministère dirige un secteur (Intérieur, Justice, Économie, Éducation…). Le <b>ministre de l’Intérieur</b> est chargé de la police, des préfectures et de la naturalisation : c’est en son nom que votre décret sera préparé.</p>`,

13:`<h4>La vie d’une loi, un exemple réel</h4>
<p>Le « mariage pour tous » (2013) : projet du Gouvernement → débat à l’Assemblée (plus de 130 heures) → Sénat → nouvelle lecture → adoption → saisine du Conseil constitutionnel (validation) → promulgation le 17 mai 2013 → premier mariage à Montpellier le 29 mai.</p>
<h4>Ce que le Parlement contrôle</h4>
<ul><li><b>Questions au gouvernement</b> (mardi et mercredi à l’Assemblée, télévisées).</li><li><b>Commissions d’enquête</b> qui peuvent convoquer toute personne.</li><li><b>Budget</b> : sans loi de finances votée, l’État ne peut pas dépenser.</li></ul>
<h4>Pourquoi le Sénat est-il élu au suffrage indirect ?</h4>
<p>Parce qu’il représente les <b>collectivités territoriales</b>. Ses électeurs sont surtout des conseillers municipaux : les communes rurales pèsent donc beaucoup. Le Sénat est la « chambre de la réflexion » ; il ne peut pas renverser le Gouvernement, et l’Assemblée a le dernier mot.</p>
<h4>Le référendum d’initiative partagée</h4>
<p>Depuis 2008, 1/5 des parlementaires soutenus par 1/10 des électeurs (~4,8 millions de signatures) peuvent provoquer un référendum. Aucun n’a abouti à ce jour.</p>`,

14:`<h4>Contravention, délit, crime</h4>
<div class="tscroll"><table class="t"><thead><tr><th>Infraction</th><th>Exemple</th><th>Juridiction</th><th>Peine maximale</th></tr></thead><tbody>
<tr><td>Contravention</td><td>Stationnement interdit, tapage nocturne</td><td>Tribunal de police</td><td>Amende (jusqu’à 1 500 €, 3 000 € en récidive)</td></tr>
<tr><td>Délit</td><td>Vol, conduite en état d’ivresse, discrimination, violences conjugales</td><td>Tribunal correctionnel</td><td>Jusqu’à 10 ans (20 en récidive)</td></tr>
<tr><td>Crime</td><td>Meurtre, viol, vol à main armée</td><td>Cour d’assises (jurés) ou cour criminelle</td><td>Jusqu’à la perpétuité</td></tr>
</tbody></table></div>
<h4>La garde à vue, étape par étape</h4>
<ol><li>Seulement en cas de soupçon de crime ou de délit puni de prison.</li><li>Durée : 24 h, renouvelable une fois (48 h ; plus en cas de terrorisme ou trafic).</li><li>Vos droits vous sont notifiés dans une langue que vous comprenez.</li><li>Droits : prévenir un proche et son employeur, voir un médecin, un avocat dès le début (commis d’office si besoin), un interprète, le droit de se taire.</li></ol>
<h4>Victime : vos recours</h4>
<ul><li>Plainte au commissariat ou à la gendarmerie (ils ne peuvent pas refuser de l’enregistrer).</li><li>Courrier au procureur de la République.</li><li>Associations d’aide aux victimes (116 006).</li><li>Violences conjugales : 17, 3919 ; le juge peut délivrer une ordonnance de protection qui éloigne l’auteur.</li></ul>`,

18:`<h4>Voter pour la première fois, étape par étape</h4>
<ol><li>Vérifiez votre inscription sur service-public.fr. Les naturalisés sont en principe inscrits automatiquement, mais vérifiez.</li><li>Si vous n’êtes pas inscrit : en mairie ou en ligne, jusqu’au 6e vendredi avant le scrutin.</li><li>Le jour J : une <b>pièce d’identité</b> (obligatoire dans les communes de plus de 1 000 habitants) ; la carte électorale est utile mais pas obligatoire.</li><li>Prenez des bulletins (idéalement de tous les candidats, pour préserver le secret), passez par l’<b>isoloir</b>, glissez le bulletin dans l’enveloppe puis dans l’urne, et signez la liste d’émargement.</li></ol>
<h4>Les devoirs qu’on oublie</h4>
<ul><li><b>Déclarer ses revenus</b> chaque année, même sans impôt à payer.</li><li><b>Recensement</b> des jeunes à 16 ans.</li><li><b>Respecter les décisions de justice</b> et se présenter aux convocations.</li><li><b>Prendre soin de ses enfants</b> : éducation, santé, sécurité.</li><li><b>Respecter les biens publics</b> et l’environnement (déchets, bruit).</li></ul>
<h4>Manifester</h4>
<p>C’est un droit. Les organisateurs doivent déclarer la manifestation en mairie ou en préfecture 3 à 15 jours avant. Les manifestants ne peuvent ni dissimuler leur visage ni porter d’armes. L’autorité peut l’interdire en cas de risque grave pour l’ordre public.</p>`,

19:`<h4>Mariage et famille : ce qui revient souvent</h4>
<ul><li>Publication des bans 10 jours avant, en mairie.</li><li>Cérémonie publique, avec 2 à 4 témoins ; le maire lit les articles du Code civil sur la fidélité, le respect, le secours et l’assistance, et l’éducation des enfants.</li><li>Un ministre du culte qui célèbre un mariage religieux <b>sans</b> mariage civil préalable commet une infraction.</li><li>Un mariage célébré à l’étranger doit être transcrit au consulat pour produire ses effets en France.</li></ul>
<h4>L’école : organisation et règles</h4>
<p>Maternelle (3-6 ans), élémentaire (6-11), collège (11-15, brevet), lycée (15-18, bac). L’école publique est gratuite ; fournitures et cantine peuvent coûter, avec des aides (bourses, tarifs selon les revenus). Les parents participent via les conseils d’école et les associations. L’instruction en famille est possible, mais soumise à autorisation depuis 2022.</p>
<h4>Santé : le bon parcours</h4>
<ol><li>Déclarer un <b>médecin traitant</b> (meilleur remboursement).</li><li>Urgence vitale : <b>15</b>. Hors horaires, sans gravité : médecin de garde (116 117 dans de nombreuses régions) ou pharmacie de garde.</li><li>Sans ressources : Complémentaire santé solidaire ; pour les étrangers sans titre, l’AME.</li></ol>
<h4>Protection de l’enfance</h4>
<p>Tout adulte qui soupçonne des maltraitances sur un enfant doit alerter : 119 (gratuit, 24 h/24). Les parents exercent l’autorité parentale <b>dans l’intérêt de l’enfant</b>, pas comme un pouvoir absolu.</p>`,

20:`<h4>Le contrat de travail : l’essentiel</h4>
<ul><li>Le <b>CDI</b> est la règle ; le <b>CDD</b> n’est possible que dans des cas prévus (remplacement, surcroît d’activité) et pour une durée limitée.</li><li>Période d’essai : chacun peut y mettre fin, jamais pour un motif discriminatoire.</li><li>Heures supplémentaires dès la 36e heure, majorées (25 % puis 50 %).</li><li>Licenciement : entretien préalable, cause réelle et sérieuse ; contestation possible aux prud’hommes dans les 12 mois.</li><li>Représentants du personnel (CSE) dès 11 salariés.</li></ul>
<h4>Le logement : entrée et sortie</h4>
<ol><li>Entrée : bail écrit, état des lieux, dépôt de garantie (max. 1 mois de loyer vide, 2 en meublé), assurance habitation.</li><li>Pendant : payer le loyer, entretenir le logement ; petites réparations à la charge du locataire, grosses (toiture, chaudière) à celle du propriétaire.</li><li>Sortie : préavis de 3 mois (1 mois en meublé ou en zone tendue) ; dépôt rendu sous 1 mois si l’état est identique, 2 mois en cas de dégradations.</li></ol>
<p>Logement indigne (humidité, insalubrité) : la commune et la CAF peuvent intervenir.</p>
<h4>Consommation</h4>
<ul><li><b>Garantie légale de conformité</b> : 2 ans, biens neufs, réparation ou remplacement gratuits.</li><li><b>Garantie des vices cachés</b> : défaut caché rendant le bien impropre à l’usage (aussi pour l’occasion).</li><li>Vente à domicile ou en ligne : 14 jours pour se rétracter.</li><li>Litige : accord amiable → médiateur de la consommation → justice.</li></ul>
<h4>Argent et arnaques</h4>
<p>Une banque ne demande jamais votre code par téléphone ou SMS. En cas de fraude à la carte : faire opposition et contester dans les 13 mois ; la banque doit rembourser les opérations non autorisées.</p>`

const $ = s=>document.querySelector(s);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============================ CLOUD (Supabase, optional) ============================ */
const Cloud = {
  sb:null, session:null, isAdmin:false, timer:null, status:"",
  enabled(){ return !!(CONFIG.supabase.url && CONFIG.supabase.anonKey); },
  async init(){
    if(!this.enabled()) return;
    try{
      await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      this.sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data} = await this.sb.auth.getSession(); this.session=data.session;
      this.sb.auth.onAuthStateChange((ev,s)=>{ const was=!!this.session; this.session=s; if(s&&!was){ this.pull(); } if(!s){ this.isAdmin=false; renderTabs(); } if(view==="acc") go("acc"); });
      if(this.session) await this.pull();
    }catch(e){ this.sb=null; }
  },
  uid(){ return this.session && this.session.user && this.session.user.id; },
  async pull(){
    if(!this.sb||!this.uid()) return;
    try{
      const {data,error} = await this.sb.from("profiles").select("*").eq("id",this.uid()).maybeSingle();
      if(error) throw error;
      if(data){
        const p=data.progress||{};
        S.done=[...new Set([...(S.done||[]),...(p.done||[])])];
        S.fc=Object.assign({},p.fc||{},S.fc||{});
        S.best=Math.max(S.best??-1,p.best??-1); if(S.best<0) S.best=null;
        if(!S.name && data.display_name) S.name=data.display_name;
        if(!S.examDate && data.exam_date) S.examDate=data.exam_date;
        if(!S.intDate && p.intDate) S.intDate=p.intDate;
        saveLocal();
      }
      await this.push();
      const a = await this.sb.from("admins").select("user_id").eq("user_id",this.uid()).maybeSingle();
      this.isAdmin = !!(a && a.data);
      renderTabs(); progress(); if(["home","mods","acc"].includes(view)) go(view);
    }catch(e){ this.status="err"; }
  },
  schedule(){ if(!this.sb||!this.uid()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.push(),1500); },
  async push(){
    if(!this.sb||!this.uid()) return;
    const row={id:this.uid(),display_name:S.name||null,lang:S.lang,exam_date:S.examDate||null,
      progress:{done:S.done,fc:S.fc,best:S.best,last:S.last,intDate:S.intDate||null},updated_at:new Date().toISOString()};
    const {error}=await this.sb.from("profiles").upsert(row);
    this.status = error?"err":"ok";
    const f=$("#syncFlash"); if(f){ f.textContent=T(error?"syncErr":"syncOk"); f.className="flash"+(error?" err":""); }
  },
  async signIn(email){ return this.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}); },
  async signOut(){ await this.sb.auth.signOut(); this.session=null; this.isAdmin=false; },
  async del(){ const {error}=await this.sb.rpc("delete_my_account"); if(!error){ await this.sb.auth.signOut().catch(()=>{}); this.session=null; this.isAdmin=false; } return error; },
  async adminList(){ const {data,error}=await this.sb.from("profiles").select("id,display_name,lang,progress,updated_at,created_at").order("updated_at",{ascending:false}).limit(2000); if(error) throw error; return data||[]; }

function quizBlock(box,qs,onScore){

/* ============================ FLASHCARDS ============================ */
let fcDeck=[],fcI=0,fcFilter="all";
function buildDeck(){
  let d=BANK.slice();
  if(fcFilter==="rev") d=d.filter(q=>S.fc[q.id]==="rev");
  else if(fcFilter==="new") d=d.filter(q=>!S.fc[q.id]);
  else if(fcFilter!=="all") d=d.filter(q=>q.mod===+fcFilter);
  fcDeck=shuffle(d); fcI=0;
}
function vFC(el){
  if(!fcDeck.length) buildDeck();
  const vals=Object.values(S.fc), known=vals.filter(v=>v==="ok").length, rev=vals.filter(v=>v==="rev").length;
  const M=mods();
  el.innerHTML=`<span class="lbl">${T("tabs.fc")} · ${BANK.length}</span><h2 style="margin-top:6px">${T("fcTitle")}</h2>
  <div class="fc-tools"><label for="fcSel" class="lbl">${T("fcDeck")}</label><select id="fcSel">
   <option value="all">${T("fcAll")}</option><option value="rev">${T("fcRev")} (${rev})</option><option value="new">${T("fcNew")} (${BANK.length-known-rev})</option>
   ${M.filter(m=>BANK.some(q=>q.mod===m.id)).map(m=>`<option value="${m.id}">${T("day")} ${m.id} · ${esc(m.t)}</option>`).join("")}</select>
   <span class="lbl">✓ ${known} · ↻ ${rev}</span></div><div id="fcArea"></div>`;
  const sel=el.querySelector("#fcSel"); sel.value=fcFilter;
  sel.onchange=()=>{fcFilter=sel.value;buildDeck();vFC(el);};
  drawCard(el.querySelector("#fcArea"),el);
}
function drawCard(area,root){
  if(!fcDeck.length){area.innerHTML=`<p class="muted" style="text-align:center;padding:40px 0">${T("fcEmpty")}</p>`;return;}
  if(fcI>=fcDeck.length){area.innerHTML=`<div class="panel" style="text-align:center"><h3>${T("fcDone")}</h3><p>${T("fcPassed",{n:fcDeck.length})}</p><button class="btn pri" id="again">${T("fcShuffle")}</button></div>`;area.querySelector("#again").onclick=()=>{buildDeck();vFC(root);};return;}
  const q=fcDeck[fcI];
  area.innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="${T("flip")}"><div class="card-in">
    <div class="face"><span class="lbl">${T("day")} ${q.mod} · ${T("cat."+catOf(q.mod))}</span><div class="big" lang="fr">${esc(q.q)}</div><div class="hint">${T("fcHint")}</div></div>
    <div class="face back"><span class="lbl">${T("fcAnswer")}</span><div class="big" lang="fr">${esc(q.o[0])}</div><div class="hint">${esc(ex(q))}</div></div>
  </div></div>
  <div class="fc-nav"><button class="btn" id="fPrev" ${fcI===0?"disabled":""} aria-label="←">←</button><button class="btn rev" id="fRev">↻ ${T("fcAgain")}</button><button class="btn ok" id="fOk">✓ ${T("fcKnow")}</button><button class="btn" id="fNext" aria-label="→">→</button></div>
  <div class="counter">${fcI+1} / ${fcDeck.length}</div>`;
  const card=area.querySelector("#card"); const flip=()=>card.classList.toggle("flip");
  card.onclick=flip; card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}};
  const mark=v=>{S.fc[q.id]=v;save();fcI++;drawCard(area,root);};
  area.querySelector("#fOk").onclick=()=>mark("ok"); area.querySelector("#fRev").onclick=()=>mark("rev");
  area.querySelector("#fNext").onclick=()=>{fcI++;drawCard(area,root);}; area.querySelector("#fPrev").onclick=()=>{fcI--;drawCard(area,root);};
}

function vSim(el){
  clearInterval(simInt);
  el.innerHTML=`<span class="lbl">${T("tabs.sim")}</span><h2 style="margin-top:6px">${T("simTitle")}</h2>
  <div class="sim-start">
   <div class="panel"><h3>${T("simFull")}</h3><p>${T("simFullD")}</p><button class="btn pri" data-n="40">${T("simGo")} · 45 min</button></div>
   <div class="panel"><h3>${T("simQuick")}</h3><p>${T("simQuickD")}</p><button class="btn" data-n="10">${T("simGo")} · 12 min</button></div>
   <div class="panel"><h3>${T("simErr")}</h3><p>${T("simErrD")}</p><button class="btn" data-n="rev">${T("simGo")}</button></div>
  </div><div id="simMsg"></div>`;
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>startSim(el,b.dataset.n));
}
function startSim(el,n){
  let qs;
  if(n==="rev"){ qs=shuffle(BANK.filter(q=>S.fc[q.id]==="rev")).slice(0,40);
    if(!qs.length){el.querySelector("#simMsg").innerHTML=`<div class="call info"><b>${T("simErr")}</b>${T("simNone")}</div>`;return;} }
  else{ const spread=(src,count)=>{ const byMod={}; shuffle(src).forEach(q=>(byMod[q.mod]=byMod[q.mod]||[]).push(q));
      const mk=shuffle(Object.keys(byMod)); const pool=[]; let k=0;
      while(pool.length<count && pool.length<src.length){const mm=mk[k%mk.length]; if(byMod[mm].length) pool.push(byMod[mm].pop()); k++;}
      return pool; };
    const nSit = n==="40"?12:3;  // format officiel : 28 connaissances + 12 mises en situation
    qs=shuffle(spread(BANK.filter(q=>q.sit),nSit).concat(spread(BANK.filter(q=>!q.sit),+n-nSit))); }
  const total=qs.length, limit=n==="10"?720:(n==="rev"?Math.max(120,Math.round(total*67.5)):2700);
  let left=limit; const answers=new Array(total).fill(null);
  const P=qs.map(q=>({q,opts:shuffle(q.o.map((t,j)=>({t,c:j===0})))}));
  el.innerHTML=`<div class="simbar"><span class="clock" id="sClk"></span><span class="lbl" id="sCount">0/${total} ${T("answered")}</span><span style="margin-left:auto"></span><button class="btn pri sm" id="sEnd">${T("submit")}</button></div><div id="sQs"></div><div class="foot"><span></span><button class="btn pri" id="sEnd2">${T("submitAll")}</button></div>`;
  el.querySelector("#sQs").innerHTML=P.map((p,i)=>`<div class="q" data-i="${i}"><p class="qt"><span class="lbl">Q${i+1} · ${T("cat."+catOf(p.q.mod))}</span><br><span lang="fr">${esc(p.q.q)}</span></p><div class="opts" lang="fr">${p.opts.map((o,j)=>`<button data-j="${j}" aria-pressed="false">${esc(o.t)}</button>`).join("")}</div></div>`).join("");
  el.querySelectorAll("#sQs .q").forEach(qe=>{const i=+qe.dataset.i;qe.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    answers[i]=+b.dataset.j; qe.querySelectorAll("button").forEach(x=>{x.setAttribute("aria-pressed",x===b);x.classList.toggle("sel",x===b);});
    el.querySelector("#sCount").textContent=answers.filter(a=>a!==null).length+"/"+total+" "+T("answered");});});
  const clk=el.querySelector("#sClk");
  const draw=()=>{clk.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");clk.classList.toggle("low",left<300);};
  const finish=()=>{ clearInterval(simInt); simInt=null;
    let ok=0; P.forEach((p,i)=>{const r=answers[i]!==null&&p.opts[answers[i]].c; if(r){ok++; if(n==="rev") S.fc[p.q.id]="ok";} else S.fc[p.q.id]="rev";});
    const pct=Math.round(ok/total*100), pass=pct>=80;
    if(n==="40"&&(S.best==null||ok>S.best)) S.best=ok; save();
    const used=limit-left;
    el.innerHTML=`<div class="panel score"><span class="lbl">${T("result")}</span><div class="big ${pass?"pass":"fail"}">${ok} / ${total}</div>
      <p><b class="${pass?"pass":"fail"}">${pass?T("pass"):T("fail")}</b> · ${pct} % (${T("minPct")}) · ${T("used")} ${Math.floor(used/60)} min ${used%60} s</p>
      <p class="note" style="margin:0">${T("addedRev")}</p>
      <div class="row" style="margin-top:14px"><button class="btn pri" id="again">${T("newSim")}</button><button class="btn" id="toFc">${T("revFc")}</button></div></div>
      <div class="section-h" style="border:0"><h3>${T("correction")}</h3></div>
      ${P.map((p,i)=>{const a=answers[i];const r=a!==null&&p.opts[a].c;return `<div class="q"><p class="qt"><span class="lbl" style="color:${r?"var(--good)":"var(--rouge)"}">Q${i+1} · ${r?T("qRight"):T("qWrong")}</span><br><span lang="fr">${esc(p.q.q)}</span></p>
      <div class="opts" lang="fr">${p.opts.map((o,j)=>`<button disabled class="${o.c?"right":(j===a?"wrong":"")}">${esc(o.t)}</button>`).join("")}</div><div class="expl">${esc(ex(p.q))}</div></div>`;}).join("")}`;
    el.querySelector("#again").onclick=()=>vSim(el);
    el.querySelector("#toFc").onclick=()=>{fcFilter="rev";buildDeck();go("fc");};
    window.scrollTo(0,0);
  };
  draw(); simInt=setInterval(()=>{left--;draw();if(left<=0)finish();},1000);
  el.querySelector("#sEnd").onclick=finish; el.querySelector("#sEnd2").onclick=finish;
}
